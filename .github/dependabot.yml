# One configuration for the whole workspace. The uv workspace has one lock at the
# root, so one uv entry covers every Python member. Add a cargo entry for "/" in
# the same change that imports the first crate (an empty Cargo workspace has no
# lock to update).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /packages/observer
    schedule:
      interval: weekly
