# One configuration for the whole workspace. The uv workspace has one lock at the
# root, so one uv entry covers every Python member. Add a cargo entry for "/" in
# the same change that imports the first crate (an empty Cargo workspace has no
# lock to update). Each Python member groups its updates into one pull request per
# week, so a release wave of small bumps arrives as a handful of reviews, not thirteen.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      # Our own family first, so a release of one of them reaches every member the same day.
      family:
        patterns:
          - "agent-evidence-*"
          - "probity-verify"
          - "jcs-admit"
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /examples/checkout-runner
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /examples/keycloak-quickstart
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /packages/agent-evidence-mcp
    schedule:
      interval: weekly
