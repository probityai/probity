# One configuration for the whole workspace. The uv workspace has one lock at the
# root, so one uv entry covers every Python member. Add a cargo entry for "/" in
# the same change that imports the first crate (an empty Cargo workspace has no
# lock to update). Each Python member groups its updates into one pull request per
# week, so a release wave of small bumps arrives as a handful of reviews, not thirteen.
# Retained evidence is not listed below on purpose. The interop experiments under
# packages/agent-evidence-observer/interop/ keep their manifests and locks byte for byte
# against recorded digests, so no entry here proposes a bump for them. Dependabot still
# raises security alerts on those files, and no setting in this file silences an alert, so
# .github/retained-evidence.toml names the paths and scripts/retained_alerts.py dismisses
# their alerts with the reason. Every other manifest is live and is bumped.
version: 2
# One pull request for every manifest that must move together (see the keycloak entries).
multi-ecosystem-groups:
  keycloak:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    # Dependabot moves uv.lock only. The pin-refresh workflow owns the family specifiers, and
    # the observer pyproject is byte-pinned by the framework-consumer contract, so a specifier
    # edit from Dependabot fails the reproduce job.
    versioning-strategy: lockfile-only
    ignore:
      # The agent-evidence-observer inspect-historical extra holds inspect-ai at an exact
      # version, moved by hand. Dependabot rewrites toward the newer inspect extra and its
      # resolve fails, which blocks every grouped python update.
      - dependency-name: "inspect-ai"
    groups:
      # Our own family first, so a release of one of them reaches every member the same day.
      family:
        patterns:
          - "agent-evidence-*"
          - "agent-evidence-verify"
          - "jcs-admit"
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /examples/checkout-runner
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /packages/agent-evidence-mcp
    schedule:
      interval: weekly
  # The Keycloak listener. keycloak.version moves all four Keycloak artifacts, and the end-to-end
  # image in e2e/docker-compose.yml must name the same release, so the Maven and Docker Compose
  # entries share one multi-ecosystem group: one pull request moves the pom and the image together.
  # jboss-logging and jakarta.ws.rs-api follow what keycloak-parent of that release manages, so
  # neither is bumped on its own. build.sh fails on any drift between the three, and e2e/run.sh when
  # the pinned image ships other jars. Every bump changes maven.lock: the failed CI run's
  # keycloak-evidence-hook-e2e artifact carries the resolved lock as resolved.lock.
  - package-ecosystem: maven
    directory: /integrations/keycloak-evidence-hook
    patterns: ["*"]
    multi-ecosystem-group: keycloak
    ignore:
      - dependency-name: "org.jboss.logging:jboss-logging"
      - dependency-name: "jakarta.ws.rs:jakarta.ws.rs-api"
  - package-ecosystem: docker-compose
    directory: /integrations/keycloak-evidence-hook/e2e
    patterns: ["*"]
    multi-ecosystem-group: keycloak
