# Moved from packages/observer/.github/workflows/langgraph-native-ticket.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: LangGraph protected ticket integration
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-langgraph-native-ticket.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-langgraph-native-ticket.yml'
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-pinned profile dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-restart.lock --report install-report.json
      - name: Install this exact Observer checkout without changing dependency selection
        run: |
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check reader code and complexity
        run: |
          python -m ruff check --isolated lg_common.py lg_reader.py durable_reader.py verify_retained.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' lg_common.py lg_reader.py durable_reader.py verify_retained.py tests
      - name: Test the retained packets and semantic refusal controls
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Verify the retained packets offline with public code only
        run: python verify_retained.py
      - name: Reconstruct the retained packets with the reader command line
        run: |
          set -euo pipefail
          cp retained/fresh-run/consumer-pins.json "$RUNNER_TEMP/langgraph-selected-pins.json"
          python lg_reader.py retained/fresh-run --pins-file "$RUNNER_TEMP/langgraph-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/fresh-reader.json"
          cmp "$RUNNER_TEMP/fresh-reader.json" retained/fresh-reader.json
          cp retained/durable-run/consumer-pins.json "$RUNNER_TEMP/langgraph-durable-selected-pins.json"
          python durable_reader.py retained/durable-run --pins-file "$RUNNER_TEMP/langgraph-durable-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/durable-reader.json"
          cmp "$RUNNER_TEMP/durable-reader.json" retained/durable-reader.json
