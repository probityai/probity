name: AG2 push URL authority and observed effects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/ag2-push-authority-2026-10-04/**', 'packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/pyproject.toml', '.github/workflows/package-observer-ag2-push-authority.yml']
  pull_request:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/ag2-push-authority-2026-10-04/**', 'packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/pyproject.toml', '.github/workflows/package-observer-ag2-push-authority.yml']

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  installed-three-transport-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Install the public observer and the reader
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/ag2-push-authority-2026-10-04"
          python -m venv "$RUNNER_TEMP/reader"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements-reader.lock"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --no-deps "$GITHUB_WORKSPACE/packages/agent-evidence-observer" "$profile"
          "$RUNNER_TEMP/reader/bin/python" -m pip check
      - name: Check the retained record with public code only
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/ag2-push-authority-2026-10-04"
          "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/verify_retained.py"
      - name: Refuse changed semantics after their hashes are reselected
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/ag2-push-authority-2026-10-04"
          "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/verify_retained.py" --materialize "$RUNNER_TEMP/run"
          AG2_PUSH_PACKET="$RUNNER_TEMP/run/packet" "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/test_controls.py" -v
