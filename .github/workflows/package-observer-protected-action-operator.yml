# Moved from packages/observer/.github/workflows/protected-action-operator.yml when the package was imported;
# its steps run from packages/observer.
name: Protected action operator

on:
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-protected-action-operator.yml']
    branches: [main]
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-protected-action-operator.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  installed-operator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
      - name: Installed source and real operator controls
        run: bash interop/protected-action-operator-2026-10-06/verify_install.sh "$RUNNER_TEMP/protected-operator"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: protected-action-operator
          retention-days: 90
          path: |
            ${{ runner.temp }}/protected-operator/native
            ${{ runner.temp }}/protected-operator/existing-native
            ${{ runner.temp }}/protected-operator/http-target-companion
            ${{ runner.temp }}/protected-operator/wheels
            ${{ runner.temp }}/protected-operator/*-tests.xml
            ${{ runner.temp }}/protected-operator/*-install.txt
            ${{ runner.temp }}/protected-operator/*-source-*.json
            ${{ runner.temp }}/protected-operator/existing-witness-complexity.json
            ${{ runner.temp }}/protected-operator/protected-operator-complexity.json
            ${{ runner.temp }}/protected-operator/existing-reader-report.json
            ${{ runner.temp }}/protected-operator/existing-reader-repeat-report.json
