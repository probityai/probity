# Moved from packages/observer/.github/workflows/protected-action-operator.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Protected action operator

on:
  push:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-protected-action-operator.yml']
    branches: [main]
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-protected-action-operator.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-operator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install the public observer and the reader-side packages
        run: |
          python -m pip install --require-hashes -r interop/witness-operator-2026-10-03/requirements.lock
          python -m pip install --no-deps --no-build-isolation . interop/witness-operator-2026-10-03 interop/protected-action-operator-2026-10-06
      - name: Run the reader controls
        run: python -m pytest -c /dev/null -q -p no:cacheprovider interop/protected-action-operator-2026-10-06/test_reader.py --junitxml="$RUNNER_TEMP/reader-tests.xml"
      - name: Check complexity
        run: python -I -B -m radon cc -j interop/protected-action-operator-2026-10-06/probity_protected_operator > "$RUNNER_TEMP/protected-operator-complexity.json"
      - name: Replay the retained packets with public code
        run: python -I -B interop/protected-action-operator-2026-10-06/verify_retained.py | tee "$RUNNER_TEMP/retained-replay.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: protected-action-operator-retained-replay
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/reader-tests.xml
            ${{ runner.temp }}/protected-operator-complexity.json
            ${{ runner.temp }}/retained-replay.txt
