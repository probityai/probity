# Moved from packages/observer/.github/workflows/agent-launcher.yml when the package was imported;
# its steps run from packages/observer.
name: Agent launcher

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-agent-launcher.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-agent-launcher.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the package and the verifier with the done-receipt checks
        run: >-
          python -m pip install -e '.[test]'
          'probity-verify @ git+https://github.com/probityai/probity-verify@5104564bf40291c31ee1d452cfe7c5f8ffa87908'
      - name: Sensor, join and docker launch tests
        run: pytest -q tests/launch
      - name: Every join mutant fails the tests
        run: python scripts/mutate-launch-joins.py
      - name: Launched runs reach the expected probity-verify verdicts
        run: python scripts/check-launch-verify.py ./launch-xcheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: launch-xcheck
          path: packages/observer/launch-xcheck/
