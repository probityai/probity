# Moved from packages/observer/.github/workflows/five-tier-native.yml when the package was imported;
# its steps run from packages/observer.
name: Five-tier native launch

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-five-tier-native.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-five-tier-native.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  five-tier-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install selected native profiles
        run: |
          python -m pip install -e '.[test,inspect]'
          python -m pip install -e 'interop/a2a-native-2026-10-02[test]'
      - name: Check child failure and report controls
        run: python -m pytest -q tests/test_five_tier_launcher.py --junitxml=five-tier-launch-tests.xml
      - name: Run all declared native profiles
        run: python examples/five_tier_demo.py ./five-tier-native-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: five-tier-native-run
          path: |
            packages/observer/five-tier-native-run/
            packages/observer/five-tier-launch-tests.xml
          if-no-files-found: error
