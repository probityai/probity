name: Inspect sealed manifest

on:
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-inspect-sealed-manifest.yml']
  push:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-inspect-sealed-manifest.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  sealed-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../probity-verify -e '.[test,inspect,witness]'
      - run: python -m pytest -q tests/test_inspect_sealed_manifest.py
      - run: python -m pytest -q interop/inspect-sealed-manifest-2026-11-03/test_real_run.py
