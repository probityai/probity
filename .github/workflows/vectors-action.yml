name: vectors-action

# Replays the source-coverage corpus shipped in a pinned agent-evidence-vectors
# release against this checkout's probity-verify, through the same GitHub
# Action any other verifier author would use. The in-tree check in
# conformance.yml reads the vendored copy; this job reads the published one,
# so a drift between the two shows up as a red run here.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: install this checkout's verifier into its own environment
        run: |
          uv venv --python 3.12 .build/verifier
          uv pip install --python .build/verifier/bin/python .
          .build/verifier/bin/probity-verify --help > /dev/null
      - name: replay the published source-coverage corpus
        uses: probityai/agent-evidence-vectors@33d545104ff2f8c124cff465c96c013eeb809156 # v0.18.1
        with:
          corpus: vectors-source-coverage
          verifier: .build/verifier/bin/probity-verify
