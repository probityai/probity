# Moved from packages/observer/.github/workflows/remora-effect-bridge.yml when the package was imported;
# its steps run from packages/observer.
name: REMORA local effect crosswalk

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-remora-effect-bridge.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-remora-effect-bridge.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  local-effect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: darklordVirtual/REMORA-research
          ref: b25e735d36590154ff53768b4d245ad4c7996f64
          path: packages/observer/remora-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_remora_effect_bridge.py
      - name: Run and check local effects
        run: |
          python examples/remora_effect_bridge.py ./remora-bridge-run --remora-vectors ./remora-source/conformance/autoreview-to-effect-v1/vectors.json > bridge-stdout.json
          python examples/remora_effect_bridge.py ./remora-bridge-run --remora-vectors ./remora-source/conformance/autoreview-to-effect-v1/vectors.json --verify > bridge-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remora-local-effect-run
          path: |
            packages/observer/remora-bridge-run/
            packages/observer/bridge-stdout.json
            packages/observer/bridge-verification.json
