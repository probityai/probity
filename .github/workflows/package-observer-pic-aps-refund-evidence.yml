# Moved from packages/observer/.github/workflows/pic-aps-refund-evidence.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Native PIC and APS refund evidence

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/pic-aps-refund-reader-2026-10-09/**'
      - 'packages/agent-evidence-observer/interop/aps-durable-refund-2026-10-05/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - 'packages/agent-evidence-observer/interop/**/requirements*.lock'
      - 'packages/agent-evidence-observer/scripts/check-runtime-locks.py'
      - 'packages/agent-evidence-observer/docs/PIC-APS-REFUND-EVIDENCE.md'
      - 'packages/agent-evidence-observer/docs/reference/PIC-APS-REFUND-EVIDENCE.md'
      - 'packages/agent-evidence-observer/.gitattributes'
      - '.github/workflows/package-observer-pic-aps-refund-evidence.yml'
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-pic-aps-refund-evidence.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  readonly-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
      - name: Build installed readers and check the original native evidence
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/pic-aps-refund-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash interop/pic-aps-refund-reader-2026-10-09/verify_install.sh "$results"
      - name: Retain every completed phase and refusal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pic-aps-refund-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pic-aps-refund-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/pic-aps-refund-${{ github.run_id }}-${{ github.run_attempt }}/.venv/
            !${{ runner.temp }}/pic-aps-refund-${{ github.run_id }}-${{ github.run_attempt }}/PIC-source/
            !${{ runner.temp }}/pic-aps-refund-${{ github.run_id }}-${{ github.run_attempt }}/.coverage
