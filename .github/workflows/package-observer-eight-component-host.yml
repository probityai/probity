# Moved from packages/observer/.github/workflows/eight-component-host.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Eight component host retained replay
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/eight-component-host-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-eight-component-host.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/eight-component-host-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-eight-component-host.yml'
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/eight-component-host-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected reader dependencies and the exact Observer checkout
        run: |
          python -m venv "$RUNNER_TEMP/retained-venv"
          "$RUNNER_TEMP/retained-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          "$RUNNER_TEMP/retained-venv/bin/python" -m pip install --no-deps ../..
          "$RUNNER_TEMP/retained-venv/bin/python" -m pip check
      - name: Lint the retained replay
        run: |
          "$RUNNER_TEMP/retained-venv/bin/python" -m ruff check --isolated verify_retained.py tests
          "$RUNNER_TEMP/retained-venv/bin/python" -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' verify_retained.py tests
      - name: Verify the retained run with public observer code
        run: |
          "$RUNNER_TEMP/retained-venv/bin/python" -I verify_retained.py
          "$RUNNER_TEMP/retained-venv/bin/python" -m pytest -q tests
