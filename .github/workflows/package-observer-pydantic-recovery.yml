# Moved from packages/observer/.github/workflows/pydantic-recovery.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Pydantic native deferred recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-pydantic-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-pydantic-recovery.yml'
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-and-installed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install the locked test tools and exact Observer checkout
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check semantic refusal controls over the retained packet
        run: |
          python -m ruff check --isolated recovery_host.py verify_retained.py probity_pydantic_recovery tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' recovery_host.py verify_retained.py probity_pydantic_recovery tests
          timeout --signal=TERM --kill-after=5s 180s python -m pytest -q tests --junitxml=test-results.xml
      - name: Verify the retained original packet with public observer code
        run: python verify_retained.py
      - name: Install a framework-free reader and replay the retained packet through the host gate
        run: bash verify_install.sh "$(command -v python)"
      - name: Retain installed-reader receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pydantic-deferred-recovery-${{ github.sha }}
          path: |
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/installed-receipts/
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/installed-repeat/
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/install-report.json
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/reader-install-report.json
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/test-results.xml
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/wheels-sha256.txt
            packages/agent-evidence-observer/interop/pydantic-recovery-2026-10-03/wheels/*.whl
          if-no-files-found: error
          retention-days: 90
