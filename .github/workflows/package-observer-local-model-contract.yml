# Moved from packages/observer/.github/workflows/local-model-contract.yml when the package was imported;
# its steps run from packages/observer.
name: Local model record contract
on:
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-local-model-contract.yml']
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-local-model-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/observer

jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 hypothesis==6.168.3
      - name: Check the local-model reader's refusal contract
        working-directory: packages/observer/interop/local-model-2026-10-02
        run: python -m pytest tests -q
      - name: Check the operational task matrix reader and frozen rubric
        working-directory: packages/observer/interop/local-model-tasks-2026-10-02
        run: python -m pytest tests -q
      - name: Check paired model comparison selections, order and resource refusals
        working-directory: packages/observer/interop/local-model-comparison-2026-10-02
        run: python -m pytest tests -q
      - name: Check frozen native schema format-control selections and independent scores
        working-directory: packages/observer/interop/local-model-format-control-2026-10-02
        run: python -m pytest tests -q
      - name: Check new authored boundary tasks and CPU envelope reconstruction
        working-directory: packages/observer/interop/local-model-boundary-tasks-2026-10-02
        run: python -m pytest tests -q
