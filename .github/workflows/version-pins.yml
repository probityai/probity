name: version-pins

# Holds every version README.md and docs/architecture name to its owner (a package
# manifest, or the family lock in version-pins.toml), and once a day compares the
# manifests, tags, registries and family lock: a pin that lags the newest release
# by more than one release or one day fails here. pin-refresh moves the lock. The pull-request
# check of the pins on a page is the version-pins job of ci.yml.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: manifests, tags, registries and the family lock agree
        uses: probityai/.github/actions/version-pins@bfaca9ac2695e0bb5c669adaf19c7caad19761d3 # main
        with:
          command: registry
