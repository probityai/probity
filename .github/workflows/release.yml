      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

  publish-agent-evidence-observer:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'agent-evidence-observer' && needs.resolve.outputs.published == 'false'
    runs-on: ubuntu-24.04
    environment:
