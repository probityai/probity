      - name: attest the checked distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/dist/*
      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

  publish-probity-ratchet-cases:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probity-ratchet-cases' && needs.resolve.outputs.published == 'false'
    runs-on: ubuntu-24.04
