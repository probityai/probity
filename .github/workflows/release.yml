name: release

# Publish one workspace member to PyPI from a GitHub release whose tag is
# <distribution>-v<version>, for example probity-verify-v0.2.0. The tag must name
# a member, match its pyproject version and point at a commit on main (or on the
# maintenance branch maint/<distribution>-<major>.<minor> of its own series). The files
# published are the ones python-build.yml built and checked in this run.
#
# PyPI trusted publisher, one entry per distribution, all alike: owner probityai,
# repository probity, workflow release.yml, environment pypi. Each distribution
# has its own publish job, which runs only for that distribution's tag, so the
# job that holds the id-token for one project never runs for another.
#
# PyPI trusted publishing does not accept a reusable workflow, so each publish
# job carries its steps here. To add a member, copy one publish job and change
# the distribution name in its job name, `if:`, url and artifact name.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      distribution: ${{ steps.target.outputs.distribution }}
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/workspace.py release-target "$TAG" > target.json
          cat target.json
          # A release is cut from a commit of main. The one other place a tag may sit is the
          # maintenance branch of its own release series, maint/<distribution>-<major>.<minor>,
          # for a fix to an older series that main has moved past.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            read -r name version < <(python3 -c 'import json; d=json.load(open("target.json")); print(d["distribution"], d["version"])')
            branch="origin/maint/${name}-${version%.*}"
            git merge-base --is-ancestor HEAD "$branch" || {
              echo "tag ${TAG} is on neither origin/main nor ${branch}" >&2
              exit 1
            }
          fi
          python3 -c 'import json; print("distribution=" + json.load(open("target.json"))["distribution"])' >> "$GITHUB_OUTPUT"
      # A release that only records a version PyPI already holds (a backfilled
      # GitHub Release) must not build or upload anything: PyPI refuses to replace
      # files, so the run would end red. 404 means not published; any other
      # answer than 200 or 404 fails the job, because an unread registry is not
      # evidence that nothing is there.
      - id: registry
        run: |
          set -euo pipefail
          read -r name version < <(python3 -c 'import json; d=json.load(open("target.json")); print(d["distribution"], d["version"])')
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${name}/${version}/json")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI answered $status for $name $version" >&2; exit 1 ;;
          esac

  build:
    needs: resolve
    if: needs.resolve.outputs.published == 'false'
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: ${{ needs.resolve.outputs.distribution }}
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  publish-probity-verify:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probity-verify' && needs.resolve.outputs.published == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/probity-verify/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-probity-verify
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: attest the checked distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/dist/*
      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

  publish-probityai:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probityai' && needs.resolve.outputs.published == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/probityai/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
