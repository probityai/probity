name: release

# Publish one workspace member to PyPI from a GitHub release whose tag is
# <distribution>-v<version>, for example probity-verify-v0.2.0. The tag must name
# a member, match its pyproject version and point at a commit on main. The files
# published are the ones python-build.yml built and checked in this run.
#
# PyPI trusted publisher, one entry per distribution, all alike: owner probityai,
# repository probity, workflow release.yml, environment pypi. Each distribution
# has its own publish job, which runs only for that distribution's tag, so the
# job that holds the id-token for one project never runs for another.
#
# PyPI trusted publishing does not accept a reusable workflow, so each publish
# job carries its steps here. To add a member, copy one publish job and change
# the distribution name in its job name, `if:`, url and artifact name.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      distribution: ${{ steps.target.outputs.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/workspace.py release-target "$TAG" > target.json
          cat target.json
          python3 -c 'import json; print("distribution=" + json.load(open("target.json"))["distribution"])' >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: ${{ needs.resolve.outputs.distribution }}

  publish-probity-verify:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probity-verify'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/probity-verify/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-probity-verify
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: attest the checked distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/dist/*
      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

  publish-probityai:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probityai'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/probityai/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-probityai
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: attest the checked distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/dist/*
      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

  publish-probity-ratchet:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probity-ratchet'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/probity-ratchet/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-probity-ratchet
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: attest the checked distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/dist/*
      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true

  publish-probity-ratchet-cases:
    needs: [resolve, build]
    if: needs.resolve.outputs.distribution == 'probity-ratchet-cases'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/probity-ratchet-cases/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-probity-ratchet-cases
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: attest the checked distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/dist/*
      - name: publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true
