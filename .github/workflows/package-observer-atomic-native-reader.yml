# Moved from packages/observer/.github/workflows/atomic-native-reader.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Installed Atomic native reader

on:
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-atomic-native-reader.yml']
  push:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-atomic-native-reader.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  atomic-native-reader:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check out the native test producer at its exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astrogilda/atomic
          ref: 80be8dae6feb8b9106181b78fba2c7c6a7c8f4d8
          path: packages/agent-evidence-observer/native-atomic
          persist-credentials: false
      - name: Install the native producer toolchain
        run: rustup toolchain install 1.90.0 --profile minimal && rustup default 1.90.0
      - name: Generate original native observations and retain the executable
        run: python native-atomic/tools/native-evaluation/run.py --output atomic-native-run --jobs 2
      - name: Build the consumer wheel and check refusal controls
        run: |
          python -m pip install -e '.[test]' build
          python -m pytest -q tests/test_atomic_reader.py --junitxml=atomic-reader-tests.xml
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/atomic-reader-env"
          "$RUNNER_TEMP/atomic-reader-env/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/atomic-reader-cwd"
          cd "$RUNNER_TEMP/atomic-reader-cwd"
          export PATH="$RUNNER_TEMP/atomic-reader-env/bin:$PATH"
          python "$GITHUB_WORKSPACE/packages/agent-evidence-observer/examples/atomic_consumer_demo.py" --packet "$GITHUB_WORKSPACE/packages/agent-evidence-observer/atomic-native-run" --output "$GITHUB_WORKSPACE/packages/agent-evidence-observer/atomic-consumer-result"
          python -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "inspect_ai", "a2a", "langgraph", "pydantic_ai"))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: atomic-native-reader
          path: |
            packages/agent-evidence-observer/atomic-native-run/
            packages/agent-evidence-observer/atomic-consumer-result/
            packages/agent-evidence-observer/atomic-reader-tests.xml
            packages/agent-evidence-observer/dist/*.whl
          if-no-files-found: error
