# Moved from packages/agent-evidence-replay/.github/workflows/ci.yml when the package was imported;
# its steps run from packages/agent-evidence-replay. The README shape check is the root lint job's.
name: package-agent-evidence-replay

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/agent-evidence-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: README example runs as written
        run: |
          agent-evidence-replay verify tests/fixtures/accept-3
          if agent-evidence-replay verify tests/fixtures/gap-2 --pin tests/fixtures/accept-3/pin.json; then
            echo "the gap fixture replayed intact"; exit 1
          fi

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the version-pins script at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/.github
          ref: ecb47052aa3ae8188c74f3cdc31eb8f4e9402811
          path: .github-scripts
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: every version a page names equals its manifest or the family lock
        run: python3 -B .github-scripts/scripts/version-pins.py check --root . --config packages/agent-evidence-replay/version-pins.toml
