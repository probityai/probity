# Moved from packages/observer/.github/workflows/boundary-probe.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Observer public checks

on:
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-boundary-probe.yml']
  push:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-boundary-probe.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e ../probity-verify -e '.[test,witness]'
      - run: pytest -q
      - run: python examples/attribution_demo.py ./attribution-run --native tests/fixtures/records/protected-action
      - run: python examples/replay_demo.py ./replay-run --source-revision "$GITHUB_SHA" --native tests/fixtures/records/protected-action
      - run: python examples/replay_demo.py ./replay-run --replay --native tests/fixtures/records/protected-action --trusted-policy ./replay-run/replay-policy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: attribution-run
          path: packages/agent-evidence-observer/attribution-run/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replay-run
          path: packages/agent-evidence-observer/replay-run/

  aae:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_aae_enforce.py tests/test_aae_binding.py
      - run: python examples/aae_replay.py > aae-replay.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aae-replay
          path: packages/agent-evidence-observer/aae-replay.json
