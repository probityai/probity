# Moved from packages/observer/.github/workflows/openai-agents-ticket.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: OpenAI Agents native trace and protected ticket

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/openai-agents-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-openai-agents-ticket.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/openai-agents-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-openai-agents-ticket.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/openai-agents-ticket-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected dependencies, the public observer and the reference wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps ../..
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/openai-wheels"
          python verify_wheels.py "$RUNNER_TEMP/openai-wheels" --selection source-selection.json > installed-source-proof.json
          python -m pip install --no-deps "$RUNNER_TEMP/openai-wheels"/probity_openai_agents_reference-0.0.1-py3-none-any.whl
          python -m pip check
      - name: Execute processor, retained replay and semantic refusal controls
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=test-results.xml
          ruff check --select E,F,I,C901 --config 'lint.mccabe.max-complexity=5' src tests verify_wheels.py verify_retained.py
      - name: Verify the retained native packet with public code only
        run: python verify_retained.py
      - name: Install a separate reader without the Agents SDK or OpenAI client
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/openai-reader"
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip install --require-hashes -r requirements-reader.lock
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip install --no-deps ../..
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip install --no-deps "$RUNNER_TEMP/openai-wheels"/probity_openai_agents_reference-0.0.1-py3-none-any.whl
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip check
          "$RUNNER_TEMP/openai-reader/bin/python" -c "import importlib.util; assert importlib.util.find_spec('agents') is None and importlib.util.find_spec('openai') is None"
      - name: Replay the retained packet with the separate reader
        run: |
          set -euo pipefail
          packet=retained/fresh-run/packet
          cp "$packet/consumer-pins.json" "$RUNNER_TEMP/openai-selected-pins.json"
          "$RUNNER_TEMP/openai-reader/bin/probity-openai-read" "$packet" --pins-file "$RUNNER_TEMP/openai-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/reader-stdout.json"
          python -c "import json,os; from pathlib import Path; a=json.loads(Path(os.environ['RUNNER_TEMP'], 'reader-stdout.json').read_bytes()); c=json.loads(Path('retained/fresh-run/packet/report.json').read_bytes()); assert a==c and a['status']=='verified' and a['plannedAttempts']==6"
