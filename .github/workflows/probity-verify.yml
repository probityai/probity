name: probity-verify

# Every check of packages/probity-verify. Called by ci.yml when the member or a
# shared file changes.

on:
  workflow_call:
    secrets:
      DIST_CLEAN_PRIVATE_NAMES:
        required: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/probity-verify

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test pytest
      - run: uv run --frozen python scripts/build-recipes.py --check
      - run: uv run --frozen python scripts/build-release-manifest.py --check
      - run: uv run --frozen --extra test pytest tests/test_release_pins.py
        env:
          PROBITY_VERIFY_ONLINE: '1'
      - run: uv run --frozen python examples/spend-reservation/generate.py --check
      - run: uv run --frozen python examples/event-absence-v2/generate.py --check
      - run: uv run --frozen python examples/brokered-file-write/generate.py --check
      - run: uv run --frozen python examples/customer-support-action/generate.py --check
      - run: uv run --frozen python examples/done-receipt/generate.py --check
      - run: uv run --frozen --extra test python vectors-source-coverage/check_vectors.py --verifier 'probity-verify'
      - run: uv run --frozen --extra test python vectors-operand-lineage/check_vectors.py --verifier 'probity-verify'
      - run: uv run --frozen --extra test python vectors-done-checks/gen_vectors.py --check
      - run: uv run --frozen --extra test python vectors-done-checks/check_vectors.py --verifier 'probity-verify'

  # EXTERNAL witness scope is earned only from a witness co-signature, checked by
  # agent-evidence-observer's witness module. That module needs the jcs-admit
  # binding, whose distribution name (probityai) is also this workspace's probity
  # command, so it runs in its own environment pinned by requirements-witness.txt.
  witness-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: build the witness environment from its lock
        run: |
          uv venv --python 3.12 .build/witness
          uv pip install --python .build/witness/bin/python -r requirements-witness.txt
          uv pip install --python .build/witness/bin/python --no-deps .
      - name: the lock is the compiled input
        run: scripts/check-lock-current.sh requirements-witness.in requirements-witness.txt 3.12 .build
      - run: .build/witness/bin/python -m pytest -q tests/witness_bundles.py tests/test_witnessed_scope.py
      - run: .build/witness/bin/python scripts/mutation-check-done.py

  a2a-transport:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra test --extra a2a
      - run: uv run --frozen --extra test --extra a2a pytest

  # Replays the source-coverage corpus shipped in the pinned agent-evidence-vectors
  # package from PyPI against this checkout's verifier, the way any other verifier
  # author would. A drift between the vendored and the published corpus is red here.
  published-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: install this checkout's verifier into its own environment
        run: |
          uv venv --python 3.12 .build/verifier
          uv pip install --python .build/verifier/bin/python .
          .build/verifier/bin/probity-verify --help > /dev/null
      - name: replay the published source-coverage corpus
        run: >-
          uv run --no-project --python 3.13
          --with agent-evidence-vectors==0.18.1
          agent-evidence-vectors
          --corpus vectors-source-coverage
          --verifier "$PWD/.build/verifier/bin/probity-verify"
          --report .build/source-coverage-report.json
      - name: the verifier answered every vector and none disagreed
        run: |
          python3 - <<'PYCODE'
          import json
          report = json.load(open(".build/source-coverage-report.json"))
          totals = report["totals"]
          executed = report["verifier"]["vectorsExecuted"]
          print(f"rail {report['rail']}: {executed} of {totals['vectors']} executed, {totals['fail']} failed")
          assert report["rail"] == "external", report["rail"]
          assert executed == totals["vectors"] > 0, (executed, totals)
          assert totals["fail"] == 0 and totals["suiteRefusals"] == 0, totals
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-coverage-report
          if-no-files-found: error
          path: packages/probity-verify/.build/source-coverage-report.json

  # Replays the retained brokered-file-write capture (real hard exits, retained
  # reports, policies and decisions) through a separately installed Verify CLI.
  # The producing run is operated by the operator's runtime; nothing is produced here.
  brokered-file-write:
    runs-on: ubuntu-24.04
    env:
      B: ${{ github.workspace }}/packages/probity-verify/.build/brokered-file-write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: build and install the consumer environment
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$B/wheels"
          uv venv --python 3.12 "$B/consumer"
          uv pip install --python "$B/consumer/bin/python" "$B"/wheels/*.whl
          uv pip freeze --python "$B/consumer/bin/python" > "$B/consumer-dependencies.txt"
          "$B/consumer/bin/python" -I -c 'import importlib.util; assert importlib.util.find_spec("probity_observer") is None'
      - name: replay the retained capture through the installed reader
        run: >-
          "$B/consumer/bin/python" -I
          scripts/check-brokered-file-write.py
          --verifier "$B/consumer/bin/probity-verify"
          --output "$B/replay"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: brokered-file-write-retained-replay
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.B }}/replay
            ${{ env.B }}/consumer-dependencies.txt

  distribution:
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: probity-verify
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}
