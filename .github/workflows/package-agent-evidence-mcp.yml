# Moved from packages/agent-evidence-mcp/.github/workflows/ci.yml when the package was imported;
# its steps run from packages/agent-evidence-mcp. The package is a member of the root uv workspace;
# these jobs install it with pip-style resolution on each supported Python. The README shape check is the root lint job's.
name: package-agent-evidence-mcp

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-mcp

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: install the pinned dependencies
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[test]"
      - name: tests (real MCP client, real corpus, no mocks)
        run: .venv/bin/python -m pytest -q
      - name: every mutation of a tool output is caught by the tests
        if: matrix.python == '3.12'
        run: .venv/bin/python scripts/mutation_check.py
      - name: the server answers over stdio from the built wheel
        run: |
          uv build --out-dir dist
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" scripts/wheel_smoke.py "$RUNNER_TEMP/wheel-venv/bin/agent-evidence-mcp"

  family:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: the declared ranges install beside the latest family releases
        run: |
          uv venv --python 3.12
          uv pip install -e . agent-evidence-vectors agent-evidence-vocabulary agent-evidence-admission probity-verify jcs-admit
          uv pip check

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the container image builds and answers over stdio
        run: |
          docker build -t agent-evidence-mcp:ci .
          docker inspect agent-evidence-mcp:ci --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' | grep -qx 'io.github.probityai/agent-evidence-mcp'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: a real MCP client gets the contradicted sample from the image
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/client-venv"
          uv pip install --python "$RUNNER_TEMP/client-venv/bin/python" "mcp==2.3.0"
          "$RUNNER_TEMP/client-venv/bin/python" scripts/wheel_smoke.py docker run --rm -i agent-evidence-mcp:ci

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the version-pins script at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/.github
          ref: ecb47052aa3ae8188c74f3cdc31eb8f4e9402811
          path: .github-scripts
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: every version a page names equals its manifest or the family lock
        run: python3 -B .github-scripts/scripts/version-pins.py check --root . --config packages/agent-evidence-mcp/version-pins.toml
      - name: manifests parse
        working-directory: packages/agent-evidence-mcp
        run: |
          for f in server.json .mcp.json .claude-plugin/plugin.json; do python3 -m json.tool "$f" > /dev/null; done
          python3 -m json.tool ../../gemini-extension.json > /dev/null
