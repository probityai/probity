# Moved from packages/observer/.github/workflows/a2a-native.yml when the package was imported;
# its steps run from packages/observer.
name: Native A2A SDK exchange

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-a2a-native.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-a2a-native.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  native-a2a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned SDK profile
        run: python -m pip install -e 'interop/a2a-native-2026-10-02[test]'
      - name: Check native execution and changed-envelope controls
        run: python -m pytest -q interop/a2a-native-2026-10-02/tests --junitxml=a2a-results.xml
      - name: Retain actual SDK client and server exchange
        run: python interop/a2a-native-2026-10-02/a2a_demo.py a2a-native-run
      - name: Recompute retained packet in a separate reader invocation
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          result = json.loads(Path('a2a-native-run/report.json').read_text())
          subprocess.run([sys.executable, 'interop/a2a-native-2026-10-02/a2a_verify.py', 'a2a-native-run', '--native-pins', 'a2a-native-run/selected-native-pins.json', '--plan-sha256', result['plan_sha256'], '--history-sha256', result['history_sha256']], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-a2a-sdk-reference
          path: |
            packages/observer/a2a-native-run/
            packages/observer/a2a-results.xml
          if-no-files-found: error
