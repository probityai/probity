            --candidate "$GITHUB_WORKSPACE/packages/agent-evidence-observer/owned-consumer" --candidate-sha "$SELECTED_OWNED_COMMIT" \
            --host "$GITHUB_WORKSPACE/packages/agent-evidence-observer/current-inspect" --reader-source "$GITHUB_WORKSPACE/packages/agent-evidence-observer/existing-reader" \
            --producer-python "$GITHUB_WORKSPACE/packages/agent-evidence-observer/current-inspect/.venv/bin/python" \
            --reader-python "$RUNNER_TEMP/reader-env/bin/python" \
            --observer-wheel "$RUNNER_TEMP/wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" \
            --adapter-wheel "$RUNNER_TEMP/wheels/probity_inspect_current_reader-0.0.1-py3-none-any.whl" \
            --retained "$RUNNER_TEMP/inspect-current-retained"
      - name: Test native semantics against fresh current originals
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          INSPECT_CURRENT_PACKET: ${{ runner.temp }}/inspect-current-retained/packet
        run: |
          "$RUNNER_TEMP/reader-env/bin/python" -I -B -m pytest -q -c /dev/null -p no:cacheprovider --import-mode=importlib owned-consumer/packages/agent-evidence-observer/interop/inspect-current-host-2026-10-03/test_native_packet.py --junitxml="$RUNNER_TEMP/inspect-native-controls.xml"
      - name: Retain originals, pre-run selection, installed wheels and refusals
        if: always()
