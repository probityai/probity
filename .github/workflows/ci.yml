      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f5bacb3b4474675b028b1d6ad7c1bf166017bcf
          path: packages/agent-evidence-observer/historical-model-reader
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c814f3c449ad8893737c5be7a84d8586633b4ab4
          path: packages/agent-evidence-observer/previous-model-reader
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.15'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e0cece4e53c0da4bac7f301ee4a9c371a437d08a
          path: packages/agent-evidence-observer/boundary-baseline-model-reader
          persist-credentials: false
      - name: Install hash-selected build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock
      - name: Build the frozen0.0.1 baseline and install both clean environments
        run: |
          python historical-model-reader/packages/observer/interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/packages/agent-evidence-observer/historical-model-reader/packages/observer" "$RUNNER_TEMP/baseline-model-wheels"
          for environment in baseline-consumer previous-consumer; do
            python -m venv "$RUNNER_TEMP/$environment"
            "$RUNNER_TEMP/$environment/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/baseline-model-wheels/"*.whl
          done
      - name: Build the frozen 0.0.2 wheel and install the next upgrade baseline
        run: |
          python previous-model-reader/packages/observer/interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/packages/agent-evidence-observer/previous-model-reader/packages/observer" "$RUNNER_TEMP/previous-model-wheels"
          "$RUNNER_TEMP/previous-consumer/bin/python" -m pip install --no-index --no-deps --upgrade "$RUNNER_TEMP/previous-model-wheels/"*.whl
      - name: Build frozen 0.0.3 and retain the next clean upgrade baseline
        run: |
          python boundary-baseline-model-reader/packages/observer/interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/packages/agent-evidence-observer/boundary-baseline-model-reader/packages/observer" "$RUNNER_TEMP/boundary-baseline-wheels"
          for environment in format-consumer consumer; do
            python -m venv "$RUNNER_TEMP/$environment"
            "$RUNNER_TEMP/$environment/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/boundary-baseline-wheels/"*.whl
          done
      - name: Build exact 0.0.4 sources and normally upgrade without frameworks
        run: |
          python interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/packages/agent-evidence-observer" "$RUNNER_TEMP/model-reader-wheels"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-index --no-deps --upgrade "$RUNNER_TEMP/model-reader-wheels/"*.whl
          "$RUNNER_TEMP/consumer/bin/python" -m pip check
          echo "$RUNNER_TEMP/consumer/bin" >> "$GITHUB_PATH"
      - name: Retain installed publication and quality refusal
        run: python interop/model-consumer-2026-10-02/run_host_example.py "$RUNNER_TEMP/model-host-result"
      - name: Retain actual installed profile upgrade and model quality refusal
        run: |
          python interop/model-consumer-2026-10-02/run_upgrade_example.py "$RUNNER_TEMP/model-upgrade-result" --baseline-python "$RUNNER_TEMP/baseline-consumer/bin/python" --candidate-python "$RUNNER_TEMP/previous-consumer/bin/python"
      - name: Retain actual decoder upgrade and semantic refusal despite valid schemas
        run: |
          python interop/model-consumer-2026-10-02/run_format_upgrade_example.py "$RUNNER_TEMP/model-format-upgrade-result" --baseline-python "$RUNNER_TEMP/previous-consumer/bin/python" --candidate-python "$RUNNER_TEMP/format-consumer/bin/python"
      - name: Retain immutable 384-call upgrade, prior report bytes and paired quality holds
        run: |
          python interop/model-consumer-2026-10-02/run_boundary_upgrade_example.py "$RUNNER_TEMP/model-boundary-upgrade-result" --baseline-python "$RUNNER_TEMP/format-consumer/bin/python" --candidate-python "$RUNNER_TEMP/consumer/bin/python"
      - name: Execute installation, policy, runtime and native refusal controls
        run: |
          python -m pip install pytest==8.4.2 hypothesis==6.147.0 ruff==0.15.6
          python -m ruff check --isolated interop/model-consumer-2026-10-02/
          python -m ruff format --isolated --check interop/model-consumer-2026-10-02/
          python -m pytest -q interop/model-consumer-2026-10-02/tests --junitxml=model-consumer-tests.xml
      - name: Retain exact wheel, policies and command receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: model-consumer-publication
          path: |
            ${{ runner.temp }}/model-reader-wheels/
            ${{ runner.temp }}/baseline-model-wheels/
            ${{ runner.temp }}/previous-model-wheels/
            ${{ runner.temp }}/boundary-baseline-wheels/
            ${{ runner.temp }}/model-boundary-upgrade-result/
            ${{ runner.temp }}/model-format-upgrade-result/
            ${{ runner.temp }}/model-upgrade-result/
            ${{ runner.temp }}/model-host-result/
            packages/agent-evidence-observer/model-consumer-tests.xml
          if-no-files-found: error
          retention-days: 90

  observer-native-consumer:
    name: "Installed native consumer reader"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.jobs)['observer-native-consumer'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-observer
    env:
      UV_NO_CONFIG: "1"
      AGENT_EVIDENCE_INSPECT_SEAL: "off"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install producer and test environment
        run: |
          python -m pip install -e '.[test,inspect-historical]' build 'agent-client-protocol==0.12.1'
          python -m pip install -e 'interop/a2a-native-2026-10-02[test]'
      - name: Check reader process and failure controls
        run: python -m pytest -q tests/test_native_reader.py --junitxml=native-consumer-tests.xml
      - name: Retain two native controlled packets
        run: |
          mkdir -p native-producer/inspect-execution native-producer/a2a
          python interop/evaluation-contract-2026-10-01/inspect_execution.py native-producer/inspect-execution/native
          python interop/a2a-native-2026-10-02/a2a_demo.py native-producer/a2a/native
      - name: Build wheel and use it from an outside consumer directory
        run: |
          python -m build --wheel --outdir dist
          python scripts/check-distribution.py dist/*.whl
          python scripts/check-distribution-controls.py dist/*.whl
          python -m venv "$RUNNER_TEMP/native-consumer-env"
          "$RUNNER_TEMP/native-consumer-env/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/native-consumer-cwd"
          cd "$RUNNER_TEMP/native-consumer-cwd"
          "$RUNNER_TEMP/native-consumer-env/bin/python" "$GITHUB_WORKSPACE/packages/agent-evidence-observer/examples/native_consumer_demo.py" --source-checkout "$GITHUB_WORKSPACE/packages/agent-evidence-observer" --native-root "$GITHUB_WORKSPACE/packages/agent-evidence-observer/native-producer" --output "$GITHUB_WORKSPACE/packages/agent-evidence-observer/native-consumer-result"
          "$RUNNER_TEMP/native-consumer-env/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("inspect_ai") is None; assert importlib.util.find_spec("a2a") is None'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-consumer-reader
          path: |
            packages/agent-evidence-observer/native-producer/
            packages/agent-evidence-observer/native-consumer-result/
            packages/agent-evidence-observer/native-consumer-tests.xml
            packages/agent-evidence-observer/dist/*.whl
          if-no-files-found: error

  observer-openai-agents-ticket:
    name: "OpenAI Agents native trace and protected ticket"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.jobs)['observer-openai-agents-ticket'] }}
    env:
      UV_NO_CONFIG: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/openai-agents-ticket-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected dependencies, the public observer and the reference wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps ../..
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/openai-wheels"
          python verify_wheels.py "$RUNNER_TEMP/openai-wheels" --selection source-selection.json > installed-source-proof.json
          python -m pip install --no-deps "$RUNNER_TEMP/openai-wheels"/probity_openai_agents_reference-0.0.1-py3-none-any.whl
          python -m pip check
      - name: Execute processor, retained replay and semantic refusal controls
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=test-results.xml
          ruff check --select E,F,I,C901 --config 'lint.mccabe.max-complexity=5' src tests verify_wheels.py verify_retained.py
      - name: Verify the retained native packet with public code only
        run: python verify_retained.py
      - name: Install a separate reader without the Agents SDK or OpenAI client
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/openai-reader"
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip install --require-hashes -r requirements-reader.lock
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip install --no-deps ../..
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip install --no-deps "$RUNNER_TEMP/openai-wheels"/probity_openai_agents_reference-0.0.1-py3-none-any.whl
          "$RUNNER_TEMP/openai-reader/bin/python" -m pip check
          "$RUNNER_TEMP/openai-reader/bin/python" -c "import importlib.util; assert importlib.util.find_spec('agents') is None and importlib.util.find_spec('openai') is None"
      - name: Replay the retained packet with the separate reader
        run: |
          set -euo pipefail
          packet=retained/fresh-run/packet
          cp "$packet/consumer-pins.json" "$RUNNER_TEMP/openai-selected-pins.json"
          "$RUNNER_TEMP/openai-reader/bin/probity-openai-read" "$packet" --pins-file "$RUNNER_TEMP/openai-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/reader-stdout.json"
          python -c "import json,os; from pathlib import Path; a=json.loads(Path(os.environ['RUNNER_TEMP'], 'reader-stdout.json').read_bytes()); c=json.loads(Path('retained/fresh-run/packet/report.json').read_bytes()); assert a==c and a['status']=='verified' and a['plannedAttempts']==6"

