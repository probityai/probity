          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected dependencies, the public observer and the reference wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps ../..
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/adk-wheels"
          python verify_wheels.py "$RUNNER_TEMP/adk-wheels" --selection source-selection.json > installed-source-proof.json
          python -m pip install --no-deps "$RUNNER_TEMP/adk-wheels"/probity_adk_reference-0.0.1-py3-none-any.whl
          python -m pip check
      - name: Execute plugin, gate, retained replay and semantic refusal controls
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=test-results.xml
          ruff check --select E,F,I,C901 --config 'lint.mccabe.max-complexity=5' src tests verify_wheels.py verify_retained.py
      - name: Verify the retained native packet with public code only
        run: python verify_retained.py
      - name: Install a separate reader without the ADK or MCP framework
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/adk-reader"
          "$RUNNER_TEMP/adk-reader/bin/python" -m pip install --require-hashes -r requirements-reader.lock
          "$RUNNER_TEMP/adk-reader/bin/python" -m pip install --no-deps ../..
          "$RUNNER_TEMP/adk-reader/bin/python" -m pip install --no-deps "$RUNNER_TEMP/adk-wheels"/probity_adk_reference-0.0.1-py3-none-any.whl
          "$RUNNER_TEMP/adk-reader/bin/python" -m pip check
          "$RUNNER_TEMP/adk-reader/bin/python" -c "import importlib.util; assert importlib.util.find_spec('google') is None and importlib.util.find_spec('mcp') is None"
      - name: Replay the retained packet with the separate reader and host gate
        run: |
          set -euo pipefail
          packet=retained/fresh-run/packet
          cp "$packet/consumer-pins.json" "$RUNNER_TEMP/adk-selected-pins.json"
          "$RUNNER_TEMP/adk-reader/bin/probity-adk-read" "$packet" --pins-file "$RUNNER_TEMP/adk-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/reader-stdout.json"
          python -c "import json,os; from pathlib import Path; a=json.loads(Path(os.environ['RUNNER_TEMP'], 'reader-stdout.json').read_bytes()); c=json.loads(Path('retained/fresh-run/packet/report.json').read_bytes()); assert a==c and a['status']=='verified' and a['plannedAttempts']==12"
          policy_sha="$(sha256sum "$RUNNER_TEMP/adk-selected-pins.json" | cut -d ' ' -f 1)"
          "$RUNNER_TEMP/adk-reader/bin/probity-adk-gate" "$packet" --reader "$RUNNER_TEMP/adk-reader/bin/probity-adk-read" --policy "$RUNNER_TEMP/adk-selected-pins.json" --policy-sha256 "$policy_sha" --withheld-sources retained/WITHHELD-SOURCES.json --output "$RUNNER_TEMP/gate-receipt"

