  observer-a2a-history-boundary:
    name: "Native A2A caller and history boundary"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.jobs)['observer-a2a-history-boundary'] }}
    env:
      UV_NO_CONFIG: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: a2aproject/a2a-python
          ref: 52030cf43f2e96d25949952e385e3b73fe93bc2a
          fetch-depth: 0
          path: packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/native-sdk
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install source-lock dependencies and exact native SDK
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r native-requirements.lock -r test-requirements.lock --report install-report.json
          python -m pip install --no-deps --no-build-isolation -e native-sdk
          python -m pip check
      - name: Start loopback-only bounded actual MySQL
        run: |
          docker run --detach --name probity-a2a-history --memory 512m --cpus 1 --pids-limit 128 --publish 127.0.0.1::3306 --env MYSQL_ALLOW_EMPTY_PASSWORD=yes --env MYSQL_DATABASE=probity_fixture --env MYSQL_USER=fixture --env MYSQL_PASSWORD=fixture-only-public public.ecr.aws/docker/library/mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=20 > container-id.txt
          for _ in $(seq 1 30); do
            if docker exec probity-a2a-history mysql --protocol=TCP --host=127.0.0.1 --user=fixture --password=fixture-only-public --database=probity_fixture --batch --skip-column-names -e 'SELECT VERSION(), @@port, 1'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify semantic refusal controls
        run: |
          python -m ruff check --isolated boundary_common.py boundary_native.py boundary_run.py boundary_reader.py host_gate.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' boundary_common.py boundary_native.py boundary_run.py boundary_reader.py host_gate.py tests
          python -m pytest -q tests --junitxml=test-results.xml
      - name: Execute selected 20 real MySQL caller/history exercises
        run: |
          port=$(docker port probity-a2a-history 3306/tcp | cut -d: -f2)
          PROBITY_FIXTURE_MYSQL_DSN="mysql+aiomysql://fixture:fixture-only-public@127.0.0.1:${port}/probity_fixture" timeout --signal=TERM --kill-after=5s 125s python boundary_run.py --sdk-source native-sdk --mysql-container probity-a2a-history --output fresh-run > native.stdout 2> native.stderr
      - name: Build and install actual offline reader distribution
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheels .
          sha256sum wheels/*.whl > wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/a2a-history-reader"
          "$RUNNER_TEMP/a2a-history-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r reader-requirements.lock --report reader-install-report.json
          "$RUNNER_TEMP/a2a-history-reader/bin/python" -m pip install --no-deps wheels/*.whl
          "$RUNNER_TEMP/a2a-history-reader/bin/python" -m pip check
          "$RUNNER_TEMP/a2a-history-reader/bin/python" - <<'PY'
          import importlib.util
          assert all(importlib.util.find_spec(n) is None for n in ['a2a', 'sqlalchemy', 'httpx', 'starlette'])
          PY
      - name: Retain host-selected installed-reader publication decision
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          raw = Path('fresh-run-pins.json').read_bytes()
          Path('host-policy.json').write_text(json.dumps({'profile': 'probity-a2a-native-history-boundary-v1', 'pinsSha256': hashlib.sha256(raw).hexdigest(), 'plannedAttempts': 20}))
          PY
          python host_gate.py fresh-run --pins-file fresh-run-pins.json --policy-file host-policy.json --policy-sha256 "$(sha256sum host-policy.json | cut -d' ' -f1)" --reader "$RUNNER_TEMP/a2a-history-reader/bin/probity-read-a2a-history" --output host-receipts > host-decision.json
      - name: Retain native database logs
        if: always()
        run: docker logs probity-a2a-history > mysql.stdout 2> mysql.stderr || true
      - name: Retain complete public population and installation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a2a-history-${{ github.sha }}
          path: |
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/fresh-run/
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/fresh-run-pins.json
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/host-receipts/
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/host-decision.json
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/native.stdout
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/native.stderr
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/mysql.stdout
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/mysql.stderr
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/install-report.json
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/reader-install-report.json
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/wheels/
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/wheels-sha256.txt
            packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
      - name: Stop owned database container
        if: always()
        run: docker rm --force probity-a2a-history || true

  observer-a2a-native:
    name: "Native A2A SDK exchange"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.jobs)['observer-a2a-native'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-observer
    env:
      UV_NO_CONFIG: "1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
