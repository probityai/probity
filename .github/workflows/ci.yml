      # The preregistered controls select Git blobs relative to the repository
      # root and cannot change, so give them a checkout whose root is the
      # package tree: a commit with tree HEAD:packages/agent-evidence-observer and parent HEAD.
      - name: Select the package tree as its own source root
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:packages/agent-evidence-observer)"
          date="$(git show -s --format=%cI HEAD)"
          commit="$(GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git -c user.name=ci -c user.email=ci@localhost commit-tree "$tree" -p HEAD -m "packages/agent-evidence-observer tree of $GITHUB_SHA")"
          git worktree add --detach "$RUNNER_TEMP/observer-root" "$commit"
          test "$(git -C "$RUNNER_TEMP/observer-root" rev-parse "HEAD^{tree}")" = "$tree"
