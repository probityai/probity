name: ci

# One entry point for every pull request and every push to main. The changes
# job asks scripts/workspace.py which members a change touches; each member's
# checks run only when needed, and the `ci-ok` job is the one required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      members: ${{ steps.map.outputs.members }}
      rust: ${{ steps.map.outputs.rust }}
      runner: ${{ steps.map.outputs.runner }}
      plugins: ${{ steps.map.outputs.plugins }}
      ratchet_bench: ${{ steps.map.outputs.ratchet_bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: map
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            members="$(python3 scripts/workspace.py changes "$BASE" HEAD)"
            rust=false
            if git diff --name-only "$BASE...HEAD" | grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/)'; then rust=true; fi
            runner=false
            if git diff --name-only "$BASE...HEAD" | grep -qE '^(examples/checkout-runner/|\.github/workflows/ci\.yml$)'; then runner=true; fi
            # The plugins are a harness, not a workspace member: their files decide alone.
            plugins=false
            if git diff --name-only "$BASE...HEAD" | grep -qE '^(harnesses/agent-evidence-plugins/|\.claude-plugin/|\.github/workflows/(ci|package-agent-evidence-plugins)\.yml$)'; then plugins=true; fi
            # The ratchet's benchmark harness is not a member either; a change to it runs the ratchet's checks.
            ratchet_bench=false
            if git diff --name-only "$BASE...HEAD" | grep -qE '^harnesses/ratchet-bench/'; then ratchet_bench=true; fi
          else
            # A push to main or a manual run checks everything.
            members="$(python3 scripts/workspace.py changes HEAD HEAD | python3 -c 'import json,sys; print(json.dumps({k: True for k in json.load(sys.stdin)}))')"
            rust=true
            runner=true
            plugins=true
            ratchet_bench=true
          fi
          {
            echo "members=$members"
            echo "rust=$rust"
            echo "runner=$runner"
            echo "plugins=$plugins"
            echo "ratchet_bench=$ratchet_bench"
          } >> "$GITHUB_OUTPUT"
          echo "members: $members, rust: $rust, runner: $runner"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: one lint configuration for the whole workspace
        run: uv run --frozen --only-group dev ruff check .
      - name: workspace tools
        run: uv run --frozen --only-group dev python -m pytest tests
      - name: every publish job has a tag the pypi environment allows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_environment.py
      - name: every README stays one screen and every link in it resolves
        run: |
          python3 scripts/readme-lint-test.py
          for readme in README.md packages/*/README.md harnesses/*/README.md; do python3 scripts/readme-lint.py "$readme"; done

  probity-verify:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probity-verify']
    uses: ./.github/workflows/probity-verify.yml
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  probityai:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probityai']
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The lock's floor (3.12, set by its strictest member) and the newest Python.
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: packages/probityai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test pytest

  probityai-distribution:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probityai']
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: probityai
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  checkout-runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/checkout-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check every crate in the Cargo workspace
        run: |
          set -euo pipefail
          count="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["workspace_members"]))')"
          echo "Cargo workspace members: $count"
          if [ "$count" -gt 0 ]; then
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked
          fi

  package-ratchet:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] || needs.changes.outputs.ratchet_bench == 'true'
    uses: ./.github/workflows/package-ratchet.yml

  observer-distribution:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['agent-evidence-observer']
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: agent-evidence-observer
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  package-agent-evidence-mcp:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['agent-evidence-mcp']
    uses: ./.github/workflows/package-agent-evidence-mcp.yml

  agent-evidence-mcp-distribution:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['agent-evidence-mcp']
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: agent-evidence-mcp
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  package-agent-evidence-plugins:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    uses: ./.github/workflows/package-agent-evidence-plugins.yml

  package-evaluator-replay-kit:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['evaluator-replay-kit']
    uses: ./.github/workflows/package-evaluator-replay-kit.yml

  evaluator-replay-kit-distribution:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['evaluator-replay-kit']
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: evaluator-replay-kit
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  package-probity-effects:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probity-effects']
    uses: ./.github/workflows/package-probity-effects.yml

  probity-effects-distribution:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probity-effects']
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: probity-effects
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  ci-ok:
    if: always()
    needs: [changes, lint, probity-verify, probityai, probityai-distribution, checkout-runner, rust, package-ratchet, observer-distribution, package-agent-evidence-mcp, agent-evidence-mcp-distribution, package-agent-evidence-plugins, package-evaluator-replay-kit, evaluator-replay-kit-distribution, package-probity-effects, probity-effects-distribution]
    runs-on: ubuntu-24.04
    steps:
      - name: every needed job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ["RESULTS"])
          bad = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          for name, job in sorted(needs.items()):
              print(f"{name}: {job['result']}")
          raise SystemExit(f"failed: {bad}" if bad else 0)
          PYCODE
