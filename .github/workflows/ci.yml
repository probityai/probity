  pypi-upload-selftest:
    name: "pypi-upload-selftest"
    needs: [changes]
    if: ${{ (fromJSON(needs.changes.outputs.jobs)['pypi-upload-selftest']) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: build a throwaway wheel with a version no earlier run used
        env:
          VERSION: 0.0.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          mkdir -p "$pkg/probity_upload_selftest"
          echo '"""Upload self-test of a release workflow; contains nothing."""' > "$pkg/probity_upload_selftest/__init__.py"
          cat > "$pkg/pyproject.toml" <<EOF
          [build-system]
          requires = ["setuptools>=69"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "probity-upload-selftest"
          version = "$VERSION"
          description = "Upload self-test of a release workflow; contains nothing."
          requires-python = ">=3.9"
          EOF
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" "$pkg"
          ls -l "$RUNNER_TEMP/dist"
      # Trusted publishing first, so a project with a registered publisher gets
      # PEP 740 attestations. A project PyPI has no publisher for (a first
      # release or a rename: HTTP 403 invalid-publisher or "OIDC scoped token is
      # not valid for project") is uploaded with the account API token instead,
      # so a release never waits on a pypi.org setting. skip-existing on both
      # makes the second attempt upload only what the first did not; the
      # read-back then proves every file on the index is the one built here.
      # The PyPA action cannot run inside a local composite action (it pulls its
      # image from the calling repository), so these steps sit in each job.
      - id: oidc
        name: upload with trusted publishing
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true
      - name: the API token is set for the fallback
        if: steps.oidc.outcome == 'failure'
        env:
          API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::error::trusted publishing failed and the TESTPYPI_API_TOKEN secret is not set"
            exit 1
          fi
          echo "::warning::trusted publishing failed; uploading with the account API token"
      - name: upload with the API token
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          attestations: false
          skip-existing: true
      - name: every file on the index has the digest of the file built here
        run: python3 .github/scripts/verify_pypi_upload.py ${{ runner.temp }}/dist "https://test.pypi.org/simple"

