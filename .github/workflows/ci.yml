name: ci

# The one workflow of this repository for pull requests, the merge queue and pushes to main.
# `changes` asks scripts/ci_select.py which jobs the change needs (scripts/ci_jobs.toml holds the
# path table); every job runs only when selected, and `ci-ok` is the one required check.
#
#   pull_request   fast tier: the jobs the change touches, cancelled when a newer push replaces it
#   merge_group    full tier, once per batch: the same selection over the batch, plus the "full" jobs
#   push (main)    the same selection over the pushed range
#   schedule       the weekly Haystack consumer check only
#
# Not folded in, because each needs its own trigger, permissions or environment: release.yml and
# the called registry publisher, the post-release registry checks and badge refreshes, pin-refresh,
# scorecard, the scheduled family-resolves and version-pins registry checks, the experiment runners
# that start on a run/* branch, and the manual local-model inference runs.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '29 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-24.04
    outputs:
      members: ${{ steps.map.outputs.members }}
      rust: ${{ steps.map.outputs.rust }}
      runner: ${{ steps.map.outputs.runner }}
      plugins: ${{ steps.map.outputs.plugins }}
      jobs: ${{ steps.map.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: map
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/ci_select.py "$EVENT" "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"

  lint:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: one lint configuration for the whole workspace
        run: uv run --frozen --only-group dev ruff check .
      - name: workspace tools
        run: uv run --frozen --only-group dev python -m pytest tests
      - name: every publish job has a tag the pypi environment allows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_environment.py
      - name: every README stays one screen and every link in it resolves
        run: |
          python3 scripts/readme-lint-test.py
          for readme in README.md packages/*/README.md harnesses/*/README.md; do python3 scripts/readme-lint.py "$readme"; done
      - name: every README and docs page is written for an outside reader
        run: |
          python3 scripts/public-voice-lint-test.py
          python3 scripts/public-voice-lint.py
      - name: every package in the README has its source here
        run: |
          python3 scripts/readme-package-owner-lint-test.py
          python3 scripts/refresh-badges-test.py
          python3 scripts/readme-image-check-test.py
          python3 scripts/readme-image-check.py README.md packages/*/README.md harnesses/*/README.md
          python3 scripts/readme-package-owner-lint.py README.md

  agent-evidence-verify-conformance:
    name: "agent-evidence-verify / conformance"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['agent-evidence-verify'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test pytest
      - run: uv run --frozen python scripts/build-recipes.py --check
      - run: uv run --frozen python scripts/build-release-manifest.py --check
      - run: uv run --frozen --extra test pytest tests/test_release_pins.py
        env:
          PROBITY_VERIFY_ONLINE: '1'
      - run: uv run --frozen python examples/spend-reservation/generate.py --check
      - run: uv run --frozen python examples/event-absence-v2/generate.py --check
      - run: uv run --frozen python examples/brokered-file-write/generate.py --check
      - run: uv run --frozen python examples/customer-support-action/generate.py --check
      - run: uv run --frozen python examples/done-receipt/generate.py --check
      - run: uv run --frozen python examples/cbor-receipt-chain/generate.py --check
      - run: uv run --frozen --extra test python vectors-source-coverage/check_vectors.py --verifier 'agent-evidence-verify'
      - run: uv run --frozen --extra test python vectors-operand-lineage/check_vectors.py --verifier 'agent-evidence-verify'
      - run: uv run --frozen --extra test python vectors-done-checks/gen_vectors.py --check
      - run: uv run --frozen --extra test python vectors-done-checks/check_vectors.py --verifier 'agent-evidence-verify'

  # EXTERNAL witness scope is earned only from a witness co-signature, checked by
  # agent-evidence-observer's witness module. That module needs the jcs-admit
  # binding, whose distribution name (probityai) is also this workspace's probity
  # command, so it runs in its own environment pinned by requirements-witness.txt.

  agent-evidence-verify-witness-scope:
    name: "agent-evidence-verify / witness-scope"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['agent-evidence-verify'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: build the witness environment from its lock
        run: |
          uv venv --python 3.12 .build/witness
          uv pip install --python .build/witness/bin/python -r requirements-witness.txt
          uv pip install --python .build/witness/bin/python --no-deps .
      - name: the lock is the compiled input
        run: scripts/check-lock-current.sh requirements-witness.in requirements-witness.txt 3.12 .build
      - run: .build/witness/bin/python -m pytest -q tests/witness_bundles.py tests/test_witnessed_scope.py
      - run: .build/witness/bin/python scripts/mutation-check-done.py

  agent-evidence-verify-a2a-transport:
    name: "agent-evidence-verify / a2a-transport"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['agent-evidence-verify'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra test --extra a2a
      - run: uv run --frozen --extra test --extra a2a pytest

  # Replays the source-coverage corpus shipped in the pinned agent-evidence-vectors
  # package from PyPI against this checkout's verifier, the way any other verifier
  # author would. A drift between the vendored and the published corpus is red here.

  agent-evidence-verify-published-vectors:
    name: "agent-evidence-verify / published-vectors"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['agent-evidence-verify'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: install this checkout's verifier into its own environment
        run: |
          uv venv --python 3.12 .build/verifier
          uv pip install --python .build/verifier/bin/python .
          .build/verifier/bin/agent-evidence-verify --help > /dev/null
      - name: replay the published source-coverage corpus
        run: >-
          uv run --no-project --python 3.13
          --with agent-evidence-vectors==0.18.1
          agent-evidence-vectors
          --corpus vectors-source-coverage
          --verifier "$PWD/.build/verifier/bin/agent-evidence-verify"
          --report .build/source-coverage-report.json
      - name: the verifier answered every vector and none disagreed
        run: |
          python3 - <<'PYCODE'
          import json
          report = json.load(open(".build/source-coverage-report.json"))
          totals = report["totals"]
          executed = report["verifier"]["vectorsExecuted"]
          print(f"rail {report['rail']}: {executed} of {totals['vectors']} executed, {totals['fail']} failed")
          assert report["rail"] == "external", report["rail"]
          assert executed == totals["vectors"] > 0, (executed, totals)
          assert totals["fail"] == 0 and totals["suiteRefusals"] == 0, totals
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-coverage-report
          if-no-files-found: error
          path: packages/agent-evidence-verify/.build/source-coverage-report.json

  # Replays the retained brokered-file-write capture (real hard exits, retained
  # reports, policies and decisions) through a separately installed Verify CLI.
  # The producing run is operated by the operator's runtime; nothing is produced here.

  agent-evidence-verify-brokered-file-write:
    name: "agent-evidence-verify / brokered-file-write"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['agent-evidence-verify'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-verify
    runs-on: ubuntu-24.04
    env:
      B: ${{ github.workspace }}/packages/agent-evidence-verify/.build/brokered-file-write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: build and install the consumer environment
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$B/wheels"
          uv venv --python 3.12 "$B/consumer"
          uv pip install --python "$B/consumer/bin/python" "$B"/wheels/*.whl
          uv pip freeze --python "$B/consumer/bin/python" > "$B/consumer-dependencies.txt"
          "$B/consumer/bin/python" -I -c 'import importlib.util; assert importlib.util.find_spec("probity_observer") is None'
      - name: replay the retained capture through the installed reader
        run: >-
          "$B/consumer/bin/python" -I
          scripts/check-brokered-file-write.py
          --verifier "$B/consumer/bin/agent-evidence-verify"
          --output "$B/replay"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: brokered-file-write-retained-replay
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.B }}/replay
            ${{ env.B }}/consumer-dependencies.txt

  agent-evidence-verify-distribution:
    name: "agent-evidence-verify / distribution"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['agent-evidence-verify'] }}
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: agent-evidence-verify
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  probityai:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probityai']
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The lock's floor (3.12, set by its strictest member) and the newest Python.
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: packages/probityai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test pytest

  probityai-distribution:
    needs: changes
    if: fromJSON(needs.changes.outputs.members)['probityai']
    uses: ./.github/workflows/python-build.yml
    with:
      distribution: probityai
    secrets:
      DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}

  checkout-runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/checkout-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check every crate in the Cargo workspace
        run: |
          set -euo pipefail
          count="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["workspace_members"]))')"
          echo "Cargo workspace members: $count"
          if [ "$count" -gt 0 ]; then
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked
          fi

  package-ratchet-lint:
    name: "package-ratchet / lint"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] }}
    defaults:
      run:
        working-directory: packages/probity-ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "1"
      # Job-scoped: the other jobs need the package editable, because the pinned decision key is found
      # relative to the source tree (ratchet.verify.keys.DEFAULT_KEY_PATH) and a site-packages install has none.
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Non-editable (UV_NO_EDITABLE above): agent-evidence-verify's editable install is an import hook mypy cannot follow.
      - run: uv sync --all-groups --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      # agentdojo and tau2 are installed only by the cases-agentdojo and cases-tau2 jobs below, which test against them.
      - run: uv run mypy --config-file ../probity-ratchet-cases/pyproject.toml --ignore-missing-imports ../probity-ratchet-cases/src
      - run: python3 scripts/readme-lint.py README.md
      - run: python3 scripts/readme-lint.py ../probity-ratchet-cases/README.md
      # check-docs imports ratchet_cases to count the case families, so it runs inside the synced virtualenv
      - run: uv run python scripts/check-docs.py

  # The signed v3 refusal example: offline verification of the pinned results file, so the example cannot rot.

  package-ratchet-refusal-example:
    name: "package-ratchet / refusal-example"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] }}
    defaults:
      run:
        working-directory: packages/probity-ratchet
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run python examples/refusal-v3-cell/verify.py | tee refusal.out
      - run: |
          grep -qx 'decision verified, candidate refused, reason: identity controls breached' refusal.out

  # The case suite on its own: built as a wheel and tested from a clean environment on the oldest and a
  # current supported Python, so nothing in the root workspace can hide a missing file or dependency.

  package-ratchet-cases:
    name: "package-ratchet / cases"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] }}
    defaults:
      run:
        working-directory: packages/probity-ratchet
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: the job installs one wheel and pytest, and two matrix legs saving one cache key race.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build --package probity-ratchet-cases --out-dir dist
      - name: install the wheel alone
        run: |
          uv venv --no-project --python "${{ matrix.python }}" "$RUNNER_TEMP/cases"
          uv pip install --python "$RUNNER_TEMP/cases/bin/python" dist/probity_ratchet_cases-*.whl pytest==9.1.1
      - name: selftest, and the shipped digest equals the one DIGESTS.json records
        run: |
          "$RUNNER_TEMP/cases/bin/ratchet-cases" selftest
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ../probity-ratchet-cases/src/ratchet_cases/__init__.py)
          want="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' ../probity-ratchet-cases/src/ratchet_cases/cases/DIGESTS.json "$version")"
          test "$("$RUNNER_TEMP/cases/bin/ratchet-cases" digest)" = "$want"
      - name: pytest against the installed wheel
        working-directory: packages/probity-ratchet-cases
        run: '"$RUNNER_TEMP/cases/bin/python" -m pytest -q -W error -p no:cacheprovider'

  # The AgentDojo benign-twin suite against the AgentDojo release it pins, from the installed wheel and its
  # extra: every twin solvable by its ground truth, failed by a refuse-everything pipeline and by the paired
  # attack, and accepted by AgentDojo's own check_suites. No model, no key.

  package-ratchet-cases-agentdojo:
    name: "package-ratchet / cases-agentdojo"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] }}
    defaults:
      run:
        working-directory: packages/probity-ratchet
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build --package probity-ratchet-cases --out-dir dist
      - name: install the wheel with the agentdojo extra
        run: |
          uv venv --no-project --python "${{ matrix.python }}" "$RUNNER_TEMP/twins"
          wheel="$(ls dist/probity_ratchet_cases-*.whl)"
          # google-genai is agentdojo's unpinned transitive dependency. 3.0.0 (6 Nov 2026) ships an invalid
          # escape sequence in types.py, which -W error turns into a collection failure, so the job installs the
          # release uv.lock resolves.
          uv pip install --python "$RUNNER_TEMP/twins/bin/python" "${wheel}[agentdojo]" google-genai==2.34.0 pytest==9.1.1
      - name: pytest the twins against the installed wheel
        working-directory: packages/probity-ratchet-cases
        run: '"$RUNNER_TEMP/twins/bin/python" -m pytest -q -W error -p no:cacheprovider tests_agentdojo'

  # retail_faults against tau2-bench itself. tau2-bench is not on PyPI under its own name (the PyPI project
  # "tau2" is an unrelated package), so it is installed from its repository at the commit this job pins,
  # with that commit's retail data. websockets is installed beside it because importing tau2 needs it while
  # tau2 declares it only in its voice extra.

  package-ratchet-cases-tau2:
    name: "package-ratchet / cases-tau2"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] }}
    defaults:
      run:
        working-directory: packages/probity-ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "1"
      TAU2_COMMIT: 4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: fetch tau2-bench code and retail data at the pinned commit
        run: |
          d="$RUNNER_TEMP/tau2-bench"
          git init -q "$d"
          git -C "$d" remote add origin https://github.com/sierra-research/tau2-bench
          git -C "$d" sparse-checkout set --no-cone '/*' '!/data/' '/data/tau2/domains/retail/' \
            '!/data/tau2/domains/retail/task_issues/' '!/data/tau2/domains/retail/tasks_voice.json' \
            '!/data/tau2/domains/retail/audio_difficulty.json'
          git -C "$d" fetch -q --depth 1 --filter=blob:none origin "$TAU2_COMMIT"
          git -C "$d" checkout -q FETCH_HEAD
          test "$(git -C "$d" rev-parse HEAD)" = "$TAU2_COMMIT"
          echo "TAU2_DATA_DIR=$d/data" >> "$GITHUB_ENV"
      - run: uv build --package probity-ratchet-cases --out-dir dist
      - name: install the wheel beside tau2-bench
        run: |
          uv venv --no-project --python 3.12 "$RUNNER_TEMP/t2"
          uv pip install --python "$RUNNER_TEMP/t2/bin/python" "$RUNNER_TEMP/tau2-bench" websockets==15.0.1 \
            dist/probity_ratchet_cases-*.whl pytest==9.1.1
      # tau2-bench imports the standard library's audioop, deprecated since Python 3.11, from its voice
      # utilities at import time. That one warning comes from tau2-bench and is ignored by its exact text;
      # every other warning still fails the job.
      - name: faulted retail tasks, graded on the live databases
        working-directory: packages/probity-ratchet-cases
        run: >-
          "$RUNNER_TEMP/t2/bin/python" -m pytest -q -p no:cacheprovider tests_tau2
          -W error -W "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning"

  package-ratchet-test:
    name: "package-ratchet / test"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.members)['probity-ratchet'] || fromJSON(needs.changes.outputs.members)['probity-ratchet-cases'] }}
    defaults:
      run:
        working-directory: packages/probity-ratchet
    env:
      UV_PYTHON: "3.14"
      UV_LOCKED: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # Same image, credentials and port mapping as docker/compose.yaml; the "image tag matches compose" step fails the
      # job if the two drift apart.
      atlas:
        image: mongodb/mongodb-atlas-local:8.3.9-20260928T091948Z
        env:
          MONGODB_INITDB_ROOT_USERNAME: ratchet
          MONGODB_INITDB_ROOT_PASSWORD: ratchet-local-dev
        ports:
          - 127.0.0.1:27018:27017
        options: >-
          --hostname ratchet-atlas
          --ulimit nofile=1048576:1048576
          --health-cmd "mongosh -u ratchet -p ratchet-local-dev --quiet --eval 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: image tag matches compose
        run: |
          want=$(sed -n 's/^ *image: *//p' docker/compose.yaml | head -1)
          have=$(sed -n 's/^ *image: *\(mongodb\/mongodb-atlas-local:[^ ]*\).*$/\1/p' ../../.github/workflows/ci.yml | head -1)
          echo "compose: $want  workflow: $have"
          test -n "$want" && test "$want" = "$have"
      - name: wait until mongot answers search-index calls
        run: |
          id=$(docker ps --filter ancestor="$(sed -n 's/^ *image: *//p' docker/compose.yaml | head -1)" --format '{{.ID}}' | head -1)
          test -n "$id"
          for i in $(seq 1 90); do
            if docker exec "$id" mongosh -u ratchet -p ratchet-local-dev --quiet --eval "db.getSiblingDB('healthprobe').nothing.aggregate([{\$listSearchIndexes:{}}]).toArray().length" >/dev/null 2>&1; then
              echo "search ready after $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          docker logs --tail 50 "$id"
          exit 1
      - run: uv sync --all-groups --all-extras
      # Default selection: sandbox tests (hackathon cluster secrets) and live tests (VOYAGE_API_KEY) are deselected.
      - name: pytest
        run: >-
          uv run --with pytest-timeout python -m pytest -q -W error --timeout=120 -rfEs --tb=short
          -m "not sandbox and not live and not records"
          --cov=src/ratchet --cov-report=term-missing:skip-covered

