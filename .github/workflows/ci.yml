  observer-adk-current-consumer-upstream-full-tox:
    name: "Current ADK installed publication consumer / Patched ADK full tox (${{ matrix.tox }})"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.jobs)['observer-adk-current-consumer-full'] }}
    defaults:
      run:
        working-directory: packages/agent-evidence-observer
    env:
      UV_NO_CONFIG: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', tox: py310}
          - {python: '3.11', tox: py311}
          - {python: '3.12', tox: py312}
          - {python: '3.13', tox: py313}
          - {python: '3.14', tox: py314}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: google/adk-python
          ref: e94c2e726a269e0f04e2e4b202f5c131c80c20de
          path: packages/agent-evidence-observer/selected-adk
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify selected source corrections and add the exact focused sample
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/adk-current-consumer-2026-10-03"
          python -m venv "$RUNNER_TEMP/adk-tox"
          "$RUNNER_TEMP/adk-tox/bin/python" -m pip install --require-hashes -r "$profile/tox-tools.lock"
          "$RUNNER_TEMP/adk-tox/bin/python" -I -B "$profile/test_apply_tox_corrections.py" > "$RUNNER_TEMP/source-controls-${{ matrix.tox }}.stdout" 2> "$RUNNER_TEMP/source-controls-${{ matrix.tox }}.stderr"
          "$RUNNER_TEMP/adk-tox/bin/python" -I -B "$profile/apply_tox_corrections.py" "$GITHUB_WORKSPACE/packages/agent-evidence-observer/selected-adk" "$RUNNER_TEMP/full-tox-source-${{ matrix.tox }}.json"
          mkdir -p "$GITHUB_WORKSPACE/packages/agent-evidence-observer/selected-adk/contributing/samples/plugins/plugin_report_publication"
          cp "$profile/upstream-sample/publish_reference.py" "$profile/upstream-sample/README.md" "$GITHUB_WORKSPACE/packages/agent-evidence-observer/selected-adk/contributing/samples/plugins/plugin_report_publication/"
          cp "$profile/upstream-sample/test_report_publication_sample.py" "$GITHUB_WORKSPACE/packages/agent-evidence-observer/selected-adk/tests/unittests/plugins/"
      - name: Generate the missing upstream dependency lock without changing tox
        working-directory: packages/agent-evidence-observer/selected-adk
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/adk-tox/bin/uv" lock 2>&1 | tee "$RUNNER_TEMP/full-lock-${{ matrix.tox }}.log"
      - name: Run unchanged tox on the recorded patched ADK source and sample
        working-directory: packages/agent-evidence-observer/selected-adk
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/adk-tox/bin/tox" -e "${{ matrix.tox }}" 2>&1 | tee "$RUNNER_TEMP/full-tox-${{ matrix.tox }}.log"
      - name: Retain the full supported-version tox attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adk-patched-full-tox-${{ matrix.tox }}
          path: |
            ${{ runner.temp }}/full-tox-source-${{ matrix.tox }}.json
            ${{ runner.temp }}/source-controls-${{ matrix.tox }}.stdout
            ${{ runner.temp }}/source-controls-${{ matrix.tox }}.stderr
            ${{ runner.temp }}/full-tox-${{ matrix.tox }}.log
            ${{ runner.temp }}/full-lock-${{ matrix.tox }}.log
            packages/agent-evidence-observer/interop/adk-current-consumer-2026-10-03/full-tox-source-selection.json
            packages/agent-evidence-observer/interop/adk-current-consumer-2026-10-03/upstream-tox-corrections/
            packages/agent-evidence-observer/selected-adk/uv.lock
            packages/agent-evidence-observer/selected-adk/.tox/${{ matrix.tox }}/log/
          if-no-files-found: warn
          retention-days: 90

