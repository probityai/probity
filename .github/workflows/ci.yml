      - name: Authenticate and extract the retained original packet without executing it
        run: |
          python -I -B - <<'PYTHON'
          import hashlib, stat, zipfile
          from pathlib import Path, PurePosixPath
          selected=Path('interop/local-model-tool-arguments-2026-10-03/retained/native-37116827382.zip')
          raw=selected.read_bytes()
          assert len(raw)==2639358 and hashlib.sha256(raw).hexdigest()=='67ef1e638e814c71bbf354fe9895ea0faf5d9ef11eae2ff76b10b065bd7a7e54'
          output=Path('retained-tool-argument-packet');output.mkdir()
          with zipfile.ZipFile(selected) as archive:
              members=archive.infolist()
              assert len(members)==331 and sum(item.file_size for item in members)<=64*1024*1024
              assert len({item.filename for item in members})==len(members)
              for item in members:
                  relative=PurePosixPath(item.filename)
                  mode=item.external_attr>>16
                  assert not relative.is_absolute() and '..' not in relative.parts and len(relative.parts)<=32
                  assert not item.is_dir() and stat.S_IFMT(mode) in (0,stat.S_IFREG)
                  target=output.joinpath(*relative.parts);target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as handle:handle.write(archive.read(item))
          PYTHON
      - name: Install the original selected reader and preserve all eight actual quality holds
        run: |
          python -I -B interop/local-model-tool-arguments-2026-10-03/consume_actual.py . retained-tool-argument-packet interop/local-model-tool-arguments-2026-10-03/retained/native-37116827382-pins.json retained-tool-argument-consumer --reader-contract interop/local-model-tool-arguments-2026-10-03/reader-source-contract.json --reader-contract-sha256 edef015af7b63b8921d968e0c28b5f0da03f5cba2d23372e5fc8772bf0e2cecd
          python -I -B - <<'PYTHON'
