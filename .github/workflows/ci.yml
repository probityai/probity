          python -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "inspect_ai", "a2a", "langgraph", "pydantic_ai"))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
