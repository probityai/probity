      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected profile dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report install-report.json
      - name: Retrieve and verify selected published native binary
        run: |
          python download_binary.py execsurface > download-report.json
          ./execsurface doctor > doctor-report.json
      - name: Check owned adapter code and complexity
        run: |
          python -m ruff check --isolated companion.py workload.py download_binary.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' companion.py workload.py download_binary.py tests
      - name: Test real native execution, reference verifier and semantic refusal controls
        env:
          EXECSURFACE_BINARY: ${{ github.workspace }}/packages/agent-evidence-observer/interop/execsurface-state-2026-10-02/execsurface
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Execute finite exact-source capture and state binding
        run: |
          timeout --signal=TERM --kill-after=5s 60s python companion.py run native-run --binary ./execsurface --source-revision "$GITHUB_SHA" --write-pins "$RUNNER_TEMP/execsurface-pins.json" > native-report.json
