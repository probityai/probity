  observer-refund-handoff-conformance:
    name: "Probity refund handoff conformance / Offline conformance (${{ matrix.label }})"
    needs: [changes]
    if: ${{ fromJSON(needs.changes.outputs.jobs)['observer-refund-handoff-conformance'] }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: windows-2025
            label: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: packages/agent-evidence-observer
    env:
      UV_NO_CONFIG: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
      # The verifier bundles and archives its repository root and checks the
      # two agree, so give it a checkout whose root is the package tree: a
      # commit with tree HEAD:packages/agent-evidence-observer and parent HEAD.
      - name: Select the package tree as its own source root
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:packages/agent-evidence-observer)"
          date="$(git show -s --format=%cI HEAD)"
          commit="$(GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git -c user.name=ci -c user.email=ci@localhost commit-tree "$tree" -p HEAD -m "packages/agent-evidence-observer tree of $GITHUB_SHA")"
          git worktree add --detach "$RUNNER_TEMP/observer-root" "$commit"
          test "$(git -C "$RUNNER_TEMP/observer-root" rev-parse "HEAD^{tree}")" = "$tree"
      - name: Run the installed verifier over every public vector
        working-directory: ${{ runner.temp }}/observer-root
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native_temp="$(cygpath -u "$RUNNER_TEMP")"
          else
            native_temp="$RUNNER_TEMP"
