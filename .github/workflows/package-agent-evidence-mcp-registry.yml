# Moved from packages/agent-evidence-mcp/.github/workflows/publish-mcp-registry.yml when the
# package was imported. Publishes packages/agent-evidence-mcp/server.json to the official MCP
# Registry. The registry checks that the repository owner matches the io.github.probityai
# namespace through this job's GitHub OIDC identity, and that the PyPI package's README carries
# the mcp-name line. release.yml calls it after PyPI is published, so the registry cannot lag a
# release; it can still be run by hand.
name: package-agent-evidence-mcp-registry

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/agent-evidence-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned publisher
        run: |
          curl -fsSL -o publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
      - name: validate, authenticate with OIDC, publish
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
