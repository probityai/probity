# Moved from packages/observer/.github/workflows/witness-operator.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Installed witness operator and public client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/tests/**', 'packages/agent-evidence-observer/interop/witness-operator-2026-10-03/**', '.github/workflows/package-observer-witness-operator.yml', 'packages/agent-evidence-observer/pyproject.toml']
  pull_request:
    branches: [main]
    paths: ['packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/tests/**', 'packages/agent-evidence-observer/interop/witness-operator-2026-10-03/**', '.github/workflows/package-observer-witness-operator.yml', 'packages/agent-evidence-observer/pyproject.toml']

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-witness-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Install the public observer and the reader-side packages
        run: |
          python -m pip install --require-hashes -r interop/witness-operator-2026-10-03/requirements.lock
          python -m pip install --no-deps --no-build-isolation . interop/witness-operator-2026-10-03
      - name: Run the operator, retention and fork controls
        run: python -m pytest -c /dev/null -q -p no:cacheprovider interop/witness-operator-2026-10-03/test_operator.py interop/witness-operator-2026-10-03/test_retention.py interop/witness-operator-2026-10-03/test_reader_fork.py interop/witness-operator-2026-10-03/test_withheld_sources.py --junitxml="$RUNNER_TEMP/operator-tests.xml"
      - name: Check complexity
        run: python -I -B interop/witness-operator-2026-10-03/check_complexity.py > "$RUNNER_TEMP/complexity.json"
      - name: Replay the retained native packet with public code
        run: python -I -B interop/witness-operator-2026-10-03/verify_retained.py | tee "$RUNNER_TEMP/retained-replay.txt"
      - name: Retain the control results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: witness-operator-retained-replay
          path: |
            ${{ runner.temp }}/operator-tests.xml
            ${{ runner.temp }}/complexity.json
            ${{ runner.temp }}/retained-replay.txt
          if-no-files-found: error
          retention-days: 90
