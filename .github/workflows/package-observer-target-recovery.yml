# Moved from packages/observer/.github/workflows/target-recovery.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Protected target process recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/target-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-target-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/target-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-target-recovery.yml'
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/target-recovery-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected native target, test and wheel tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check native lifecycle and semantic refusal controls
        run: |
          python -m ruff check --isolated target_common.py target_reader.py host_gate.py verify_retained.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' target_common.py target_reader.py host_gate.py verify_retained.py tests
          python -m pytest -q --junitxml=test-results.xml
      - name: Verify the retained original packet with public observer code
        run: python verify_retained.py
      - name: Build actual Observer and additive reader distributions
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheels ../.. .
          sha256sum wheels/*.whl > wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/target-reader"
          "$RUNNER_TEMP/target-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report reader-install-report.json
          "$RUNNER_TEMP/target-reader/bin/python" -m pip install --no-deps wheels/*.whl
          "$RUNNER_TEMP/target-reader/bin/python" -m pip check
      - name: Run separate installed reader under host-selected publication policy
        run: |
          cp retained/fresh-run/consumer-pins.json "$RUNNER_TEMP/target-selected-pins.json"
          python - "$RUNNER_TEMP/target-selected-pins.json" "$RUNNER_TEMP/target-host-policy.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          pins = Path(sys.argv[1]).read_bytes()
          Path(sys.argv[2]).write_text(json.dumps({'profile': 'probity-target-process-recovery-v1', 'pinsSha256': hashlib.sha256(pins).hexdigest(), 'plannedAttempts': 7}))
          PY
          python host_gate.py retained/fresh-run --withheld-sources retained/WITHHELD-SOURCES.json --pins-file "$RUNNER_TEMP/target-selected-pins.json" --policy-file "$RUNNER_TEMP/target-host-policy.json" --policy-sha256 "$(sha256sum "$RUNNER_TEMP/target-host-policy.json" | cut -d' ' -f1)" --reader "$RUNNER_TEMP/target-reader/bin/probity-read-target-recovery" --output host-receipts > host-decision.json
      - name: Retain complete public packet and separately installed reader receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: target-recovery-${{ github.sha }}
          path: |
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/host-receipts/
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/host-decision.json
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/install-report.json
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/reader-install-report.json
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/wheels-sha256.txt
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/wheels/
            packages/agent-evidence-observer/interop/target-recovery-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
