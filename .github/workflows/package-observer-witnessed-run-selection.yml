# Moved from packages/observer/.github/workflows/witnessed-run-selection.yml when the package was imported;
# its steps run from packages/observer.
name: Installed witnessed run selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/observer/src/**', 'packages/observer/tests/**', 'packages/observer/interop/witnessed-run-selection-2026-10-04/**', '.github/workflows/package-observer-witnessed-run-selection.yml', 'packages/observer/pyproject.toml']
  pull_request:
    branches: [main]
    paths: ['packages/observer/src/**', 'packages/observer/tests/**', 'packages/observer/interop/witnessed-run-selection-2026-10-04/**', '.github/workflows/package-observer-witnessed-run-selection.yml', 'packages/observer/pyproject.toml']

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  installed-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - run: python -m pip install 'uv==0.8.22'
      - run: bash interop/witnessed-run-selection-2026-10-04/verify_install.sh "$RUNNER_TEMP/run-selection"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: witnessed-run-selection-native
          path: |
            ${{ runner.temp }}/run-selection/native/
            ${{ runner.temp }}/run-selection/wheels/
            ${{ runner.temp }}/run-selection/*.json
            ${{ runner.temp }}/run-selection/*.txt
            ${{ runner.temp }}/run-selection/*.lock
            ${{ runner.temp }}/run-selection/*-tests.xml
          if-no-files-found: error
          retention-days: 90
