# Moved from packages/observer/.github/workflows/joint-recovery.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Joint process and current-authority recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/target-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-joint-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/target-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-joint-recovery.yml'
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-and-installed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/joint-recovery-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected reader dependencies and exact Observer checkout
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-reader.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check semantic refusal controls over the retained packet
        run: |
          python -m ruff check --isolated joint_*.py verify_retained.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' joint_*.py verify_retained.py tests
          python -m pytest -q --junitxml=test-results.xml
      - name: Verify the retained original packet with public observer code
        run: python verify_retained.py
      - name: Build and normally install a separate framework-free reader
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheels ../.. .
          sha256sum wheels/*.whl > wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/joint-reader"
          "$RUNNER_TEMP/joint-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-reader.lock --report reader-install-report.json
          "$RUNNER_TEMP/joint-reader/bin/python" -m pip install --no-deps wheels/*.whl
          "$RUNNER_TEMP/joint-reader/bin/python" -m pip check
          "$RUNNER_TEMP/joint-reader/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("langgraph") is None'
      - name: Replay the retained packet through the installed reader
        run: |
          cp retained/fresh-run/consumer-pins.json "$RUNNER_TEMP/joint-selected-pins.json"
          "$RUNNER_TEMP/joint-reader/bin/python" -I -B "$RUNNER_TEMP/joint-reader/bin/probity-read-joint-recovery" retained/fresh-run --pins-file "$RUNNER_TEMP/joint-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > installed-reader.stdout
          cmp installed-reader.stdout retained/host-receipts/reader.stdout
      - name: Retain installed reader receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: joint-recovery-${{ github.sha }}
          path: |
            packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/installed-reader.stdout
            packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/install-report.json
            packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/reader-install-report.json
            packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/wheels-sha256.txt
            packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
