name: CrewAI native job fences and body effects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/crewai-job-fences-2026-10-04/**', 'packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/pyproject.toml', '.github/workflows/package-observer-crewai-job-fences.yml']
  pull_request:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/crewai-job-fences-2026-10-04/**', 'packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/pyproject.toml', '.github/workflows/package-observer-crewai-job-fences.yml']

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  installed-native-job-fences:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.15'
      - name: Install the public observer and the reader
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/crewai-job-fences-2026-10-04"
          python -m venv "$RUNNER_TEMP/reader"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements-runtime-reader.lock"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --no-deps "$GITHUB_WORKSPACE/packages/agent-evidence-observer" "$profile"
          "$RUNNER_TEMP/reader/bin/python" -m pip check
      - name: Check the retained record with public code only
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/crewai-job-fences-2026-10-04"
          "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/verify_retained.py"
      - name: Refuse thirty semantic mutations even when their hashes are reselected
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/crewai-job-fences-2026-10-04"
          "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/verify_retained.py" --materialize "$RUNNER_TEMP/run"
          CREWAI_JOB_PACKET="$RUNNER_TEMP/run/packet" "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/test_controls.py" -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: probityai/probity-verify
          ref: e835ce2bd6a960e7a1cc2fa6522f16d55dce728a
          path: packages/agent-evidence-observer/selected-verify
          persist-credentials: false
      - name: Install Verify and consume the retained projections twice
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/crewai-job-fences-2026-10-04"
          "$RUNNER_TEMP/reader/bin/python" -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/verify-wheels" "$GITHUB_WORKSPACE/packages/agent-evidence-observer/selected-verify"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/verify-wheels/agent_evidence_verify-0.1.0-py3-none-any.whl"
          "$RUNNER_TEMP/reader/bin/python" -m pip check
          policy_sha="$(sha256sum "$RUNNER_TEMP/run/host-policy.json" | cut -d ' ' -f 1)"
          python -I -B "$profile/verify_consumer.py" --reader "$RUNNER_TEMP/reader/bin/python" --source "$GITHUB_WORKSPACE/packages/agent-evidence-observer/selected-verify" --wheel "$RUNNER_TEMP/verify-wheels/agent_evidence_verify-0.1.0-py3-none-any.whl" --packet "$RUNNER_TEMP/run/packet" --policy "$RUNNER_TEMP/run/host-policy.json" --policy-sha256 "$policy_sha" --output "$RUNNER_TEMP/verify-consumer"
