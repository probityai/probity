# Moved from packages/observer/.github/workflows/witness.yml when the package was imported;
# its steps run from packages/observer.
name: Witness server

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-witness.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-witness.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the package with the witness extra (jcs-admit wheel from PyPI)
        run: python -m pip install -e '.[test,witness]'
      - name: Proof, log, scope, client and command-line tests
        run: python -m pytest -q -p no:cacheprovider tests/witness
      - name: Every verifier mutant fails the tests
        run: python scripts/mutate-witness-proofs.py
