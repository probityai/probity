# Moved from packages/observer/.github/workflows/aps-durable-refund.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Native APS refund controls

on:
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-aps-durable-refund.yml']
  push:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-aps-durable-refund.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  aps-refund:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked reader dependencies and the exact Observer checkout
        working-directory: packages/agent-evidence-observer/interop/aps-durable-refund-2026-10-05
        run: |
          npm ci --ignore-scripts
          uv venv "$RUNNER_TEMP/retained-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/retained-venv/bin/python" --require-hashes -r requirements.lock
          uv pip install --python "$RUNNER_TEMP/retained-venv/bin/python" --no-deps ../.. .
          uv pip check --python "$RUNNER_TEMP/retained-venv/bin/python"
      - name: Lint the kept files
        working-directory: packages/agent-evidence-observer/interop/aps-durable-refund-2026-10-05
        run: uvx ruff@0.15.6 check --isolated probity_aps_refund conftest.py test_reader.py verify_retained.py
      - name: Run the public reader tests over the retained captures
        working-directory: packages/agent-evidence-observer/interop/aps-durable-refund-2026-10-05
        run: '"$RUNNER_TEMP/retained-venv/bin/python" -m pytest -q test_reader.py'
      - name: Verify the retained captures with public observer code
        working-directory: packages/agent-evidence-observer/interop/aps-durable-refund-2026-10-05
        run: '"$RUNNER_TEMP/retained-venv/bin/python" -I -B verify_retained.py'
