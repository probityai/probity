name: Native ADK A2A failed-task installed consumer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/adk-a2a-failed-task-2026-10-03/**', 'packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/pyproject.toml', '.github/workflows/package-observer-adk-a2a-failed-task.yml']
  pull_request:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/adk-a2a-failed-task-2026-10-03/**', 'packages/agent-evidence-observer/src/**', 'packages/agent-evidence-observer/pyproject.toml', '.github/workflows/package-observer-adk-a2a-failed-task.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  native-adk-a2a-failed-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Install the public observer and the reader
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/adk-a2a-failed-task-2026-10-03"
          python -m venv "$RUNNER_TEMP/reader"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements-reader.lock"
          "$RUNNER_TEMP/reader/bin/python" -m pip install --no-compile --no-deps "$GITHUB_WORKSPACE/packages/agent-evidence-observer" "$profile"
          "$RUNNER_TEMP/reader/bin/python" -m pip check
      - name: Check the retained record with public code only
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/adk-a2a-failed-task-2026-10-03"
          "$RUNNER_TEMP/reader/bin/python" -I -B "$profile/verify_retained.py"
      - name: Run the reader fault controls over the retained packets
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packages/agent-evidence-observer/interop/adk-a2a-failed-task-2026-10-03"
          for variant in baseline proposed-fix; do
            ADK_FAILURE_VARIANT="$variant" "$RUNNER_TEMP/reader/bin/python" -I -B -m pytest -c /dev/null "$profile/test_native.py" --import-mode=importlib -q -p no:cacheprovider
          done
