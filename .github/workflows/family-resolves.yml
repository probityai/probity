name: family-resolves

# The published packages of the family must install together. Daily and on demand here; a pull request that touches a package manifest or this
# check runs it as the family-resolves job of ci.yml: install the
# latest release of every family package into one fresh environment, run
# `uv pip check`, import each, and refuse an exact `==` pin of one family member
# by another (scripts/family_resolves.py). The script's own tests run in ci.yml's
# lint job with the rest of tests/.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-resolves:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 scripts/family_resolves.py lint
      - run: python3 scripts/family_resolves.py resolve
