name: family-resolves

# The published packages of the family must install together. Daily, on demand, and
# on any pull request that touches a package manifest or this check: install the
# latest release of every family package into one fresh environment, run
# `uv pip check`, import each, and refuse an exact `==` pin of one family member
# by another (scripts/family_resolves.py). The script's own tests run in ci.yml's
# lint job with the rest of tests/.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**/pyproject.toml'
      - 'scripts/family_resolves.py'
      - 'tests/test_family_resolves.py'
      - '.github/workflows/family-resolves.yml'

permissions:
  contents: read

jobs:
  family-resolves:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: python3 scripts/family_resolves.py lint
      - run: python3 scripts/family_resolves.py resolve
