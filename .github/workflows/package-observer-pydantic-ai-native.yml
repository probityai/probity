# Moved from packages/observer/.github/workflows/pydantic-ai-native.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Pydantic AI native ticket consumer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/pydantic-ai-native-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-pydantic-ai-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/pydantic-ai-native-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-pydantic-ai-native.yml'

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/pydantic-ai-native-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected dependencies, the public observer and the reference wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps ../..
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/pydantic-wheels"
          python -m pip install --no-deps "$RUNNER_TEMP/pydantic-wheels"/probity_pydantic_reference-0.0.1-py3-none-any.whl
          python -m pip check
      - name: Check retained transcript and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=test-results.xml
          ruff check --select E,F,I,C901 --config 'lint.mccabe.max-complexity=5' src tests verify_retained.py
      - name: Verify the retained native packet with public code only
        shell: bash
        run: python verify_retained.py
      - name: Install separate offline consumer without agent framework
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pydantic-reader"
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip install --require-hashes -r requirements-reader.lock
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip install --no-deps ../..
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip install --no-deps "$RUNNER_TEMP/pydantic-wheels"/probity_pydantic_reference-0.0.1-py3-none-any.whl
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip check
          "$RUNNER_TEMP/pydantic-reader/bin/python" -c "import importlib.util; assert importlib.util.find_spec('pydantic_ai') is None"
      - name: Consume the retained packet with separately supplied demonstration pins
        shell: bash
        run: |
          set -euo pipefail
          packet=retained/fresh-run/packet
          cp "$packet/consumer-pins.json" "$RUNNER_TEMP/pydantic-selected-pins.json"
          "$RUNNER_TEMP/pydantic-reader/bin/probity-pydantic-read" "$packet" --pins-file "$RUNNER_TEMP/pydantic-selected-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/consumer-report.json"
          python -c "import json,os; from pathlib import Path; a=json.loads(Path(os.environ['RUNNER_TEMP'], 'consumer-report.json').read_bytes()); c=json.loads(Path('retained/fresh-run/packet/report.json').read_bytes()); assert a==c and a['status']=='verified' and a['plannedAttempts']==7"
