# Moved from packages/observer/.github/workflows/local-model-tool-arguments.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Prospective native tool arguments and abstention
on:
  workflow_dispatch:
    inputs:
      reviewed_source_head:
        description: Exact reviewed source head; explicit inference authorization
        required: true
        type: string
permissions:
  contents: read
  actions: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  offline-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install ordinary CI test tools (separate from native preparation)
        run: python -m pip install pytest==8.3.3 hypothesis==6.168.3 ruff==0.15.8
      - run: python -B -m pytest interop/local-model-tool-arguments-2026-10-03/tests -q
      - run: python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' interop/local-model-tool-arguments-2026-10-03/*.py
      # The preregistered controls select Git blobs relative to the repository
      # root and cannot change, so give them a checkout whose root is the
      # package tree: a commit with tree HEAD:packages/agent-evidence-observer and parent HEAD.
      - name: Select the package tree as its own source root
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:packages/agent-evidence-observer)"
          date="$(git show -s --format=%cI HEAD)"
          commit="$(GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git -c user.name=ci -c user.email=ci@localhost commit-tree "$tree" -p HEAD -m "packages/agent-evidence-observer tree of $GITHUB_SHA")"
          git worktree add --detach "$RUNNER_TEMP/observer-root" "$commit"
          test "$(git -C "$RUNNER_TEMP/observer-root" rev-parse "HEAD^{tree}")" = "$tree"
      - name: Really install and replay disclosed synthetic consumer controls
        working-directory: ${{ runner.temp }}/observer-root
        run: python -I -B interop/local-model-tool-arguments-2026-10-03/verify_installation.py . "$GITHUB_WORKSPACE/packages/agent-evidence-observer/installed-tool-argument-controls"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tool-argument-installed-offline-controls-${{ github.sha }}
          path: packages/agent-evidence-observer/installed-tool-argument-controls
          if-no-files-found: error
          retention-days: 90
  actual-cpu:
    if: github.event_name == 'workflow_dispatch' && inputs.reviewed_source_head == github.sha
    needs: offline-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      # The preregistration binds the study to commits of the original observer repository, whose
      # paths start at its old root. The import rewrote those commits, so fetch the original objects
      # from the archived repository; the frozen scripts and their inputs stay unchanged.
      - name: Fetch the preregistered source commits from the original observer repository
        run: git fetch --no-tags --depth=1 https://github.com/probityai/agent-evidence-observer.git 884814fe8cbc2e3b21d267fbaf86726c37892b14 db429775f139396df4028a9f4367e9bdfaa4ba17
      - name: Verify exact prior archive once and install selected runtime entirely offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -B - <<'PYTHON'
          import importlib.util
          from pathlib import Path
          root=Path('interop/local-model-tool-arguments-2026-10-03').resolve()
          spec=importlib.util.spec_from_file_location('selected_tool_entry',root/'task_matrix.py')
          entry=importlib.util.module_from_spec(spec);exec(compile((root/'task_matrix.py').read_bytes(),str(root/'task_matrix.py'),'exec'),entry.__dict__)
          protocol=entry.active_protocol()
          from reusable_runtime import prepare_archive,install_runtime
          prepared=Path('tool-argument-preparation').resolve()
          prepare_archive(protocol,prepared)
          install_runtime(protocol,prepared,prepared/'runtime-environment')
          PYTHON
      - name: Execute exactly128 prospective native calls with external whole-child observations
        run: |
          python -I -B interop/local-model-tool-arguments-2026-10-03/execute_guard.py tool-argument-preparation/run tool-argument-preparation . tool-argument-observer --runtime-python tool-argument-preparation/runtime-environment/bin/python --execution-selection interop/local-model-tool-arguments-2026-10-03/execution-selection.json --execution-selection-sha256 2fc1544ef789303a3c6fe42ac5f4ecc2aded6c0c89255c36412e9122cd994e3a
      - name: Install and verify the actual packet separately (quality holds remain explicit)
        run: |
          python -I -B interop/local-model-tool-arguments-2026-10-03/consume_actual.py . tool-argument-preparation/run tool-argument-preparation/run/consumer-pins.json actual-tool-argument-consumer --reader-contract interop/local-model-tool-arguments-2026-10-03/reader-source-contract.json --reader-contract-sha256 edef015af7b63b8921d968e0c28b5f0da03f5cba2d23372e5fc8772bf0e2cecd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tool-argument-cpu-preparation-${{ github.sha }}
          path: |
            packages/agent-evidence-observer/tool-argument-preparation
            packages/agent-evidence-observer/tool-argument-observer
            packages/agent-evidence-observer/actual-tool-argument-consumer
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tool-argument-cpu-native-packet-${{ github.sha }}
          path: packages/agent-evidence-observer/tool-argument-preparation/run
          if-no-files-found: warn
          retention-days: 90
