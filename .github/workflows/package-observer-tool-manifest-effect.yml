# Moved from packages/observer/.github/workflows/tool-manifest-effect.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Tool manifest and retained effect

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/tests/**'
      - 'packages/agent-evidence-observer/examples/tool_manifest_effect.py'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - 'packages/agent-evidence-observer/interop/**/requirements*.lock'
      - 'packages/agent-evidence-observer/scripts/check-runtime-locks.py'
      - 'packages/agent-evidence-observer/docs/TOOL-MANIFEST-EFFECT.md'
      - 'packages/agent-evidence-observer/docs/reference/TOOL-MANIFEST-EFFECT.md'
      - '.github/workflows/package-observer-tool-manifest-effect.yml'
  pull_request:
    paths: ['packages/agent-evidence-observer/**', '.github/workflows/package-observer-tool-manifest-effect.yml']
  workflow_dispatch:

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  offline-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
      - name: Install and run the core source suite
        run: |
          uv venv .venv --python python3.12
          uv pip install --python .venv/bin/python -e '.[test,witness]'
          uv pip check --python .venv/bin/python
          .venv/bin/python scripts/check-runtime-locks.py
          .venv/bin/pytest -q
      - name: Read the retained contributor case
        run: .venv/bin/pytest -q tests/test_tool_manifest_effect.py
