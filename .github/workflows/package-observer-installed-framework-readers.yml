# Moved from packages/observer/.github/workflows/installed-framework-readers.yml when the package was imported;
# its steps run from packages/observer.
name: Installed framework readers
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/observer/interop/framework-consumer-2026-10-02/**'
      - '.github/workflows/package-observer-installed-framework-readers.yml'
  push:
    branches: [main]
    paths:
      - 'packages/observer/interop/framework-consumer-2026-10-02/**'
      - '.github/workflows/package-observer-installed-framework-readers.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/observer

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 368dc31ac2d4f4f3eabad29c3140257c44dedcbb
          path: packages/observer/historical-reader-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b5d096e23837ffb3c7d358f9752ba8a9f0fce39e
          path: packages/observer/durable-reader-source
          persist-credentials: false
      - name: Install hash-selected reader and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock
      - name: Build and normally install the selected wheels
        run: |
          bash interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-BUILD-2026-10-02.sh "$GITHUB_WORKSPACE/packages/observer/historical-reader-source/packages/observer" "$RUNNER_TEMP/framework-wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP/framework-wheels/"*.whl
          python -m pip check
      - name: Verify the actual historical baseline before upgrading
        run: |
          python -m pip install pytest==8.4.2
          python interop/framework-consumer-2026-10-02/check_historical_reader_baseline.py "$RUNNER_TEMP/historical-baseline.json"
          python -m pytest -q interop/framework-consumer-2026-10-02/test_installed_readers.py interop/consumer-host-2026-10-02/test_framework_gate.py --junitxml=historical-baseline-tests.xml
      - name: Build the frozen durable candidate and normally upgrade the reader
        run: |
          bash interop/framework-consumer-2026-10-02/FRAMEWORK-DURABLE-CONSUMER-BUILD-2026-10-02.sh "$GITHUB_WORKSPACE/packages/observer/durable-reader-source/packages/observer" "$RUNNER_TEMP/durable-reader-wheels"
          python -m pip install --no-index --no-deps --upgrade "$RUNNER_TEMP/durable-reader-wheels/"*.whl
          python -m pip check
      - name: Exercise installed commands and semantic refusals
        run: |
          python -m pip install pytest==8.4.2 ruff==0.15.6
          python -m ruff check interop/framework-consumer-2026-10-02/*.py
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' interop/framework-consumer-2026-10-02/*.py
          FRAMEWORK_DURABLE_SELECTED_SOURCE="$GITHUB_WORKSPACE/packages/observer/durable-reader-source/packages/observer" python -m pytest -q interop/framework-consumer-2026-10-02/test_installed_readers.py interop/framework-consumer-2026-10-02/test_durable_installed_reader.py --junitxml=installed-reader-tests.xml
      - name: Retain installation and control results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-framework-readers
          path: |
            ${{ runner.temp }}/framework-wheels/build-record.json
            ${{ runner.temp }}/durable-reader-wheels/build-record.json
            ${{ runner.temp }}/historical-baseline.json
            packages/observer/historical-baseline-tests.xml
            packages/observer/installed-reader-tests.xml
          if-no-files-found: error
          retention-days: 90
