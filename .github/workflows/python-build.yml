name: python-build

# Build one workspace member's wheel and source distribution with the hash-pinned
# release toolchain, check them, install them outside the checkout, and upload
# them. CI and the release workflow both call this, so a release publishes files
# built exactly the way every pull request builds them.
#
# A member may ship these scripts, and each one that exists is run:
#   scripts/check-artifacts.py <wheel> <sdist>           payload and metadata checks
#   scripts/check-artifacts-controls.py <wheel> <sdist>  refusal controls for those checks
#   scripts/check-installed.py                           run from outside the checkout
#   scripts/build-recipes.py --check                     run with the installed package
#
# The files are built from the checkout this run made, which holds the tracked files of one
# commit and nothing else, and scripts/check-dist-clean.py then opens every file in dist/ and
# fails on a private name, a private path, or a path scripts/dist-allowlist.toml does not list.
# The private names come from the DIST_CLEAN_PRIVATE_NAMES secret and are never written here.
# A build outside CI goes through scripts/build-from-tag.py, which exports the tag first.

on:
  workflow_call:
    inputs:
      distribution:
        required: true
        type: string
    secrets:
      # The private names scripts/check-dist-clean.py refuses, one per line. They live only in
      # this secret; the check fails closed when it is empty (a fork's pull request, for one).
      DIST_CLEAN_PRIVATE_NAMES:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refuse a tree that is not a clean checkout
        run: |
          set -euo pipefail
          status="$(git status --porcelain --ignored)"
          if [ -n "$status" ]; then
            echo "the build tree has files the commit does not track:" >&2
            echo "$status" >&2
            exit 1
          fi
      - name: Install the pinned release tools
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Build the member and every workspace member it depends on
        env:
          PYTHONHASHSEED: '0'
          DISTRIBUTION: ${{ inputs.distribution }}
          DIST_CLEAN_PRIVATE_NAMES: ${{ secrets.DIST_CLEAN_PRIVATE_NAMES }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          mapfile -t dirs < <(python3 scripts/workspace.py requires "$DISTRIBUTION")
          target="${dirs[-1]}"
          echo "MEMBER_DIR=$target" >> "$GITHUB_ENV"
          for dir in "${dirs[@]}"; do
            out=dependencies
            [ "$dir" = "$target" ] && out=dist
            python -m build --no-isolation --outdir "$out" "$dir"
          done
          python -m twine check --strict dist/*
          python scripts/check-dist-clean.py --self-test
          python scripts/check-dist-clean.py --allowlist scripts/dist-allowlist.toml --distribution "$DISTRIBUTION" dist/*
          if [ -f "$target/scripts/check-artifacts.py" ]; then
            python "$target/scripts/check-artifacts.py" dist/*.whl dist/*.tar.gz
          fi
          if [ -f "$target/scripts/check-artifacts-controls.py" ]; then
            python "$target/scripts/check-artifacts-controls.py" dist/*.whl dist/*.tar.gz
          fi
          if [ -f "$target/scripts/check-distribution.py" ]; then
            python "$target/scripts/check-distribution.py" dist/*.whl dist/*.tar.gz
          fi
          if [ -f "$target/scripts/check-distribution-controls.py" ]; then
            python "$target/scripts/check-distribution-controls.py" dist/*.whl
          fi
          sha256sum dist/* > SHA256SUMS
          git rev-parse HEAD > SOURCE-COMMIT
      - name: Install outside the checkout and rebuild from the source distribution
        run: |
          set -euo pipefail
          links=()
          [ -d dependencies ] && links=(--find-links dependencies)
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install "${links[@]}" dist/*.whl --report wheel-install.json
          "$RUNNER_TEMP/consumer/bin/python" -m pip check
          mkdir "$RUNNER_TEMP/consumer-cwd" "$RUNNER_TEMP/source"
          if [ -f "$MEMBER_DIR/scripts/check-installed.py" ]; then
            (cd "$RUNNER_TEMP/consumer-cwd" && "$RUNNER_TEMP/consumer/bin/python" "$GITHUB_WORKSPACE/$MEMBER_DIR/scripts/check-installed.py") > wheel-consumer.json
          fi
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/source"
          python -m build --no-isolation --wheel --outdir rebuilt "$RUNNER_TEMP/source/"*
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-deps --force-reinstall rebuilt/*.whl --report sdist-install.json
          if [ -f "$MEMBER_DIR/scripts/check-installed.py" ]; then
            (cd "$RUNNER_TEMP/consumer-cwd" && "$RUNNER_TEMP/consumer/bin/python" "$GITHUB_WORKSPACE/$MEMBER_DIR/scripts/check-installed.py") > sdist-consumer.json
          fi
          if [ -f "$MEMBER_DIR/scripts/build-recipes.py" ]; then
            (cd "$MEMBER_DIR" && "$RUNNER_TEMP/consumer/bin/python" scripts/build-recipes.py --check)
          fi
          if [ -x "$RUNNER_TEMP/consumer/bin/probityai" ]; then
            "$RUNNER_TEMP/consumer/bin/probityai" --help
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions-${{ inputs.distribution }}
          path: |
            dist/
            SHA256SUMS
            SOURCE-COMMIT
            *-install.json
            *-consumer.json
          if-no-files-found: error
          retention-days: 30
