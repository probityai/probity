# Moved from packages/observer/.github/workflows/refund-handoff-conformance.yml when the package was imported;
# its steps run from packages/observer.
name: Probity refund handoff conformance

on:
  push:
    branches: [main]
    paths:
      - 'packages/observer/interop/refund-handoff-conformance-2026-10-12/**'
      - 'packages/observer/src/probity_observer/crypto.py'
      - 'packages/observer/src/probity_observer/refund_handoff.py'
      - 'packages/observer/src/probity_observer/refund_handoff_reasons.py'
      - 'packages/observer/pyproject.toml'
      - 'packages/observer/docs/REFUND-HANDOFF-CONFORMANCE.md'
      - 'packages/observer/docs/reference/REFUND-HANDOFF-CONFORMANCE.md'
      - 'packages/observer/docs/contract/refund-handoff/0.1/**'
      - '.github/workflows/package-observer-refund-handoff-conformance.yml'
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-refund-handoff-conformance.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  offline-conformance:
    name: Offline conformance (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: windows-2025
            label: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: packages/observer
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.5'
      # The verifier bundles and archives its repository root and checks the
      # two agree, so give it a checkout whose root is the package tree: a
      # commit with tree HEAD:packages/observer and parent HEAD.
      - name: Select the package tree as its own source root
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:packages/observer)"
          date="$(git show -s --format=%cI HEAD)"
          commit="$(GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git -c user.name=ci -c user.email=ci@localhost commit-tree "$tree" -p HEAD -m "packages/observer tree of $GITHUB_SHA")"
          git worktree add --detach "$RUNNER_TEMP/observer-root" "$commit"
          test "$(git -C "$RUNNER_TEMP/observer-root" rev-parse "HEAD^{tree}")" = "$tree"
      - name: Run the installed verifier over every public vector
        working-directory: ${{ runner.temp }}/observer-root
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native_temp="$(cygpath -u "$RUNNER_TEMP")"
          else
            native_temp="$RUNNER_TEMP"
          fi
          results="$native_temp/refund-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash interop/refund-handoff-conformance-2026-10-12/verify_install.sh "$results"
      - name: Retain every report and refusal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: refund-handoff-conformance-${{ matrix.label }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/refund-handoff-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/refund-handoff-${{ github.run_id }}-${{ github.run_attempt }}/.venv/
            !${{ runner.temp }}/refund-handoff-${{ github.run_id }}-${{ github.run_attempt }}/test-source/
            !${{ runner.temp }}/refund-handoff-${{ github.run_id }}-${{ github.run_attempt }}/evidence-source/
