name: pin-refresh

# Moves every family lock (the root version-pins.toml and the package configs) and the
# pages they hold to the newest releases as a pull request and lands it when green. A
# finished release run triggers it at once; the hourly run is the path for releases made
# in other repositories, which reach this repository within an hour, inside the one-day
# grace registry-verify allows.
#
# With the organisation's pin-refresh App (variable PIN_REFRESH_APP_CLIENT_ID, secret
# PIN_REFRESH_APP_PRIVATE_KEY) the pull request is opened with its installation token, so
# it gets its own pull_request run, and is handed to auto-merge and the merge queue in this
# job. Without them the action uses the Actions token and dispatches ci.yml itself
# (probityai/.github docs/pin-refresh.md). verify_pr checks an open bump pull request
# without changing anything: it fails unless ci.yml has a started pull_request run there.

on:
  schedule:
    - cron: "35 * * * *"
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "why it runs now"
        required: false
        type: string
      dry_run:
        description: "show the bump and change nothing remote"
        required: false
        type: boolean
        default: false
      verify_pr:
        description: "a bump pull request number: change nothing, fail unless ci.yml has a started pull_request run on it"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The action pushes with its own GH_TOKEN header; a persisted checkout
          # credential adds a second Authorization header and GitHub refuses the push
          # with HTTP 400 ("Duplicate header"), which left every family lock stale.
          persist-credentials: false
      - name: write the download badges as static files
        run: python3 scripts/refresh-badges.py || true
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
      - uses: probityai/.github/actions/pin-refresh@2fac7683ee7a3328ef06fc2f5bef645942f24e70 # main
        with:
          configs: |
            version-pins.toml
            packages/agent-evidence-mcp/version-pins.toml
            packages/agent-evidence-replay/version-pins.toml
            harnesses/agent-evidence-plugins/version-pins.toml
          ci: ci.yml
          app-client-id: ${{ vars.PIN_REFRESH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PIN_REFRESH_APP_PRIVATE_KEY }}
          dry-run: ${{ inputs.dry_run == true }}
          verify-pr: ${{ inputs.verify_pr }}
