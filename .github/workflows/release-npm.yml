name: release-npm

# Publish @probityai/records-verify to npm from a GitHub release whose tag is
# records-verify-v<version>, for example records-verify-v0.1.0. The tag must match
# the version in node/probity-records-verify/package.json and point at a commit on
# main. The package is built by its own prepack script from the committed tree, the
# tests run first, and the job reads the published version back from the registry.
#
# The publish job runs in the `npm` environment, which holds the NPM_TOKEN secret
# and allows only tags matching records-verify-v*. PyPI releases stay in release.yml;
# that workflow skips this tag prefix.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-records-verify:
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'records-verify-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@probityai/records-verify
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: node/probity-records-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main and matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "records-verify-v${version}"
      # Node 22.18 runs the TypeScript sources natively (the package's engines floor).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node --test test/*.test.ts
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@probityai/records-verify@${version}" version > /dev/null 2>&1; then
            echo "@probityai/records-verify ${version} is already on npm; nothing to publish"
            exit 0
          fi
          npm publish --access public --provenance
      - name: the registry holds the version this tag names
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$(npm view '@probityai/records-verify' version)" = "$version"
