# Moved from packages/agent-evidence-plugins/.github/workflows/ci.yml when the package was
# imported; its steps run from harnesses/agent-evidence-plugins. The README shape check is the
# root lint job's.
name: package-agent-evidence-plugins

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harnesses/agent-evidence-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned verifier and the test runner
        run: python -m pip install "agent-evidence-verify==0.5.0" "pytest>=8,<10"
      - name: Tests
        run: python -m pytest -q

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the version-pins script at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/.github
          ref: ecb47052aa3ae8188c74f3cdc31eb8f4e9402811
          path: .github-scripts
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: every version a page names equals its manifest or the family lock
        run: python3 -B .github-scripts/scripts/version-pins.py check --root . --config harnesses/agent-evidence-plugins/version-pins.toml
      - name: manifests parse
        run: |
          for f in .claude-plugin/marketplace.json harnesses/agent-evidence-plugins/plugins/verdict-bundle-gate/.claude-plugin/plugin.json harnesses/agent-evidence-plugins/plugins/verdict-bundle-gate/hooks/hooks.json harnesses/agent-evidence-plugins/cursor/hooks.json; do python3 -m json.tool "$f" > /dev/null; done
