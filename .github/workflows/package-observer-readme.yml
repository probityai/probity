# Moved from packages/observer/.github/workflows/readme.yml when the package was imported;
# its steps run from packages/observer.
name: README shape

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-readme.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-readme.yml']
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the README stays one screen and every link in it resolves
        run: |
          python3 scripts/readme-lint.py README.md
          python3 scripts/readme-lint-test.py
