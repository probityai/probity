# Moved from packages/observer/.github/workflows/native-consumer.yml when the package was imported;
# its steps run from packages/observer.
name: Installed native consumer reader

on:
  pull_request:
    paths: ['packages/observer/**', '.github/workflows/package-observer-native-consumer.yml']
  push:
    paths: ['packages/observer/**', '.github/workflows/package-observer-native-consumer.yml']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/observer

jobs:
  native-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install producer and test environment
        run: |
          python -m pip install -e '.[test,inspect]' build
          python -m pip install -e 'interop/a2a-native-2026-10-02[test]'
      - name: Check reader process and failure controls
        run: python -m pytest -q tests/test_native_reader.py --junitxml=native-consumer-tests.xml
      - name: Retain two native controlled packets
        run: |
          mkdir -p native-producer/inspect-execution native-producer/a2a
          python interop/evaluation-contract-2026-10-01/inspect_execution.py native-producer/inspect-execution/native
          python interop/a2a-native-2026-10-02/a2a_demo.py native-producer/a2a/native
      - name: Build wheel and use it from an outside consumer directory
        run: |
          python -m build --wheel --outdir dist
          python scripts/check-distribution.py dist/*.whl
          python scripts/check-distribution-controls.py dist/*.whl
          python -m venv "$RUNNER_TEMP/native-consumer-env"
          "$RUNNER_TEMP/native-consumer-env/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/native-consumer-cwd"
          cd "$RUNNER_TEMP/native-consumer-cwd"
          "$RUNNER_TEMP/native-consumer-env/bin/python" "$GITHUB_WORKSPACE/packages/observer/examples/native_consumer_demo.py" --source-checkout "$GITHUB_WORKSPACE/packages/observer" --native-root "$GITHUB_WORKSPACE/packages/observer/native-producer" --output "$GITHUB_WORKSPACE/packages/observer/native-consumer-result"
          "$RUNNER_TEMP/native-consumer-env/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("inspect_ai") is None; assert importlib.util.find_spec("a2a") is None'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-consumer-reader
          path: |
            packages/observer/native-producer/
            packages/observer/native-consumer-result/
            packages/observer/native-consumer-tests.xml
            packages/observer/dist/*.whl
          if-no-files-found: error
