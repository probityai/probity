# Moved from packages/observer/.github/workflows/langgraph-crash-window.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Native LangGraph effect checkpoint crash window
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/**'
      - 'packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/target-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-langgraph-crash-window.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/**'
      - 'packages/agent-evidence-observer/interop/joint-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/target-recovery-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-langgraph-crash-window.yml'
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-and-installed-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install hash-selected reader dependencies and exact Observer source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../joint-recovery-2026-10-02/requirements-reader.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Verify the retained packet and meaningful semantic refusals
        run: |
          python -m ruff check --isolated crash_*.py consume_installed.py verify_retained.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' crash_*.py consume_installed.py verify_retained.py tests
          python -m pytest -q --junitxml=test-results.xml
          python verify_retained.py
      - name: Build normal framework-free reader wheels and environment
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir reader-wheels ../.. ../joint-recovery-2026-10-02 .
          sha256sum reader-wheels/*.whl > reader-wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/crash-window-reader"
          "$RUNNER_TEMP/crash-window-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r ../joint-recovery-2026-10-02/requirements-reader.lock --report reader-install-report.json
          "$RUNNER_TEMP/crash-window-reader/bin/python" -m pip install --no-deps reader-wheels/*.whl
          "$RUNNER_TEMP/crash-window-reader/bin/python" -m pip check
          "$RUNNER_TEMP/crash-window-reader/bin/python" -I -c 'import importlib.util; assert importlib.util.find_spec("langgraph") is None'
      - name: Select host installation and pins and replay through isolated reader
        run: |
          cp retained/fresh-run/consumer-pins.json "$RUNNER_TEMP/crash-window-selected-pins.json"
          cp retained/WITHHELD-SOURCES.json "$RUNNER_TEMP/crash-window-withheld.json"
          PYTHONPATH=../joint-recovery-2026-10-02 python - "$RUNNER_TEMP/crash-window-reader/bin/probity-read-langgraph-crash-window" "$RUNNER_TEMP/crash-window-selected-closure.json" <<'PY'
          import sys
          from pathlib import Path
          from joint_host_gate import reader_closure
          from probity_observer.crypto import canonical
          reader, output = map(Path, sys.argv[1:])
          output.write_bytes(canonical(reader_closure(reader)))
          PY
          python consume_installed.py retained/fresh-run --pins-file "$RUNNER_TEMP/crash-window-selected-pins.json" --withheld-sources "$RUNNER_TEMP/crash-window-withheld.json" --reader "$RUNNER_TEMP/crash-window-reader/bin/probity-read-langgraph-crash-window" --selected-closure "$RUNNER_TEMP/crash-window-selected-closure.json" --output consumer-receipts > installed-report.json
          python -c 'import json; assert json.load(open("retained/fresh-report.json")) == json.load(open("installed-report.json"))'
      - name: Retain installed consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: langgraph-crash-window-${{ github.sha }}
          path: |
            packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/consumer-receipts/
            packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/installed-report.json
            packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/reader-wheels-sha256.txt
            packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/install-report.json
            packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/reader-install-report.json
            packages/agent-evidence-observer/interop/langgraph-crash-window-2026-10-03/test-results.xml
          if-no-files-found: error
          retention-days: 90
