# Moved from packages/observer/.github/workflows/authority-unreachable.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Authority at dispatch and durable effect reference
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/authority-unreachable-2026-10-03/**', 'packages/agent-evidence-observer/src/probity_observer/**', '.github/workflows/package-observer-authority-unreachable.yml']
  push:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/authority-unreachable-2026-10-03/**', 'packages/agent-evidence-observer/src/probity_observer/**', '.github/workflows/package-observer-authority-unreachable.yml']
permissions:
  contents: read
# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  retained-and-installed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install exact reader dependencies and the Observer checkout
        run: |
          python -m pip install -r interop/authority-unreachable-2026-10-03/requirements.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Fetch immutable review source for bounded function checks
        run: curl --fail --location --proto '=https' --output "$RUNNER_TEMP/alakris-publication_jobs.py" 'https://git.elibot.ru/agent-bot/aaif-publication-reference/raw/commit/6e0beb6d39bb1faa279087fd06cf2fe6c98e639c/core/agent-core/src/core/content/publication_jobs.py'
      - name: Confirm vendored implementation records still match their sources
        run: python interop/authority-unreachable-2026-10-03/implementation_records.py interop/authority-unreachable-2026-10-03/implementation-records "$RUNNER_TEMP/implementation-records-upstream.json" --check-upstream
      - name: Lint and test the reader over the retained run
        working-directory: packages/agent-evidence-observer/interop/authority-unreachable-2026-10-03
        run: |
          python -m ruff check --isolated ./*.py
          ALAKRIS_SOURCE="$RUNNER_TEMP/alakris-publication_jobs.py" python -m pytest -q -p no:cacheprovider
      - name: Verify the retained run with public observer code
        run: python -I interop/authority-unreachable-2026-10-03/verify_retained.py
      - name: Replay the retained run through a separately installed reader
        run: bash interop/authority-unreachable-2026-10-03/verify_install.sh "$RUNNER_TEMP/authority-reader" "$RUNNER_TEMP/alakris-publication_jobs.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: authority-unreachable-reader-${{ github.sha }}
          path: |
            ${{ runner.temp }}/authority-reader/wheels/
            ${{ runner.temp }}/authority-reader/*.json
            ${{ runner.temp }}/authority-reader/*.xml
            ${{ runner.temp }}/authority-reader/*.txt
            ${{ runner.temp }}/implementation-records-upstream.json
          if-no-files-found: error
          retention-days: 90
