# Moved from packages/observer/.github/workflows/langgraph-recovery-authority.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: LangGraph recovery authority
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-langgraph-recovery-authority.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02/**'
      - 'packages/agent-evidence-observer/interop/langgraph-ticket-2026-10-02/**'
      - 'packages/agent-evidence-observer/src/probity_observer/**'
      - 'packages/agent-evidence-observer/pyproject.toml'
      - '.github/workflows/package-observer-langgraph-recovery-authority.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  recovery-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-evidence-observer/interop/langgraph-recovery-authority-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install selected native profile and exact Observer checkout
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../langgraph-ticket-2026-10-02/requirements-restart.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check reader and bounded complexity
        run: |
          python -m ruff check --isolated authority_common.py authority_reader.py verify_retained.py tests
          python -m ruff check --isolated --select C901 --config 'lint.mccabe.max-complexity=5' authority_common.py authority_reader.py verify_retained.py tests
      - name: Test the retained packet and reselected refusal controls
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Verify the retained packet offline with public code only
        run: python verify_retained.py
      - name: Reconstruct the retained packet with the reader command line
        run: |
          set -euo pipefail
          cp retained/fresh-run/consumer-pins.json "$RUNNER_TEMP/authority-host-pins.json"
          python authority_reader.py retained/fresh-run --pins-file "$RUNNER_TEMP/authority-host-pins.json" --withheld-sources retained/WITHHELD-SOURCES.json > "$RUNNER_TEMP/reader-report.json"
          cmp "$RUNNER_TEMP/reader-report.json" retained/reader-report.json
