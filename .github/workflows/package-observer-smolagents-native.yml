# Moved from packages/observer/.github/workflows/smolagents-native.yml when the package was imported;
# its steps run from packages/agent-evidence-observer.
name: Native smolagents installed publication consumer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/smolagents-native-2026-10-03/**', '.github/workflows/package-observer-smolagents-native.yml', 'packages/agent-evidence-observer/pyproject.toml']
  pull_request:
    branches: [main]
    paths: ['packages/agent-evidence-observer/interop/smolagents-native-2026-10-03/**', '.github/workflows/package-observer-smolagents-native.yml', 'packages/agent-evidence-observer/pyproject.toml']

permissions:
  contents: read

# Frozen experiments: no uv call here reads the repository's uv settings (pyproject.toml, uv.toml).
env:
  UV_NO_CONFIG: "1"
defaults:
  run:
    working-directory: packages/agent-evidence-observer

jobs:
  native-smolagents:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable native SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: huggingface/smolagents
          ref: c30b115286e000e98711fae5e85993547b73d826
          path: packages/agent-evidence-observer/vendor-smolagents
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.15'
      - name: Install pinned verification runner
        run: python -m pip install 'uv==0.8.22'
      - name: Build installed consumers and check native fault controls
        run: bash interop/smolagents-native-2026-10-03/verify_install.sh "$RUNNER_TEMP/smolagents-native" "$GITHUB_WORKSPACE/packages/agent-evidence-observer/vendor-smolagents"
      - name: Retain actual native bytes and installed consumer results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smolagents-native-installed-consumer
          path: |
            ${{ runner.temp }}/smolagents-native/native/
            ${{ runner.temp }}/smolagents-native/wheels/
            ${{ runner.temp }}/smolagents-native/*-tests.xml
            ${{ runner.temp }}/smolagents-native/*-report.json
            ${{ runner.temp }}/smolagents-native/*-install.txt
            ${{ runner.temp }}/smolagents-native/*.lock
            ${{ runner.temp }}/smolagents-native/publication/
            ${{ runner.temp }}/smolagents-native/*-source-sha.txt
            ${{ runner.temp }}/smolagents-native/runtime.txt
          if-no-files-found: error
          retention-days: 90

