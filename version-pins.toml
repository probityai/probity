# Where each version the repository README and the architecture pages name is decided.
# Each package built here is read from its manifest; each package another repository
# releases is a family lock line. The pin-refresh workflow moves the locks and rewrites
# the pages hourly, and the package configs (packages/*/version-pins.toml,
# harnesses/*/version-pins.toml) are refreshed in the same run.
repository = "probityai/probity"

[[own]]
key = "pypi:probityai"
manifest = "packages/probityai/pyproject.toml"
publisher = "probityai/probity"
tag = "probityai-v{version}"

[[own]]
key = "pypi:agent-evidence-verify"
manifest = "packages/agent-evidence-verify/pyproject.toml"
publisher = "probityai/probity"
tag = "agent-evidence-verify-v{version}"

[[own]]
key = "pypi:probity-ratchet"
manifest = "packages/probity-ratchet/pyproject.toml"
publisher = "probityai/probity"
tag = "probity-ratchet-v{version}"

[[own]]
key = "pypi:agent-evidence-observer"
manifest = "packages/agent-evidence-observer/pyproject.toml"
publisher = "probityai/probity"
tag = "agent-evidence-observer-v{version}"

[[own]]
key = "pypi:agent-evidence-mcp"
manifest = "packages/agent-evidence-mcp/pyproject.toml"
publisher = "probityai/probity"
tag = "agent-evidence-mcp-v{version}"

# 0.2.0 was uploaded without a trusted-publisher record, so no publisher is declared; the
# version comes from the __version__ its pyproject names.
[[own]]
key = "pypi:probity-ratchet-cases"
manifest = "packages/probity-ratchet-cases/pyproject.toml"
tag = "probity-ratchet-cases-v{version}"

[[own]]
key = "pypi:probity-effects"
manifest = "packages/probity-effects/pyproject.toml"
publisher = "probityai/probity"
tag = "probity-effects-v{version}"

# Its own pages keep their version in packages/agent-evidence-replay/version-pins.toml.
[[own]]
key = "pypi:agent-evidence-replay"
manifest = "packages/agent-evidence-replay/pyproject.toml"
publisher = "probityai/probity"
tag = "agent-evidence-replay-v{version}"

[family]
"pypi:agent-evidence-vectors" = "0.35.0"
"pypi:agent-evidence-admission" = "0.2.0"
"pypi:agent-evidence-vocabulary" = "0.9.0"

[scan]
include = ["README.md", "docs/architecture/**/*.md"]
