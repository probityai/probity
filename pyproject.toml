# Workspace root. It is not a package: each member under packages/ declares its
# own distribution, version, licence and release tag. uv resolves every member
# together into the one uv.lock beside this file.

[tool.uv.workspace]
members = ["packages/*"]
# Unified-lock trial, 2026-11-01 (research/1140-gemini-share-1101-2026-11-01/LOCK-TRIAL.md). One lock holds
# probityai, probity-verify and evaluator-replay-kit, the members whose tests pass under it (Python floor 3.11).
# Each exclusion below is measured, with the error text in LOCK-TRIAL.md:
# - packages/probity-ratchet: uv refuses it ("Nested workspaces are not supported": it declares its own
#   [tool.uv.workspace] for probity-ratchet-cases), and its git-sourced benchmark extras, overrides and
#   dependency-metadata only apply from a workspace root.
# - packages/agent-evidence-observer: requires Python >=3.12, which lifts the whole lock from >=3.11 to >=3.12;
#   its path source for probity-verify must become a workspace source; 3 tests fail and 50 error under the
#   unified lock on the box (the errors are in tests/launch/test_docker_launch.py).
# - packages/agent-evidence-mcp: its PyPI-pinned family tests fail under the unified lock (11 of 46 tests fail:
#   verify_sample, verify_claim and the stdio server test), and uv wants an explicit workspace source for
#   probity-verify.
# - harnesses/agent-evidence-plugins is not a distribution: it pins probity-verify from PyPI for its tests.
# - packages/probity-effects: its tests install the agent frameworks its adapters drive (LangGraph first), and
#   their dependency trees would bind every member's lock.
# scripts/workspace.py still reads the excluded packages and their members.
exclude = ["packages/probity-ratchet", "packages/agent-evidence-observer", "packages/agent-evidence-mcp", "packages/probity-effects", "harnesses/agent-evidence-plugins"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "hypothesis>=6.170.14,<7", "ruff==0.17.3"]

[tool.pytest.ini_options]
# `uv run python -m pytest` from the root runs every member's tests. Test file
# basenames are unique across the workspace; pytest refuses a duplicate at
# collection, so a clash fails loudly instead of hiding a module.
testpaths = ["tests", "packages"]
addopts = ["--strict-markers"]

# One lint configuration for every member. Ruff's default rule set for now;
# widening it is one change here that applies to the whole workspace.
[tool.ruff]
target-version = "py311"
# packages/agent-evidence-observer brings its own checks; its interop experiments are frozen
# with recorded file digests. Row CONS-ORG-OBSERVER-RUFF holds the rest.
extend-exclude = ["packages/*/vectors-*/cases", "packages/agent-evidence-observer"]

[tool.ruff.lint.per-file-ignores]
# A resource directory read with importlib.resources, not an importable module;
# its hyphenated name is part of the published layout.
"packages/probity-verify/examples/source-coverage/__init__.py" = ["N999"]
