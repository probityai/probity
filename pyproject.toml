# Workspace root. It is not a package: each member under packages/ declares its
# own distribution, version, licence and release tag. uv resolves every member
# together into the one uv.lock beside this file.

[tool.uv.workspace]
members = ["packages/*"]
# packages/observer keeps its own lock: its Python floor (3.12) would bind
# every member of this workspace. scripts/workspace.py still reads it.
exclude = ["packages/observer"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff==0.17.0"]

[tool.pytest.ini_options]
# `uv run python -m pytest` from the root runs every member's tests. Test file
# basenames are unique across the workspace; pytest refuses a duplicate at
# collection, so a clash fails loudly instead of hiding a module.
testpaths = ["tests", "packages"]
addopts = ["--strict-markers"]

# One lint configuration for every member. Ruff's default rule set for now;
# widening it is one change here that applies to the whole workspace.
[tool.ruff]
target-version = "py311"
# packages/observer brings its own checks; its interop experiments are frozen
# with recorded file digests. Row CONS-ORG-OBSERVER-RUFF holds the rest.
extend-exclude = ["packages/*/vectors-*/cases", "packages/observer"]

[tool.ruff.lint.per-file-ignores]
# A resource directory read with importlib.resources, not an importable module;
# its hyphenated name is part of the published layout.
"packages/probity-verify/examples/source-coverage/__init__.py" = ["N999"]
