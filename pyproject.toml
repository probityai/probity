[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-verify"
version = "0.1.1"
description = "Check claims against pinned evidence offline, with replayable decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["cryptography>=50.0.2,<51"]
keywords = ["ai-agents", "evidence-verification", "provenance", "offline", "audit"]

[project.urls]
Documentation = "https://github.com/probityai/probity-verify/blob/main/docs/install.md"
Source = "https://github.com/probityai/probity-verify"
Issues = "https://github.com/probityai/probity-verify/issues"
"Agent guide" = "https://github.com/probityai/probity-verify/blob/main/llms.txt"

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
a2a = ["a2a-sdk[http-server]==1.2.1", "uvicorn==0.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "vectors-source-coverage/tests", "vectors-operand-lineage/tests"]

[project.scripts]
probity-verify = "probity_verify.cli:main"
probity-bundle = "probity_verify.bundle:main"
probity-index = "probity_verify.index:main"
probity-a2a = "probity_verify.a2a_server:main"
probity-a2a-client = "probity_verify.a2a_client:main"

[tool.setuptools]
include-package-data = false
packages = ["probity_verify", "probity_verify.adapters", "probity_verify.samples"]
package-dir = {"" = "src", "probity_verify.samples" = "examples/source-coverage"}

[tool.setuptools.package-data]
"probity_verify.samples" = ["*.json", "*.html", "*.txt"]
