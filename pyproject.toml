# Workspace root. It is not a package: each member under packages/ declares its
# own distribution, version, licence and release tag. uv resolves every member
# together into the one uv.lock beside this file.
#
# Every member publishes the same Python floor, 3.12, which is the lock's floor, so the lock is an exact
# proof for every wheel we publish. harnesses/ holds no distribution and is not a member.

[tool.uv.workspace]
members = ["packages/*"]
# packages/probity-effects is not a member of the one lock: its tests install the agent frameworks its adapters
# drive (LangGraph first), and their dependency trees would bind every member's resolution. It keeps its own lock.
exclude = ["packages/probity-effects"]

[tool.uv.sources]
# Members that depend on each other resolve to the tree beside them, so every change is tested against
# the versions it ships with.
agent-evidence-verify = { workspace = true }
probity-ratchet-cases = { workspace = true }
[tool.uv]
package = false
# Two Inspect pins cannot share one environment: the historical profiles keep the release they were
# qualified on, the inspect extra follows the current one.
conflicts = [[{ package = "agent-evidence-observer", extra = "inspect" }, { package = "agent-evidence-observer", extra = "inspect-historical" }]]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "hypothesis>=6.170.14,<7", "ruff==0.17.3"]

[tool.pytest.ini_options]
# `uv run python -m pytest` from the root runs every member's tests. Test file
# basenames are unique across the workspace; pytest refuses a duplicate at
# collection, so a clash fails loudly instead of hiding a module.
testpaths = ["tests", "packages"]
addopts = ["--strict-markers"]

# One lint configuration for every member. Ruff's default rule set for now;
# widening it is one change here that applies to the whole workspace.
[tool.ruff]
target-version = "py312"
# packages/agent-evidence-observer brings its own checks; its interop experiments are frozen
# with recorded file digests. Row CONS-ORG-OBSERVER-RUFF holds the rest.
# A retained capture is evidence frozen by recorded digests; its sources are kept byte for byte.
extend-exclude = ["packages/*/vectors-*/cases", "packages/agent-evidence-observer",
                  "packages/*/examples/*/retained"]

[tool.ruff.lint.per-file-ignores]
# A resource directory read with importlib.resources, not an importable module;
# its hyphenated name is part of the published layout.
"packages/agent-evidence-verify/examples/source-coverage/__init__.py" = ["N999"]
