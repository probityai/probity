# Workspace root. It is not a package: each member under packages/ declares its
# own distribution, version, licence and release tag. uv resolves every member
# together into the one uv.lock beside this file.
#
# The lock's Python floor is the strictest member's (3.12, agent-evidence-observer and probity-ratchet).
# A member whose published floor is lower (probity-ratchet-cases 3.10; probity-verify, probityai,
# agent-evidence-mcp and evaluator-replay-kit 3.11) proves that floor in CI by installing its built wheel
# on that Python. harnesses/ holds no distribution and is not a member.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Members that depend on each other resolve to the tree beside them, so every change is tested against
# the versions it ships with.
probity-verify = { workspace = true }
probity-ratchet-cases = { workspace = true }
# probity-ratchet's bench extra: benchmarks that are not on PyPI under their own names.
tau-bench = { git = "https://github.com/sierra-research/tau-bench", rev = "59a200c6d575d595120f1cb70fea53cef0632f6b" }
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699" }
tool-sandbox = { git = "https://github.com/apple/ToolSandbox", rev = "c8571d7854316d2e1c5f288e59fe1e34e53f6dd1" }

[tool.uv]
package = false
# Bench overrides for probity-ratchet's bench extra. They sit at the workspace root because uv reads
# overrides, dependency metadata and sources only there; each names a package only that extra pulls in.
# tau2-bench caps litellm below 1.82.7 only to keep out the two compromised PyPI releases (1.82.7, 1.82.8;
# tau2-bench commit e40aba6). The bench extra already pins litellm 1.106.4, a later clean release.
# litellm (every release through 1.106.4) declares filelock<4.0, which keeps filelock on 3.x and three open
# advisories. litellm calls only FileLock(path, timeout=, mode=) in its proxy CLI, an interface filelock 4.x
# keeps, and filelock 4.0 changed only SoftReadWriteLock, which litellm does not use. The override lifts the
# cap here; drop it once litellm lifts the cap upstream (BerriAI/litellm#48394, still open).
override-dependencies = ["litellm==1.106.6", "filelock>=4.2.1"]

[[tool.uv.dependency-metadata]]
# The tool-sandbox package pins every dependency exactly (pydantic 2.7.4 conflicts with raindrop-ai, which needs
# pydantic>=2.9; numpy 1.26.4 and openai 1.17.0 conflict with the versions already locked) and declares
# clients for model providers the adapter never imports. This is the metadata for the modules that
# `ratchet.bench.toolsandbox` loads: the conflicting pins are relaxed, and polars stays at 0.20.31 because
# tool-sandbox imports `polars.type_aliases`, which later polars releases removed. pint is unpinned because
# 0.23 calls `numpy.cumproduct`, which numpy 2 removed.
# geopy is raised from 2.4.1 to 2.5.0, the first release that fixes the ReDoS in geopy.Point.
name = "tool-sandbox"
version = "0.0.1"
requires-dist = [
    "attrs",
    "ccy==1.3.1",
    "decorator==5.1.1",
    "dill==0.3.8",
    "geopy>=2.5.0",
    "holidays==0.51",
    "jsonschema",
    "langchain-core",
    "networkx==3.2.1",
    "numpy",
    "openai",
    "phonenumbers==8.13.39",
    "pint",
    "polars==0.20.31",
    "pydantic",
    "pyyaml",
    "rapidfuzz",
    "requests",
    "rouge-score==0.1.2",
    "scipy",
    "strenum==0.4.15",
    "tenacity",
    "tqdm",
    "typing-extensions",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "hypothesis>=6.170.13,<7", "ruff==0.17.3"]

[tool.pytest.ini_options]
# `uv run python -m pytest` from the root runs every member's tests. Test file
# basenames are unique across the workspace; pytest refuses a duplicate at
# collection, so a clash fails loudly instead of hiding a module.
testpaths = ["tests", "packages"]
addopts = ["--strict-markers"]

# One lint configuration for every member. Ruff's default rule set for now;
# widening it is one change here that applies to the whole workspace.
[tool.ruff]
target-version = "py312"
# packages/agent-evidence-observer brings its own checks; its interop experiments are frozen
# with recorded file digests. Row CONS-ORG-OBSERVER-RUFF holds the rest.
extend-exclude = ["packages/*/vectors-*/cases", "packages/agent-evidence-observer"]

[tool.ruff.lint.per-file-ignores]
# A resource directory read with importlib.resources, not an importable module;
# its hyphenated name is part of the published layout.
"packages/probity-verify/examples/source-coverage/__init__.py" = ["N999"]
