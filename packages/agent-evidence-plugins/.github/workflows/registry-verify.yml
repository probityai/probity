name: registry-verify

# Compares what this repository declares (its manifests and the family lock in
# version-pins.toml) with what its tags and the registries hold, after every
# release run and once a day. It fails when a manifest was bumped and never
# released, when a tag exists and the registry lacks it, when a registry holds a
# version the source does not, when a package was published from another
# repository, or when the family lock lags a release. Each line says which, and
# the last line says N of M.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: manifests, tags and registries agree
        uses: probityai/.github/actions/version-pins@ecb47052aa3ae8188c74f3cdc31eb8f4e9402811 # main
        with:
          command: registry
