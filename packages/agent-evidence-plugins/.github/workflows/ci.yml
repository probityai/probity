name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned verifier and the test runner
        run: python -m pip install "probity-verify==0.3.0" "pytest>=8,<10"
      - name: Tests
        run: python -m pytest -q
      - name: README shape
        run: python -B scripts/readme-lint.py README.md
      - name: Every version a page names equals its manifest or the family lock
        uses: probityai/.github/actions/version-pins@ecb47052aa3ae8188c74f3cdc31eb8f4e9402811 # main
        with:
          command: check
      - name: A planted stale pin turns the version check red
        uses: probityai/.github/actions/version-pins@ecb47052aa3ae8188c74f3cdc31eb8f4e9402811 # main
        with:
          command: test
