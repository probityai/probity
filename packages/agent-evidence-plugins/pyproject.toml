[project]
name = "agent-evidence-plugins"
version = "0.1.0"
description = "Claude Code and Cursor plugins that replay an agent-evidence verdict bundle and fail on a bad one"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "probity-verify==0.2.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
