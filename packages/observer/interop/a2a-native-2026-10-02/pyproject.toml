[project]
name = "probity-a2a-native-reference"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["a2a-sdk[http-server]==1.2.1", "uvicorn==0.42.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["a2a_contract", "a2a_demo", "a2a_verify", "server"]

[tool.pytest.ini_options]
pythonpath = [".", "../evaluation-contract-2026-10-01"]
testpaths = ["tests"]
