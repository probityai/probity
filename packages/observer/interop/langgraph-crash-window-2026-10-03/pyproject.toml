[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-langgraph-crash-window-reader"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["probity-joint-recovery-reader==0.0.2"]
description = "Offline selected native effect/checkpoint crash-window reconstruction"

[project.scripts]
probity-read-langgraph-crash-window = "crash_reader:main"

[tool.setuptools]
py-modules = ["crash_common", "crash_reader"]
