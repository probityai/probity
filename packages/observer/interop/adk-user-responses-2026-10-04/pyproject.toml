[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-adk-user-responses"
version = "0.0.1"
description = "Finite installed ADK user-response routing and effect reference"
requires-python = ">=3.12"
dependencies = ["agent-evidence-observer==0.0.1"]

[project.scripts]
probity-adk-responses-produce = "probity_adk_responses.producer:main"
probity-adk-responses-read = "probity_adk_responses.reader:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["probity_adk_responses*"]

[tool.setuptools.package-data]
probity_adk_responses = ["*.json"]
