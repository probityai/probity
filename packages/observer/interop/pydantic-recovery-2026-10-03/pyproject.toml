[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-pydantic-recovery-reader"
version = "0.0.1"
description = "Framework-free reader of finite native deferred-tool recovery records"
requires-python = ">=3.12"
dependencies = ["agent-evidence-observer==0.0.1"]

[project.scripts]
probity-read-pydantic-recovery = "probity_pydantic_recovery.reader:main"

[tool.setuptools]
packages = ["probity_pydantic_recovery"]
