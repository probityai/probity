[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-witness-operator-reference"
version = "0.0.1"
description = "Installed local witness operator and public-key-only client"
requires-python = ">=3.12"
dependencies = ["agent-evidence-observer==0.0.1"]

[project.scripts]
agent-evidence-witness = "probity_witness_operator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["probity_witness_operator*"]
