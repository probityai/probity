[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-authority-reference"
version = "0.0.1"
description = "Reference authority-at-dispatch and durable effect comparison"
requires-python = ">=3.12"

[tool.setuptools]
py-modules = ["authority_profile", "implementation_records", "producer", "reader", "source_discriminator"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
