[project]
name = "probity-local-model-reference"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["inspect-ai==0.3.273", "llama-cpp-python==0.3.16"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["local_model"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
