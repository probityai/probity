[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-observer"
version = "0.0.2"
description = "Record brokered agent writes and check selected native reports offline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Sankalp Gilda"}]
keywords = ["ai-agents", "observability", "audit-logs", "provenance", "attestation"]
requires-python = ">=3.12"
dependencies = ["cryptography>=46,<51", "rfc8785==0.1.4"]

[project.urls]
Documentation = "https://github.com/probityai/agent-evidence-observer/blob/main/docs/INSTALLATION.md"
Source = "https://github.com/probityai/agent-evidence-observer"
Issues = "https://github.com/probityai/agent-evidence-observer/issues"
"Agent guide" = "https://github.com/probityai/agent-evidence-observer/blob/main/llms.txt"

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "jsonschema>=4,<5"]
inspect = ["inspect-ai==0.3.273"]
witness = ["probityai @ git+https://github.com/probityai/jcs-admit@58a48b2f33b55cafb72de9f187f0fa53eed74d95#subdirectory=python"]
cover = ["coverage>=7.10,<8"]
done = [
    "probityai @ git+https://github.com/probityai/jcs-admit@58a48b2f33b55cafb72de9f187f0fa53eed74d95#subdirectory=python",
    "probity-verify @ git+https://github.com/probityai/probity-verify@adb2201356260931a75322d541c11fb311e24d3f",
]

[project.scripts]
agent-evidence-observer = "probity_observer.cli:main"
agent-evidence-admit = "probity_observer.admission:main"
agent-evidence-read-native = "probity_observer.native_reader:main"
agent-evidence-read-atomic = "probity_observer.atomic_reader:main"
agent-evidence-read-refund-handoff = "probity_observer.refund_handoff:main"
agent-evidence-witness = "probity_observer.witness.cli:main"
probity-done = "probity_observer.done.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"probity_observer.done" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
