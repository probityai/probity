[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-observer"
version = "0.0.1"
description = "Record brokered agent writes and check selected native reports offline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Sankalp Gilda"}]
keywords = ["ai-agents", "observability", "audit-logs", "provenance", "attestation"]
requires-python = ">=3.12"
dependencies = ["cryptography>=46,<47"]

[project.urls]
Documentation = "https://github.com/probityai/agent-evidence-observer/blob/main/docs/INSTALLATION.md"
Source = "https://github.com/probityai/agent-evidence-observer"
Issues = "https://github.com/probityai/agent-evidence-observer/issues"
"Agent guide" = "https://github.com/probityai/agent-evidence-observer/blob/main/llms.txt"

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
inspect = ["inspect-ai==0.3.273"]
aae = ["rfc8785==0.1.4"]

[project.scripts]
agent-evidence-observer = "probity_observer.cli:main"
agent-evidence-admit = "probity_observer.admission:main"
agent-evidence-read-native = "probity_observer.native_reader:main"
agent-evidence-read-atomic = "probity_observer.atomic_reader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
