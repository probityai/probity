[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-observer"
version = "0.0.1"
description = "Prototype broker and witnessed history for bounded agent effects"
requires-python = ">=3.12"
dependencies = ["cryptography>=46,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]

[project.scripts]
agent-evidence-observer = "probity_observer.cli:main"
agent-evidence-admit = "probity_observer.admission:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
