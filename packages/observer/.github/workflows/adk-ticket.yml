name: Google ADK native plugin and protected ticket

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/adk-ticket-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/adk-ticket.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/adk-ticket-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/adk-ticket.yml'

permissions:
  contents: read

jobs:
  native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/adk-ticket-2026-10-02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/agent-evidence-observer
          ref: 4a50e61471355611121a578f3a4c22daa931d419
          path: selected-observer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-selected producer and build source-proven wheels
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip wheel --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-observer" . --wheel-dir "$RUNNER_TEMP/adk-wheels"
          python verify_wheels.py "$RUNNER_TEMP/adk-wheels" --selection source-selection.json > installed-source-proof.json
          python -m pip install --no-deps "$RUNNER_TEMP/adk-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/adk-wheels/probity_adk_reference-0.0.1-py3-none-any.whl"
      - name: Execute SDK lifecycle and semantic refusal controls
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=test-results.xml
          ruff check --select E,F,I,C901 --config 'lint.mccabe.max-complexity=5' src tests verify_wheels.py
      - name: Execute fresh native SDK and protected HTTP population
        run: |
          set -euo pipefail
          packet="$GITHUB_WORKSPACE/interop/adk-ticket-2026-10-02/fresh-run/packet"
          test ! -e "$packet"
          mkdir -p fresh-run
          cd "$RUNNER_TEMP"
          probity-adk-run "$packet" --source-revision "$GITHUB_SHA" > "$GITHUB_WORKSPACE/interop/adk-ticket-2026-10-02/fresh-run/producer-stdout.json"
      - name: Install a separate reader without the ADK or MCP framework
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/adk-reader"
          "$RUNNER_TEMP/adk-reader/bin/python" -m pip install --require-hashes -r requirements-reader.lock
          "$RUNNER_TEMP/adk-reader/bin/python" -m pip install --no-deps "$RUNNER_TEMP/adk-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/adk-wheels/probity_adk_reference-0.0.1-py3-none-any.whl"
          "$RUNNER_TEMP/adk-reader/bin/python" -c "import importlib.util; assert importlib.util.find_spec('google') is None and importlib.util.find_spec('mcp') is None"
      - name: Replay with separately supplied demonstration pins
        run: |
          set -euo pipefail
          cp fresh-run/packet/consumer-pins.json "$RUNNER_TEMP/adk-selected-pins.json"
          "$RUNNER_TEMP/adk-reader/bin/probity-adk-read" fresh-run/packet --pins-file "$RUNNER_TEMP/adk-selected-pins.json" > fresh-run/reader-stdout.json
          python -c "import json; from pathlib import Path; r=Path('fresh-run'); a=json.loads((r/'producer-stdout.json').read_bytes()); b=json.loads((r/'reader-stdout.json').read_bytes()); c=json.loads((r/'packet/report.json').read_bytes()); assert a==b==c and b['status']=='verified' and b['plannedAttempts']==12"
      - name: Run the installed host publication gate with frozen demonstration policy
        run: |
          set -euo pipefail
          policy_sha="$(sha256sum "$RUNNER_TEMP/adk-selected-pins.json" | cut -d ' ' -f 1)"
          "$RUNNER_TEMP/adk-reader/bin/probity-adk-gate" fresh-run/packet --reader "$RUNNER_TEMP/adk-reader/bin/probity-adk-read" --policy "$RUNNER_TEMP/adk-selected-pins.json" --policy-sha256 "$policy_sha" --output fresh-run/gate-receipt > fresh-run/gate-stdout.json
      - name: Retain original source, plan, SDK exports and reader receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adk-native-ticket
          path: |
            interop/adk-ticket-2026-10-02/fresh-run/
            interop/adk-ticket-2026-10-02/installed-source-proof.json
            interop/adk-ticket-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
