name: Consumer publication gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/consumer-host-2026-10-02/**'
      - 'interop/framework-consumer-2026-10-02/**'
      - '.github/workflows/consumer-host-gate.yml'
  push:
    branches: [main]
    paths:
      - 'interop/consumer-host-2026-10-02/**'
      - 'interop/framework-consumer-2026-10-02/**'
      - '.github/workflows/consumer-host-gate.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b5b6328bf70fef0fa17e86e62c6163c5943b13f
          path: historical-reader-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55c3921cf299407176f2121083c7f39aff12165f
          path: durable-reader-source
          persist-credentials: false
      - name: Install hash-selected reader and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock
      - name: Build and normally install the selected wheels
        run: |
          bash interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-BUILD-2026-10-02.sh "$GITHUB_WORKSPACE/historical-reader-source" "$RUNNER_TEMP/framework-wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP/framework-wheels/"*.whl
          python -m pip check
      - name: Verify the actual historical baseline before upgrading
        run: |
          python -m pip install pytest==8.4.2
          python interop/framework-consumer-2026-10-02/check_historical_reader_baseline.py "$RUNNER_TEMP/historical-baseline.json"
          python -m pytest -q interop/framework-consumer-2026-10-02/test_installed_readers.py interop/consumer-host-2026-10-02/test_framework_gate.py --junitxml=historical-baseline-tests.xml
      - name: Build the frozen durable candidate and normally upgrade the reader
        run: |
          bash interop/framework-consumer-2026-10-02/FRAMEWORK-DURABLE-CONSUMER-BUILD-2026-10-02.sh "$GITHUB_WORKSPACE/durable-reader-source" "$RUNNER_TEMP/durable-reader-wheels"
          python -m pip install --no-index --no-deps --upgrade "$RUNNER_TEMP/durable-reader-wheels/"*.whl
          python -m pip check
      - name: Exercise installed commands and semantic refusals
        run: |
          python -m pip install pytest==8.4.2 ruff==0.15.6
          python -m ruff check interop/consumer-host-2026-10-02/*.py
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' interop/consumer-host-2026-10-02/*.py
          FRAMEWORK_DURABLE_SELECTED_SOURCE="$GITHUB_WORKSPACE/durable-reader-source" python -m pytest -q interop/consumer-host-2026-10-02/test_framework_gate.py interop/consumer-host-2026-10-02/test_durable_framework_gate.py interop/framework-consumer-2026-10-02/test_installed_readers.py interop/framework-consumer-2026-10-02/test_durable_installed_reader.py --junitxml=consumer-gate-tests.xml
      - name: Retain installation and control results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-publication-gate
          path: |
            ${{ runner.temp }}/framework-wheels/build-record.json
            ${{ runner.temp }}/durable-reader-wheels/build-record.json
            ${{ runner.temp }}/historical-baseline.json
            historical-baseline-tests.xml
            consumer-gate-tests.xml
          if-no-files-found: error
          retention-days: 90
