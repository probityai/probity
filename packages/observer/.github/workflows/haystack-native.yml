name: Native Haystack installed publication consumer

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 0'
  push:
    branches: [main]
    paths: ['interop/haystack-native-2026-10-03/**', '.github/workflows/haystack-native.yml']
  pull_request:
    branches: [main]
    paths: ['interop/haystack-native-2026-10-03/**', '.github/workflows/haystack-native.yml']

permissions:
  contents: read

jobs:
  native-haystack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned verification runner
        run: python -m pip install 'uv==0.8.22'
      - name: Build installed consumers and check native fault controls
        run: bash interop/haystack-native-2026-10-03/verify_install.sh "$RUNNER_TEMP/haystack-native"
      - name: Retain actual native bytes, selected installed source and publication decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haystack-native-installed-consumer
          path: |
            ${{ runner.temp }}/haystack-native/packet/
            ${{ runner.temp }}/haystack-native/wheels/
            ${{ runner.temp }}/haystack-native/native-tests.xml
            ${{ runner.temp }}/haystack-native/*-report.json
            ${{ runner.temp }}/haystack-native/*-install.txt
            ${{ runner.temp }}/haystack-native/publication/
            ${{ runner.temp }}/haystack-native/frozen-source-sha.txt
          if-no-files-found: error
          retention-days: 90
