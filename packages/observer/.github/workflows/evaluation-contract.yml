name: Five-tier evaluation contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: interop/evaluation-contract-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install standalone test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install pinned native mock harness and Observer adapter
        run: python -m pip install -e '../..[inspect]'
      - name: Check declared populations and mutation controls
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Retain five-tier synthetic contract exercise
        run: python demo.py contract-run
      - name: Retain native Inspect mock logs and their common mapping
        run: python inspect_demo.py native-contract-run
      - name: Retain native tool, agent and local workload execution
        run: python inspect_execution.py native-execution-run
      - name: Join native Inspect calls to selected AAE authority and ticket effects
        run: python inspect_ticket.py native-ticket-run --source-revision "$GITHUB_SHA"
      - name: Reconstruct the joined packet without framework or HTTP calls
        run: |
          cp native-ticket-run/consumer-pins.json "$RUNNER_TEMP/inspect-ticket-selected-pins.json"
          python inspect_ticket.py native-ticket-run --verify --pins-file "$RUNNER_TEMP/inspect-ticket-selected-pins.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: five-tier-contract-reference
          path: |
            interop/evaluation-contract-2026-10-01/contract-run/
            interop/evaluation-contract-2026-10-01/native-contract-run/
            interop/evaluation-contract-2026-10-01/native-execution-run/
            interop/evaluation-contract-2026-10-01/native-ticket-run/
            interop/evaluation-contract-2026-10-01/test-results.xml
          if-no-files-found: error
