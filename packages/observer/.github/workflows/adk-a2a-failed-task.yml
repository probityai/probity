name: Native ADK A2A failed-task installed consumer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['interop/adk-a2a-failed-task-2026-10-03/**', '.github/workflows/adk-a2a-failed-task.yml', 'pyproject.toml']
  pull_request:
    branches: [main]
    paths: ['interop/adk-a2a-failed-task-2026-10-03/**', '.github/workflows/adk-a2a-failed-task.yml', 'pyproject.toml']

permissions:
  contents: read

jobs:
  native-adk-a2a-failed-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable baseline native SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: google/adk-python
          ref: 63aed55113d4fe78245d3d6667b6e87569888bf5
          path: vendor-adk-baseline
          persist-credentials: false
      - name: Check out immutable proposed failure fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ferponse/adk-python
          ref: 23d253f2587ac090412394fe1a71ef5694fe2eda
          path: vendor-adk-proposed-fix
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install selected verification runner
        run: python -m pip install 'uv==0.8.22'
      - name: Build installed producers and framework-free reader
        run: bash interop/adk-a2a-failed-task-2026-10-03/verify_install.sh "$RUNNER_TEMP/adk-a2a-failed-task" "$GITHUB_WORKSPACE/vendor-adk-baseline" "$GITHUB_WORKSPACE/vendor-adk-proposed-fix"
      - name: Retain native effects, transport and installed reader results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adk-a2a-failed-task-installed-consumer
          path: |
            ${{ runner.temp }}/adk-a2a-failed-task/native-*/
            ${{ runner.temp }}/adk-a2a-failed-task/*-publication/
            ${{ runner.temp }}/adk-a2a-failed-task/wheels/
            ${{ runner.temp }}/adk-a2a-failed-task/*-sdk-wheel/
            ${{ runner.temp }}/adk-a2a-failed-task/*-tests.xml
            ${{ runner.temp }}/adk-a2a-failed-task/*-report.json
            ${{ runner.temp }}/adk-a2a-failed-task/*-install.txt
            ${{ runner.temp }}/adk-a2a-failed-task/*.lock
            ${{ runner.temp }}/adk-a2a-failed-task/*-source-sha.txt
            ${{ runner.temp }}/adk-a2a-failed-task/*-runtime.txt
          if-no-files-found: error
          retention-days: 90
