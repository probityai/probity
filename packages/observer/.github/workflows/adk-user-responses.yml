name: ADK user FunctionResponse routing and effects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['interop/adk-user-responses-2026-10-04/**', '.github/workflows/adk-user-responses.yml']
  pull_request:
    branches: [main]
    paths: ['interop/adk-user-responses-2026-10-04/**', '.github/workflows/adk-user-responses.yml']

permissions:
  contents: read

jobs:
  installed-native-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: google/adk-python
          ref: 86a47f6974bae349a5c9ea15a74a4b450614ae42
          path: selected-adk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: probityai/agent-evidence-observer
          ref: 8c074d7b8f380dd01fd55277b68a37ad8217c8cb
          path: selected-observer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: probityai/probity-verify
          ref: e835ce2bd6a960e7a1cc2fa6522f16d55dce728a
          path: selected-verify
          persist-credentials: false
      - name: Build wheels and normally install the exact SDK into the producer
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-user-responses-2026-10-04"
          python -m venv "$RUNNER_TEMP/adk-responses-producer"
          "$RUNNER_TEMP/adk-responses-producer/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements.lock" -r "$profile/build.lock"
          "$RUNNER_TEMP/adk-responses-producer/bin/python" -m pip wheel --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-observer" "$profile" --wheel-dir "$RUNNER_TEMP/adk-responses-wheels"
          "$RUNNER_TEMP/adk-responses-producer/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/adk-responses-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/adk-responses-wheels/probity_adk_user_responses-0.0.1-py3-none-any.whl"
          "$RUNNER_TEMP/adk-responses-producer/bin/python" -m pip install --no-compile --no-deps --no-build-isolation --force-reinstall "$GITHUB_WORKSPACE/selected-adk"
          "$RUNNER_TEMP/adk-responses-producer/bin/python" -m pip check
          python -m venv "$RUNNER_TEMP/adk-responses-reader"
          "$RUNNER_TEMP/adk-responses-reader/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements-reader.lock"
          "$RUNNER_TEMP/adk-responses-reader/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/adk-responses-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/adk-responses-wheels/probity_adk_user_responses-0.0.1-py3-none-any.whl"
          "$RUNNER_TEMP/adk-responses-reader/bin/python" -m pip check
      - name: Run three actual native cases then the isolated offline reader twice
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-user-responses-2026-10-04"
          python -I -B "$profile/bootstrap.py" --producer "$RUNNER_TEMP/adk-responses-producer/bin/python" --reader "$RUNNER_TEMP/adk-responses-reader/bin/python" --wheels "$RUNNER_TEMP/adk-responses-wheels" --sdk "$GITHUB_WORKSPACE/selected-adk" --output "$profile/actual-run"
      - name: Refuse semantic mutations even after their artifact hashes are reselected
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-user-responses-2026-10-04"
          ADK_RESPONSES_PACKET="$profile/actual-run/packet" "$RUNNER_TEMP/adk-responses-reader/bin/python" -I -B "$profile/test_controls.py" -v 2>&1 | tee "$profile/actual-run/reader-controls.log"
      - name: Install Verify and consume the six retained routing turns twice
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-user-responses-2026-10-04"
          "$RUNNER_TEMP/adk-responses-producer/bin/python" -m pip wheel --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-verify" --wheel-dir "$RUNNER_TEMP/adk-verify-wheels"
          "$RUNNER_TEMP/adk-responses-reader/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/adk-verify-wheels/probity_verify-0.1.0-py3-none-any.whl"
          "$RUNNER_TEMP/adk-responses-reader/bin/python" -m pip check
          policy_sha="$(sha256sum "$profile/actual-run/host-policy.json" | cut -d ' ' -f 1)"
          python -I -B "$profile/verify_consumer.py" --reader "$RUNNER_TEMP/adk-responses-reader/bin/python" --source "$GITHUB_WORKSPACE/selected-verify" --wheel "$RUNNER_TEMP/adk-verify-wheels/probity_verify-0.1.0-py3-none-any.whl" --packet "$profile/actual-run/packet" --policy "$profile/actual-run/host-policy.json" --policy-sha256 "$policy_sha" --output "$profile/actual-run/verify-consumer"
      - name: Retain installed source, raw callbacks, effects and original child receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adk-user-response-native-evidence
          path: |
            interop/adk-user-responses-2026-10-04/actual-run/
          if-no-files-found: error
          retention-days: 90
