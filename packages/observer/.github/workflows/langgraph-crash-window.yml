name: Native LangGraph effect checkpoint crash window
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/langgraph-crash-window-2026-10-03/**'
      - 'interop/joint-recovery-2026-10-02/**'
      - 'interop/langgraph-recovery-authority-2026-10-02/**'
      - 'interop/langgraph-ticket-2026-10-02/**'
      - 'interop/target-recovery-2026-10-02/**'
      - 'src/probity_observer/**'
      - '.github/workflows/langgraph-crash-window.yml'
  push:
    branches: [main]
    paths:
      - 'interop/langgraph-crash-window-2026-10-03/**'
      - 'interop/joint-recovery-2026-10-02/**'
      - 'interop/langgraph-recovery-authority-2026-10-02/**'
      - 'interop/langgraph-ticket-2026-10-02/**'
      - 'interop/target-recovery-2026-10-02/**'
      - 'src/probity_observer/**'
      - '.github/workflows/langgraph-crash-window.yml'
permissions:
  contents: read
jobs:
  native-and-installed-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/langgraph-crash-window-2026-10-03
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-selected native profile and exact Observer source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../joint-recovery-2026-10-02/requirements.lock --report install-report.json
          python -m pip install --no-deps -e ../..
      - name: Verify native reconstruction and meaningful semantic refusals
        run: |
          python -m ruff check crash_*.py consume_installed.py tests
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' crash_*.py consume_installed.py tests
          python -m pytest -q --junitxml=test-results.xml
      - name: Execute all four actual crash and recovery cases
        run: timeout --signal=TERM --kill-after=5s 180s python crash_run.py fresh-run --source-revision "$GITHUB_SHA" > fresh-report.json
      - name: Build normal framework-free reader wheels and environment
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir reader-wheels ../.. ../joint-recovery-2026-10-02 .
          sha256sum reader-wheels/*.whl > reader-wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/crash-window-reader"
          "$RUNNER_TEMP/crash-window-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r ../joint-recovery-2026-10-02/requirements-reader.lock --report reader-install-report.json
          "$RUNNER_TEMP/crash-window-reader/bin/python" -m pip install --no-deps reader-wheels/*.whl
          "$RUNNER_TEMP/crash-window-reader/bin/python" -m pip check
          "$RUNNER_TEMP/crash-window-reader/bin/python" -I -c 'import importlib.util; assert importlib.util.find_spec("langgraph") is None'
      - name: Select host installation and pins and replay through isolated reader
        run: |
          cp fresh-run/consumer-pins.json "$RUNNER_TEMP/crash-window-selected-pins.json"
          PYTHONPATH=../joint-recovery-2026-10-02 python - "$RUNNER_TEMP/crash-window-reader/bin/probity-read-langgraph-crash-window" "$RUNNER_TEMP/crash-window-selected-closure.json" <<'PY'
          import sys
          from pathlib import Path
          from joint_host_gate import reader_closure
          from probity_observer.crypto import canonical
          reader, output = map(Path, sys.argv[1:])
          output.write_bytes(canonical(reader_closure(reader)))
          PY
          python consume_installed.py fresh-run --pins-file "$RUNNER_TEMP/crash-window-selected-pins.json" --reader "$RUNNER_TEMP/crash-window-reader/bin/probity-read-langgraph-crash-window" --selected-closure "$RUNNER_TEMP/crash-window-selected-closure.json" --output consumer-receipts > installed-report.json
          python -c 'import json; assert json.load(open("fresh-report.json")) == json.load(open("installed-report.json"))'
      - name: Retain complete native originals and installed consumer receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: langgraph-crash-window-${{ github.sha }}
          path: |
            interop/langgraph-crash-window-2026-10-03/fresh-run/
            interop/langgraph-crash-window-2026-10-03/fresh-report.json
            interop/langgraph-crash-window-2026-10-03/consumer-receipts/
            interop/langgraph-crash-window-2026-10-03/installed-report.json
            interop/langgraph-crash-window-2026-10-03/reader-wheels/
            interop/langgraph-crash-window-2026-10-03/reader-wheels-sha256.txt
            interop/langgraph-crash-window-2026-10-03/install-report.json
            interop/langgraph-crash-window-2026-10-03/reader-install-report.json
            interop/langgraph-crash-window-2026-10-03/test-results.xml
          if-no-files-found: error
          retention-days: 90
