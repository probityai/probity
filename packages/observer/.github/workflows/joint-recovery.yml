name: Joint process and current-authority recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/joint-recovery-2026-10-02/**'
      - 'interop/langgraph-recovery-authority-2026-10-02/**'
      - 'interop/langgraph-ticket-2026-10-02/**'
      - 'interop/target-recovery-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/joint-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'interop/joint-recovery-2026-10-02/**'
      - 'interop/langgraph-recovery-authority-2026-10-02/**'
      - 'interop/langgraph-ticket-2026-10-02/**'
      - 'interop/target-recovery-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/joint-recovery.yml'
permissions:
  contents: read
jobs:
  native-and-installed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/joint-recovery-2026-10-02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Select the immutable original reader sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7047248e5eb3d58804bd14de1c4e7c3d41ccffb2
          path: selected-reader-baseline
          persist-credentials: false
      - name: Install hash-selected native profile and exact Observer checkout
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check finite native recovery and semantic refusal controls
        run: |
          python -m ruff check joint_*.py joint_host_gate.py verify_upgrade.py tests
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' joint_*.py joint_host_gate.py verify_upgrade.py tests
          python -m pytest -q --junitxml=test-results.xml
      - name: Execute the complete actual joint native population
        run: timeout --signal=TERM --kill-after=5s 240s python joint_run.py fresh-run --source-revision "$GITHUB_SHA" > fresh-report.json
      - name: Normally upgrade the installed original reader and refuse stale selection
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-reader.lock --dest reader-dependency-wheels
          python verify_upgrade.py --baseline ../../selected-reader-baseline/interop/joint-recovery-2026-10-02 --packet fresh-run --output upgrade-receipts --dependency-wheels reader-dependency-wheels > upgrade-report.json
      - name: Build and normally install a separate framework-free reader
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheels ../.. .
          sha256sum wheels/*.whl > wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/joint-reader"
          "$RUNNER_TEMP/joint-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-reader.lock --report reader-install-report.json
          "$RUNNER_TEMP/joint-reader/bin/python" -m pip install --no-deps wheels/*.whl
          "$RUNNER_TEMP/joint-reader/bin/python" -m pip check
          "$RUNNER_TEMP/joint-reader/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("langgraph") is None'
      - name: Select host pins, installed reader and publication policy separately
        run: |
          cp fresh-run/consumer-pins.json "$RUNNER_TEMP/joint-selected-pins.json"
          python - "$RUNNER_TEMP/joint-selected-pins.json" "$RUNNER_TEMP/joint-host-policy.json" "$RUNNER_TEMP/joint-reader/bin/probity-read-joint-recovery" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from joint_host_gate import reader_closure
          pins, policy, reader = map(Path, sys.argv[1:])
          policy.write_text(json.dumps({'profile': 'probity-joint-process-authority-recovery-v1', 'pinsSha256': hashlib.sha256(pins.read_bytes()).hexdigest(), 'plannedAttempts': 19, 'readerSha256': hashlib.sha256(reader.read_bytes()).hexdigest(), 'readerClosure': reader_closure(reader)}, sort_keys=True, separators=(',', ':')))
          PY
          python joint_host_gate.py fresh-run --pins-file "$RUNNER_TEMP/joint-selected-pins.json" --policy-file "$RUNNER_TEMP/joint-host-policy.json" --policy-sha256 "$(sha256sum "$RUNNER_TEMP/joint-host-policy.json" | cut -d' ' -f1)" --reader "$RUNNER_TEMP/joint-reader/bin/probity-read-joint-recovery" --output host-receipts > host-decision.json
          python -c 'import json; assert json.load(open("fresh-report.json")) == json.load(open("host-receipts/reader.stdout"))'
      - name: Retain full native original and installed host receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-recovery-${{ github.sha }}
          path: |
            interop/joint-recovery-2026-10-02/fresh-run/
            interop/joint-recovery-2026-10-02/fresh-report.json
            interop/joint-recovery-2026-10-02/host-receipts/
            interop/joint-recovery-2026-10-02/host-decision.json
            interop/joint-recovery-2026-10-02/install-report.json
            interop/joint-recovery-2026-10-02/reader-install-report.json
            interop/joint-recovery-2026-10-02/wheels-sha256.txt
            interop/joint-recovery-2026-10-02/wheels/
            interop/joint-recovery-2026-10-02/test-results.xml
            interop/joint-recovery-2026-10-02/upgrade-report.json
            interop/joint-recovery-2026-10-02/upgrade-receipts/
            interop/joint-recovery-2026-10-02/reader-dependency-wheels/
          if-no-files-found: error
          retention-days: 90
