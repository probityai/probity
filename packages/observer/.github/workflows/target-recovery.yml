name: Protected target process recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/target-recovery-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/target-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'interop/target-recovery-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/target-recovery.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/target-recovery-2026-10-02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-selected native target, test and wheel tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report install-report.json
          python -m pip install --no-deps -e ../..
          python -m pip check
      - name: Check native lifecycle and semantic refusal controls
        run: |
          python -m ruff check target_common.py target_worker.py target_run.py target_reader.py host_gate.py tests
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' target_common.py target_worker.py target_run.py target_reader.py host_gate.py tests
          python -m pytest -q --junitxml=test-results.xml
      - name: Execute every native target process restart and crash case
        run: timeout --signal=TERM --kill-after=5s 120s python target_run.py fresh-run --source-revision "$GITHUB_SHA" > fresh-report.json
      - name: Build actual Observer and additive reader distributions
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheels ../.. .
          sha256sum wheels/*.whl > wheels-sha256.txt
          python -m venv "$RUNNER_TEMP/target-reader"
          "$RUNNER_TEMP/target-reader/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report reader-install-report.json
          "$RUNNER_TEMP/target-reader/bin/python" -m pip install --no-deps wheels/*.whl
          "$RUNNER_TEMP/target-reader/bin/python" -m pip check
      - name: Run separate installed reader under host-selected publication policy
        run: |
          cp fresh-run/consumer-pins.json "$RUNNER_TEMP/target-selected-pins.json"
          python - "$RUNNER_TEMP/target-selected-pins.json" "$RUNNER_TEMP/target-host-policy.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          pins = Path(sys.argv[1]).read_bytes()
          Path(sys.argv[2]).write_text(json.dumps({'profile': 'probity-target-process-recovery-v1', 'pinsSha256': hashlib.sha256(pins).hexdigest(), 'plannedAttempts': 7}))
          PY
          python host_gate.py fresh-run --pins-file "$RUNNER_TEMP/target-selected-pins.json" --policy-file "$RUNNER_TEMP/target-host-policy.json" --policy-sha256 "$(sha256sum "$RUNNER_TEMP/target-host-policy.json" | cut -d' ' -f1)" --reader "$RUNNER_TEMP/target-reader/bin/probity-read-target-recovery" --output host-receipts > host-decision.json
      - name: Retain complete public packet and separately installed reader receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: target-recovery-${{ github.sha }}
          path: |
            interop/target-recovery-2026-10-02/fresh-run/
            interop/target-recovery-2026-10-02/fresh-report.json
            interop/target-recovery-2026-10-02/host-receipts/
            interop/target-recovery-2026-10-02/host-decision.json
            interop/target-recovery-2026-10-02/install-report.json
            interop/target-recovery-2026-10-02/reader-install-report.json
            interop/target-recovery-2026-10-02/wheels-sha256.txt
            interop/target-recovery-2026-10-02/wheels/
            interop/target-recovery-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
