name: REMORA local effect crosswalk

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-effect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: darklordVirtual/REMORA-research
          ref: b25e735d36590154ff53768b4d245ad4c7996f64
          path: remora-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_remora_effect_bridge.py
      - name: Run and check local effects
        run: |
          python examples/remora_effect_bridge.py ./remora-bridge-run --remora-vectors ./remora-source/conformance/autoreview-to-effect-v1/vectors.json > bridge-stdout.json
          python examples/remora_effect_bridge.py ./remora-bridge-run --remora-vectors ./remora-source/conformance/autoreview-to-effect-v1/vectors.json --verify > bridge-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: remora-local-effect-run
          path: |
            remora-bridge-run/
            bridge-stdout.json
            bridge-verification.json
