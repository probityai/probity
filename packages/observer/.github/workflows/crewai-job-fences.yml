name: CrewAI native job fences and body effects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['interop/crewai-job-fences-2026-10-04/**', '.github/workflows/crewai-job-fences.yml']
  pull_request:
    branches: [main]
    paths: ['interop/crewai-job-fences-2026-10-04/**', '.github/workflows/crewai-job-fences.yml']

permissions:
  contents: read

jobs:
  installed-native-job-fences:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_DISABLE_TRACKING: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      OTEL_SDK_DISABLED: 'true'
      UV_PYTHON_DOWNLOADS: 'never'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: crewAIInc/crewAI
          ref: 738c8e19e35c2888d8e0663bc5cc45c5acf6ac2d
          path: selected-crewai
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/agent-evidence-observer
          ref: e951e040d355f3f3108da7779c3dfcc8bbc0f523
          path: selected-observer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/probity-verify
          ref: e835ce2bd6a960e7a1cc2fa6522f16d55dce728a
          path: selected-verify
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Build and normally install the selected SDK and SDK-free reader
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/crewai-job-fences-2026-10-04"
          mkdir -p "$profile/install-attempt"
          cp "$profile"/*source-selection.json "$profile"/requirements*.lock "$profile/install-attempt/"
          git rev-parse HEAD > "$profile/install-attempt/owned-head.txt"
          cp "$GITHUB_WORKSPACE/selected-crewai/uv.lock" "$profile/install-attempt/publisher-uv.lock"
          exec > >(tee "$profile/install-attempt/setup.log") 2>&1
          python -I -B -c 'import ast,sys;from pathlib import Path;[ast.parse(p.read_text(),filename=str(p)) for p in Path(sys.argv[1]).rglob("*.py")]' "$profile"
          python -m pip install --no-compile uv==0.11.15
          uv --version
          python -m venv "$RUNNER_TEMP/crewai-jobs-producer"
          uv pip sync --python "$RUNNER_TEMP/crewai-jobs-producer/bin/python" --require-hashes "$profile/requirements-native.lock"
          uv build --wheel --python "$(command -v python)" "$GITHUB_WORKSPACE/selected-crewai/lib/crewai-core" --out-dir "$RUNNER_TEMP/crewai-jobs-wheels"
          uv build --wheel --python "$(command -v python)" "$GITHUB_WORKSPACE/selected-crewai/lib/cli" --out-dir "$RUNNER_TEMP/crewai-jobs-wheels"
          uv build --wheel --python "$(command -v python)" "$GITHUB_WORKSPACE/selected-crewai/lib/crewai" --out-dir "$RUNNER_TEMP/crewai-jobs-wheels"
          uv build --wheel --python "$(command -v python)" "$GITHUB_WORKSPACE/selected-observer" --out-dir "$RUNNER_TEMP/crewai-jobs-wheels"
          uv build --wheel --python "$(command -v python)" "$profile" --out-dir "$RUNNER_TEMP/crewai-jobs-wheels"
          uv pip install --python "$RUNNER_TEMP/crewai-jobs-producer/bin/python" --no-deps "$RUNNER_TEMP/crewai-jobs-wheels/"*.whl
          uv pip check --python "$RUNNER_TEMP/crewai-jobs-producer/bin/python"
          python -m venv "$RUNNER_TEMP/crewai-jobs-reader"
          uv pip install --python "$RUNNER_TEMP/crewai-jobs-reader/bin/python" --require-hashes -r "$profile/requirements-runtime-reader.lock"
          uv pip install --python "$RUNNER_TEMP/crewai-jobs-reader/bin/python" --no-deps "$RUNNER_TEMP/crewai-jobs-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/crewai-jobs-wheels/probity_crewai_job_fences-0.0.1-py3-none-any.whl"
          uv pip check --python "$RUNNER_TEMP/crewai-jobs-reader/bin/python"
      - name: Run native fences and real threaded flows, then read twice offline
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/crewai-job-fences-2026-10-04"
          python -I -B "$profile/bootstrap.py" --producer "$RUNNER_TEMP/crewai-jobs-producer/bin/python" --reader "$RUNNER_TEMP/crewai-jobs-reader/bin/python" --wheels "$RUNNER_TEMP/crewai-jobs-wheels" --sdk "$GITHUB_WORKSPACE/selected-crewai" --observer "$GITHUB_WORKSPACE/selected-observer" --output "$profile/actual-run"
      - name: Refuse thirty semantic mutations even when their hashes are reselected
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/crewai-job-fences-2026-10-04"
          CREWAI_JOB_PACKET="$profile/actual-run/packet" "$RUNNER_TEMP/crewai-jobs-reader/bin/python" -I -B "$profile/test_controls.py" -v 2>&1 | tee "$profile/actual-run/reader-controls.log"
      - name: Run actual Verify on three retained body-effect absence claims twice
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/crewai-job-fences-2026-10-04"
          uv build --wheel --python "$(command -v python)" "$GITHUB_WORKSPACE/selected-verify" --out-dir "$RUNNER_TEMP/crewai-verify-wheels"
          uv pip install --python "$RUNNER_TEMP/crewai-jobs-reader/bin/python" --no-deps "$RUNNER_TEMP/crewai-verify-wheels/probity_verify-0.1.0-py3-none-any.whl"
          uv pip check --python "$RUNNER_TEMP/crewai-jobs-reader/bin/python"
          policy_sha="$(sha256sum "$profile/actual-run/host-policy.json" | cut -d ' ' -f 1)"
          python -I -B "$profile/verify_consumer.py" --reader "$RUNNER_TEMP/crewai-jobs-reader/bin/python" --source "$GITHUB_WORKSPACE/selected-verify" --wheel "$RUNNER_TEMP/crewai-verify-wheels/probity_verify-0.1.0-py3-none-any.whl" --packet "$profile/actual-run/packet" --policy "$profile/actual-run/host-policy.json" --policy-sha256 "$policy_sha" --output "$profile/actual-run/verify-consumer"
      - name: Retain the original attempt, installed sources, callbacks and effects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crewai-native-job-fences-evidence
          path: |
            interop/crewai-job-fences-2026-10-04/actual-run/
            interop/crewai-job-fences-2026-10-04/install-attempt/
          if-no-files-found: error
          retention-days: 90
