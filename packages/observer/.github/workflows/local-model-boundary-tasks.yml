name: Preregistered native authored boundary task expansion
on:
  push:
    branches: [run/local-model-boundary-tasks-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check selected model and dependency transfers (512 MiB total envelope)
        run: python interop/local-model-boundary-tasks-2026-10-02/prepare_boundary.py model-boundary-artifacts
      - name: Install retained dependencies and build the selected CPU runtime
        run: |
          set -euo pipefail
          python interop/local-model-boundary-tasks-2026-10-02/prepare_boundary.py model-boundary-artifacts --verify-downloads
          python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links model-boundary-artifacts/downloads -r model-boundary-artifacts/requirements.txt
          python -m pip check
          CC=/usr/bin/gcc CXX=/usr/bin/g++ CMAKE_BUILD_PARALLEL_LEVEL=2 CMAKE_ARGS='-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF' timeout --signal=TERM --kill-after=5s 330s python -m pip install --no-index --find-links model-boundary-artifacts/downloads --no-build-isolation --no-deps model-boundary-artifacts/downloads/llama_cpp_python-0.3.16.tar.gz > model-boundary-artifacts/build-gcc.log 2>&1
          python interop/local-model-boundary-tasks-2026-10-02/prepare_boundary.py model-boundary-artifacts --finalize
      - name: Execute all 384 frozen boundary-task attempts within the original ten-minute envelope
        run: |
          timeout --signal=TERM --kill-after=5s 595s python interop/local-model-boundary-tasks-2026-10-02/task_matrix.py model-boundary-artifacts/run --protocol-commit f63ff5a7c236c8f0122dec71fbaabde8c2feb6a3 --weights model-boundary-artifacts --provenance model-boundary-artifacts/provenance.json > model-boundary-artifacts/run-stdout.json 2> model-boundary-artifacts/run-stderr.txt
      - name: Print the produced artifact selections for later independent readers
        run: cat model-boundary-artifacts/run/consumer-pins.json
      - name: Recompute from selected retained bytes in a separate reader invocation
        run: python interop/local-model-boundary-tasks-2026-10-02/task_matrix.py model-boundary-artifacts/run --verify --pins-file model-boundary-artifacts/run/consumer-pins.json > model-boundary-artifacts/reader.json
      - name: Print the retained population, quality and resource receipt
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("model-boundary-artifacts/run/report.json").read_bytes())
          print(json.dumps({k: v for k, v in report.items() if k != "attempts"}, indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-boundary-cpu-preparation-${{ github.sha }}
          path: model-boundary-artifacts
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-boundary-cpu-native-packet-${{ github.sha }}
          path: model-boundary-artifacts/run
          if-no-files-found: warn
          retention-days: 90
