name: Pydantic AI native ticket consumer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/pydantic-ai-native-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/pydantic-ai-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/pydantic-ai-native-2026-10-02/**'
      - 'src/probity_observer/**'
      - 'pyproject.toml'
      - '.github/workflows/pydantic-ai-native.yml'

permissions:
  contents: read

jobs:
  native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/pydantic-ai-native-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-selected runtime and build installed wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip wheel --no-deps --no-build-isolation ../.. . --wheel-dir "$RUNNER_TEMP/pydantic-wheels"
          python -m pip install --no-deps "$RUNNER_TEMP/pydantic-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/pydantic-wheels/probity_pydantic_reference-0.0.1-py3-none-any.whl"
          python -m pip check
      - name: Check native transcript and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests -q --junitxml=test-results.xml
          ruff check --select E,F,I,C901 --config 'lint.mccabe.max-complexity=5' src tests
      - name: Execute fresh native tool and HTTP population
        shell: bash
        run: |
          set -euo pipefail
          packet="$GITHUB_WORKSPACE/interop/pydantic-ai-native-2026-10-02/fresh-run/packet"
          test ! -e "$packet"
          mkdir -p fresh-run
          cd "$RUNNER_TEMP"
          probity-pydantic-run "$packet" --source-revision "$GITHUB_SHA" > "$GITHUB_WORKSPACE/interop/pydantic-ai-native-2026-10-02/fresh-run/producer-stdout.json"
      - name: Install separate offline consumer without agent framework
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pydantic-reader"
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip install --require-hashes -r requirements-reader.lock
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip install --no-deps "$RUNNER_TEMP/pydantic-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/pydantic-wheels/probity_pydantic_reference-0.0.1-py3-none-any.whl"
          "$RUNNER_TEMP/pydantic-reader/bin/python" -m pip check
          "$RUNNER_TEMP/pydantic-reader/bin/python" -c "import importlib.util; assert importlib.util.find_spec('pydantic_ai') is None"
      - name: Consume fresh packet with separately supplied demonstration pins
        shell: bash
        run: |
          set -euo pipefail
          cp fresh-run/packet/consumer-pins.json "$RUNNER_TEMP/pydantic-selected-pins.json"
          "$RUNNER_TEMP/pydantic-reader/bin/probity-pydantic-read" fresh-run/packet --pins-file "$RUNNER_TEMP/pydantic-selected-pins.json" > fresh-run/fresh-consumer-report.json
          python -c "import json; from pathlib import Path; r=Path('fresh-run'); a=json.loads((r/'producer-stdout.json').read_bytes()); b=json.loads((r/'fresh-consumer-report.json').read_bytes()); c=json.loads((r/'packet/report.json').read_bytes()); assert a==b==c and b['status']=='verified' and b['plannedAttempts']==7"
      - name: Retain original histories, sources, joins and consumer report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pydantic-ai-native-ticket
          path: |
            interop/pydantic-ai-native-2026-10-02/fresh-run/
            interop/pydantic-ai-native-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
