name: ADK nested compaction and shared plugin lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['interop/adk-nested-compaction-2026-10-04/**', '.github/workflows/adk-nested-compaction.yml']
  pull_request:
    branches: [main]
    paths: ['interop/adk-nested-compaction-2026-10-04/**', '.github/workflows/adk-nested-compaction.yml']

permissions:
  contents: read

jobs:
  installed-native-compaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mahir-m01/adk-python
          ref: 81c43680d6ebe0288b77a2e9ff746f696889c75d
          path: selected-adk
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/agent-evidence-observer
          ref: 8c074d7b8f380dd01fd55277b68a37ad8217c8cb
          path: selected-observer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/probity-verify
          ref: e835ce2bd6a960e7a1cc2fa6522f16d55dce728a
          path: selected-verify
          persist-credentials: false
      - name: Build wheels and normally install the exact SDK into the producer
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-nested-compaction-2026-10-04"
          mkdir -p "$profile/install-attempt"
          cp "$profile/native-source-selection.json" "$profile/install-attempt/"
          exec > >(tee "$profile/install-attempt/setup.log") 2>&1
          python -m venv "$RUNNER_TEMP/adk-nested-producer"
          "$RUNNER_TEMP/adk-nested-producer/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements.lock" -r "$profile/build.lock"
          "$RUNNER_TEMP/adk-nested-producer/bin/python" -m pip wheel --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-observer" "$profile" --wheel-dir "$RUNNER_TEMP/adk-nested-wheels"
          "$RUNNER_TEMP/adk-nested-producer/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/adk-nested-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/adk-nested-wheels/probity_adk_nested_compaction-0.0.1-py3-none-any.whl"
          "$RUNNER_TEMP/adk-nested-producer/bin/python" -m pip install --no-compile --no-deps --no-build-isolation --force-reinstall "$GITHUB_WORKSPACE/selected-adk"
          python -m venv "$RUNNER_TEMP/adk-nested-reader"
          "$RUNNER_TEMP/adk-nested-reader/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements-reader.lock"
          "$RUNNER_TEMP/adk-nested-reader/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/adk-nested-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/adk-nested-wheels/probity_adk_nested_compaction-0.0.1-py3-none-any.whl"
      - name: Run four nested native cases then the SDK-free reader twice
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-nested-compaction-2026-10-04"
          python -I -B "$profile/bootstrap.py" --producer "$RUNNER_TEMP/adk-nested-producer/bin/python" --reader "$RUNNER_TEMP/adk-nested-reader/bin/python" --wheels "$RUNNER_TEMP/adk-nested-wheels" --sdk "$GITHUB_WORKSPACE/selected-adk" --output "$profile/actual-run"
      - name: Refuse semantic mutations even after their artifact hashes are reselected
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-nested-compaction-2026-10-04"
          ADK_NESTED_PACKET="$profile/actual-run/packet" "$RUNNER_TEMP/adk-nested-reader/bin/python" -I -B "$profile/test_controls.py" -v 2>&1 | tee "$profile/actual-run/reader-controls.log"
      - name: Install Verify and consume four retained lifecycle projections twice
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/adk-nested-compaction-2026-10-04"
          "$RUNNER_TEMP/adk-nested-producer/bin/python" -m pip wheel --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-verify" --wheel-dir "$RUNNER_TEMP/adk-verify-wheels"
          "$RUNNER_TEMP/adk-nested-reader/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/adk-verify-wheels/probity_verify-0.1.0-py3-none-any.whl"
          policy_sha="$(sha256sum "$profile/actual-run/host-policy.json" | cut -d ' ' -f 1)"
          python -I -B "$profile/verify_consumer.py" --reader "$RUNNER_TEMP/adk-nested-reader/bin/python" --source "$GITHUB_WORKSPACE/selected-verify" --wheel "$RUNNER_TEMP/adk-verify-wheels/probity_verify-0.1.0-py3-none-any.whl" --packet "$profile/actual-run/packet" --policy "$profile/actual-run/host-policy.json" --policy-sha256 "$policy_sha" --output "$profile/actual-run/verify-consumer"
      - name: Retain installed source, raw callbacks, effects and original child receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adk-nested-compaction-native-evidence
          path: |
            interop/adk-nested-compaction-2026-10-04/actual-run/
            interop/adk-nested-compaction-2026-10-04/install-attempt/
          if-no-files-found: error
          retention-days: 90
