name: Local model record contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 hypothesis==6.168.3
      - name: Check the local-model reader's refusal contract
        working-directory: interop/local-model-2026-10-02
        run: python -m pytest tests -q
      - name: Check the operational task matrix reader and frozen rubric
        working-directory: interop/local-model-tasks-2026-10-02
        run: python -m pytest tests -q
      - name: Check paired model comparison selections, order and resource refusals
        working-directory: interop/local-model-comparison-2026-10-02
        run: python -m pytest tests -q
      - name: Check frozen native schema format-control selections and independent scores
        working-directory: interop/local-model-format-control-2026-10-02
        run: python -m pytest tests -q
      - name: Check new authored boundary tasks and CPU envelope reconstruction
        working-directory: interop/local-model-boundary-tasks-2026-10-02
        run: python -m pytest tests -q
