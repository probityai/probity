name: Installed witnessed run selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'interop/witnessed-run-selection-2026-10-04/**', '.github/workflows/witnessed-run-selection.yml', 'pyproject.toml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'interop/witnessed-run-selection-2026-10-04/**', '.github/workflows/witnessed-run-selection.yml', 'pyproject.toml']

permissions:
  contents: read

jobs:
  installed-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install 'uv==0.8.22'
      - run: bash interop/witnessed-run-selection-2026-10-04/verify_install.sh "$RUNNER_TEMP/run-selection"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: witnessed-run-selection-native
          path: |
            ${{ runner.temp }}/run-selection/native/
            ${{ runner.temp }}/run-selection/wheels/
            ${{ runner.temp }}/run-selection/*.json
            ${{ runner.temp }}/run-selection/*.txt
            ${{ runner.temp }}/run-selection/*.lock
            ${{ runner.temp }}/run-selection/*-tests.xml
          if-no-files-found: error
          retention-days: 90
