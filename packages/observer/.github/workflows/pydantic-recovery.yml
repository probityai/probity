name: Pydantic native deferred recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/pydantic-recovery-2026-10-03/**'
      - 'src/probity_observer/**'
      - '.github/workflows/pydantic-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'interop/pydantic-recovery-2026-10-03/**'
      - 'src/probity_observer/**'
      - '.github/workflows/pydantic-recovery.yml'
permissions:
  contents: read
jobs:
  native-installed-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/pydantic-recovery-2026-10-03
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the selected native profile and exact Observer checkout
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report install-report.json
          python -m pip install --no-deps -e ../..
      - name: Check native process and semantic refusal controls
        run: |
          python -m ruff check recovery_*.py probity_pydantic_recovery tests
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' recovery_*.py probity_pydantic_recovery tests
          timeout --signal=TERM --kill-after=5s 180s python -m pytest -q tests --junitxml=test-results.xml
      - name: Execute and retain a fresh native original
        run: timeout --signal=TERM --kill-after=5s 240s python recovery_run.py fresh-run --source-revision "$GITHUB_SHA" > fresh-report.json
      - name: Install a framework-free reader and check host selection
        run: bash verify_install.sh "$(command -v python)"
      - name: Retain native history, SQLite, process originals and host receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pydantic-deferred-recovery-${{ github.sha }}
          path: |
            interop/pydantic-recovery-2026-10-03/fresh-run/
            interop/pydantic-recovery-2026-10-03/fresh-report.json
            interop/pydantic-recovery-2026-10-03/host-receipts/
            interop/pydantic-recovery-2026-10-03/host-repeat/
            interop/pydantic-recovery-2026-10-03/install-report.json
            interop/pydantic-recovery-2026-10-03/reader-install-report.json
            interop/pydantic-recovery-2026-10-03/test-results.xml
            interop/pydantic-recovery-2026-10-03/wheels-sha256.txt
            interop/pydantic-recovery-2026-10-03/wheels/*.whl
          if-no-files-found: error
          retention-days: 90
