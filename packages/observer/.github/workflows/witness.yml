name: Witness server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the package with the witness extra (builds probityai from its pinned commit)
        run: python -m pip install -e '.[test,witness]'
      - name: Proof, log, scope, client and command-line tests
        run: python -m pytest -q -p no:cacheprovider tests/witness
      - name: Every verifier mutant fails the tests
        run: python scripts/mutate-witness-proofs.py
