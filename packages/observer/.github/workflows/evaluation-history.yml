name: Evaluation history

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,inspect]'
      - run: python -m pytest -q tests/test_evaluation_history.py tests/test_inspect_history.py tests/test_eval_adversarial.py
      - run: python examples/evaluation_history_demo.py --output-dir evaluation-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-run
          path: evaluation-run/
