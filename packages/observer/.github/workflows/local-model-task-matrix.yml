name: Preregistered operational CPU task matrix
on:
  push:
    branches: [run/local-model-task-matrix-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check selected model and dependency transfers (512 MiB total envelope)
        run: python interop/local-model-2026-10-02/prepare_local_model.py local-model-artifacts
      - name: Install retained dependencies and build the selected CPU runtime
        run: |
          set -euo pipefail
          python interop/local-model-2026-10-02/prepare_local_model.py local-model-artifacts --verify-downloads
          python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links local-model-artifacts/downloads -r local-model-artifacts/requirements.txt
          CC=/usr/bin/gcc CXX=/usr/bin/g++ CMAKE_BUILD_PARALLEL_LEVEL=2 CMAKE_ARGS='-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF' timeout --signal=TERM --kill-after=5s 330s python -m pip install --no-index --find-links local-model-artifacts/downloads --no-build-isolation --no-deps local-model-artifacts/downloads/llama_cpp_python-0.3.16.tar.gz > local-model-artifacts/build-gcc.log 2>&1
          python interop/local-model-2026-10-02/prepare_local_model.py local-model-artifacts --finalize
      - name: Execute all 48 frozen attempts within the original ten-minute envelope
        run: |
          timeout --signal=TERM --kill-after=5s 595s python interop/local-model-tasks-2026-10-02/task_matrix.py local-model-artifacts/run --protocol-commit 5cfd69b8315a2e4cd8dacbbf5de40db71ce8658c --weights local-model-artifacts/model.gguf --provenance local-model-artifacts/provenance.json > local-model-artifacts/run-stdout.json 2> local-model-artifacts/run-stderr.txt
      - name: Print the produced artifact selections for later independent readers
        run: cat local-model-artifacts/run/consumer-pins.json
      - name: Recompute from selected retained bytes in a separate reader invocation
        run: python interop/local-model-tasks-2026-10-02/task_matrix.py local-model-artifacts/run --verify --pins-file local-model-artifacts/run/consumer-pins.json > local-model-artifacts/reader.json
      - name: Print the retained population, quality and resource receipt
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("local-model-artifacts/run/report.json").read_bytes())
          print(json.dumps({k: v for k, v in report.items() if k != "attempts"}, indent=2))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: operational-local-cpu-matrix-${{ github.sha }}
          path: local-model-artifacts
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: operational-local-cpu-native-packet-${{ github.sha }}
          path: local-model-artifacts/run
          if-no-files-found: warn
          retention-days: 90
