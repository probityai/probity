name: Native ControlArena selected publication
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/control-arena-native-2026-10-02/**'
      - '.github/workflows/control-arena-native-reader.yml'
  push:
    branches: [main]
    paths:
      - 'interop/control-arena-native-2026-10-02/**'
      - '.github/workflows/control-arena-native-reader.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [asyncio, trio]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: astrogilda/control-arena
          ref: 7c0ebaa21c9d59d146c0eafcf7d6938734e8e430
          path: selected-native-host
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install selected build and verification tools
        run: python -m pip install uv==0.12.19 ruff==0.15.8 pyright==1.1.408
      - name: Install the immutable native host dependency lock
        working-directory: selected-native-host
        env:
          TZ: UTC
        run: uv sync --dev --frozen
      - name: Build the reviewed reader wheel and install it before the native run
        env:
          SOURCE_DATE_EPOCH: '946684800'
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/reader-wheels" interop/control-arena-native-2026-10-02
          uv venv --python python3.12 "$RUNNER_TEMP/reader-env"
          uv pip install --python "$RUNNER_TEMP/reader-env/bin/python" --no-deps "$RUNNER_TEMP/reader-wheels/"*.whl
          uv pip install --python "$RUNNER_TEMP/reader-env/bin/python" pytest==8.3.3 hypothesis==6.168.3
      - name: Select outside policy, execute the actual native host, and gate publication
        run: |
          python interop/control-arena-native-2026-10-02/run_selected_host.py \
            --reader-root "$GITHUB_WORKSPACE" --reader-source-commit "$GITHUB_SHA" \
            --reader-python "$RUNNER_TEMP/reader-env/bin/python" \
            --wheel "$RUNNER_TEMP/reader-wheels/probity_control_arena_reader-0.0.1-py3-none-any.whl" \
            --host-root "$GITHUB_WORKSPACE/selected-native-host" \
            --host-python "$GITHUB_WORKSPACE/selected-native-host/.venv/bin/python" \
            --host-origin https://github.com/astrogilda/control-arena \
            --backend '${{ matrix.backend }}' --output-dir "$RUNNER_TEMP/native-selected-${{ matrix.backend }}"
      - name: Verify installed native grammar and reselected-digest semantic mutants
        working-directory: interop/control-arena-native-2026-10-02
        env:
          CONTROL_ARENA_LOG: '${{ runner.temp }}/native-selected-${{ matrix.backend }}/native/control-arena.json'
          CONTROL_ARENA_POLICY: '${{ runner.temp }}/native-selected-${{ matrix.backend }}/policy.json'
          CONTROL_ARENA_WHEEL: '${{ runner.temp }}/reader-wheels/probity_control_arena_reader-0.0.1-py3-none-any.whl'
        run: |
          "$RUNNER_TEMP/reader-env/bin/python" -I -m pytest -q tests --import-mode=importlib --junitxml="$RUNNER_TEMP/reader-${{ matrix.backend }}.xml"
          python -m ruff check .
          python -m ruff format --check .
          python -m pyright
      - name: Verify native export controls and host static checks
        working-directory: selected-native-host
        run: |
          if [ '${{ matrix.backend }}' = trio ]; then
            .venv/bin/python -m pytest -q --runtrio examples/evidence_publication/test_native.py --basetemp="$RUNNER_TEMP/native-tests-trio"
          else
            .venv/bin/python -m pytest -q examples/evidence_publication/test_native.py --basetemp="$RUNNER_TEMP/native-tests-asyncio"
          fi
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
      - name: Retain original native logs, installed wheel, policy and decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-arena-native-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/reader-wheels/
            ${{ runner.temp }}/native-selected-${{ matrix.backend }}/
            ${{ runner.temp }}/reader-${{ matrix.backend }}.xml
          if-no-files-found: error
          retention-days: 90
