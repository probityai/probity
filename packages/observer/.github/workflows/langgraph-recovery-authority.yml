name: LangGraph recovery authority
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/langgraph-recovery-authority-2026-10-02/**'
      - 'interop/langgraph-ticket-2026-10-02/**'
      - 'src/probity_observer/**'
      - '.github/workflows/langgraph-recovery-authority.yml'
  push:
    branches: [main]
    paths:
      - 'interop/langgraph-recovery-authority-2026-10-02/**'
      - 'interop/langgraph-ticket-2026-10-02/**'
      - 'src/probity_observer/**'
      - '.github/workflows/langgraph-recovery-authority.yml'
permissions:
  contents: read
jobs:
  recovery-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/langgraph-recovery-authority-2026-10-02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install selected native profile and exact Observer checkout
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../langgraph-ticket-2026-10-02/requirements-restart.lock --report install-report.json
          python -m pip install --no-deps -e ../..
      - name: Check adapter and bounded complexity
        run: |
          python -m ruff check authority_*.py tests
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' authority_*.py tests
      - name: Execute native authority cases and reselected refusal controls
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Execute a fresh native authority packet
        run: timeout --signal=TERM --kill-after=5s 240s python authority_run.py fresh-run --source-revision "$GITHUB_SHA" > fresh-report.json
      - name: Require selected host policy and separate offline replay
        run: |
          cp fresh-run/consumer-pins.json "$RUNNER_TEMP/authority-host-pins.json"
          python authority_reader.py fresh-run --pins-file "$RUNNER_TEMP/authority-host-pins.json" > reader-report.json
          python -c 'import json; assert json.load(open("fresh-report.json")) == json.load(open("reader-report.json"))'
      - name: Retain complete native authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: langgraph-recovery-authority-${{ github.sha }}
          path: |
            interop/langgraph-recovery-authority-2026-10-02/fresh-run/
            interop/langgraph-recovery-authority-2026-10-02/fresh-report.json
            interop/langgraph-recovery-authority-2026-10-02/reader-report.json
            interop/langgraph-recovery-authority-2026-10-02/install-report.json
            interop/langgraph-recovery-authority-2026-10-02/test-results.xml
          if-no-files-found: error
          retention-days: 90
