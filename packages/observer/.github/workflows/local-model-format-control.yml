name: Preregistered native JSON schema format controls
on:
  push:
    branches: [run/local-model-format-control-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check selected model and dependency transfers (512 MiB total envelope)
        run: python interop/local-model-format-control-2026-10-02/prepare_format.py model-format-artifacts
      - name: Install retained dependencies and build the selected CPU runtime
        run: |
          set -euo pipefail
          python interop/local-model-format-control-2026-10-02/prepare_format.py model-format-artifacts --verify-downloads
          python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links model-format-artifacts/downloads -r model-format-artifacts/requirements.txt
          python -m pip check
          CC=/usr/bin/gcc CXX=/usr/bin/g++ CMAKE_BUILD_PARALLEL_LEVEL=2 CMAKE_ARGS='-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF' timeout --signal=TERM --kill-after=5s 330s python -m pip install --no-index --find-links model-format-artifacts/downloads --no-build-isolation --no-deps model-format-artifacts/downloads/llama_cpp_python-0.3.16.tar.gz > model-format-artifacts/build-gcc.log 2>&1
          python interop/local-model-format-control-2026-10-02/prepare_format.py model-format-artifacts --finalize
      - name: Execute all 192 frozen format-control attempts within the original ten-minute envelope
        run: |
          timeout --signal=TERM --kill-after=5s 595s python interop/local-model-format-control-2026-10-02/task_matrix.py model-format-artifacts/run --protocol-commit 108887b86df66e0d12a4db981a8aadd047f50b16 --weights model-format-artifacts --provenance model-format-artifacts/provenance.json > model-format-artifacts/run-stdout.json 2> model-format-artifacts/run-stderr.txt
      - name: Print the produced artifact selections for later independent readers
        run: cat model-format-artifacts/run/consumer-pins.json
      - name: Recompute from selected retained bytes in a separate reader invocation
        run: python interop/local-model-format-control-2026-10-02/task_matrix.py model-format-artifacts/run --verify --pins-file model-format-artifacts/run/consumer-pins.json > model-format-artifacts/reader.json
      - name: Print the retained population, quality and resource receipt
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("model-format-artifacts/run/report.json").read_bytes())
          print(json.dumps({k: v for k, v in report.items() if k != "attempts"}, indent=2))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: model-format-cpu-preparation-${{ github.sha }}
          path: model-format-artifacts
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: model-format-cpu-native-packet-${{ github.sha }}
          path: model-format-artifacts/run
          if-no-files-found: warn
          retention-days: 90
