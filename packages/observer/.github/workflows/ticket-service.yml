name: Native HTTP ticket service

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ticket-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_ticket_service.py tests/test_aae_ticket.py --junitxml=ticket-service-tests.xml
      - run: python examples/ticket_service_demo.py ./ticket-service-run
      - run: python examples/aae_ticket_demo.py ./aae-ticket-run --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ticket-service-run
          path: |
            ticket-service-run/
            aae-ticket-run/
            ticket-service-tests.xml
