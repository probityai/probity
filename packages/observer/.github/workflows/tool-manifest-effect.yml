name: Tool manifest and retained effect

on:
  push:
    branches: [main]
    paths:
      - 'src/probity_observer/**'
      - 'tests/**'
      - 'examples/tool_manifest_effect.py'
      - 'pyproject.toml'
      - 'interop/**/requirements*.lock'
      - 'scripts/check-runtime-locks.py'
      - 'docs/TOOL-MANIFEST-EFFECT.md'
      - 'docs/reference/TOOL-MANIFEST-EFFECT.md'
      - '.github/workflows/tool-manifest-effect.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.8'
      - name: Install and run the core source suite
        run: |
          uv venv .venv --python python3.12
          uv pip install --python .venv/bin/python -e '.[test]'
          uv pip check --python .venv/bin/python
          .venv/bin/python scripts/check-runtime-locks.py
          .venv/bin/pytest -q
      - name: Retain and read the unchanged contributor case
        run: |
          .venv/bin/python examples/tool_manifest_effect.py ./manifest-effect-run > manifest-effect-run.stdout.json
          .venv/bin/python examples/tool_manifest_effect.py ./manifest-effect-run --verify --consumer-pins ./manifest-effect-run/tool-match/consumer-pins.json > manifest-effect-run.verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-manifest-effect
          if-no-files-found: error
          path: |
            manifest-effect-run/
            manifest-effect-run.stdout.json
            manifest-effect-run.verification.json
