name: Installed model publication gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/model-consumer-2026-10-02/**'
      - 'interop/local-model-tasks-2026-10-02/**'
      - '.github/workflows/model-consumer-gate.yml'
  push:
    branches: [main]
    paths:
      - 'interop/model-consumer-2026-10-02/**'
      - 'interop/local-model-tasks-2026-10-02/**'
      - '.github/workflows/model-consumer-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install hash-selected build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock
      - name: Build exact reader sources and normally install without frameworks
        run: |
          python interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/model-reader-wheels"
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/model-reader-wheels/"*.whl
          "$RUNNER_TEMP/consumer/bin/python" -m pip check
          echo "$RUNNER_TEMP/consumer/bin" >> "$GITHUB_PATH"
      - name: Retain installed publication and quality refusal
        run: python interop/model-consumer-2026-10-02/run_host_example.py "$RUNNER_TEMP/model-host-result"
      - name: Execute installation, policy, runtime and native refusal controls
        run: |
          python -m pip install pytest==8.4.2 ruff==0.15.6
          python -m ruff check interop/model-consumer-2026-10-02/
          python -m ruff format --check interop/model-consumer-2026-10-02/
          python -m pytest -q interop/model-consumer-2026-10-02/tests --junitxml=model-consumer-tests.xml
      - name: Retain exact wheel, policies and command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-consumer-publication
          path: |
            ${{ runner.temp }}/model-reader-wheels/
            ${{ runner.temp }}/model-host-result/
            model-consumer-tests.xml
          if-no-files-found: error
          retention-days: 90
