name: Installed model publication gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/model-consumer-2026-10-02/**'
      - 'interop/local-model-tasks-2026-10-02/**'
      - 'interop/local-model-comparison-2026-10-02/**'
      - 'interop/local-model-format-control-2026-10-02/**'
      - 'interop/local-model-boundary-tasks-2026-10-02/**'
      - '.github/workflows/model-consumer-gate.yml'
  push:
    branches: [main]
    paths:
      - 'interop/model-consumer-2026-10-02/**'
      - 'interop/local-model-tasks-2026-10-02/**'
      - 'interop/local-model-comparison-2026-10-02/**'
      - 'interop/local-model-format-control-2026-10-02/**'
      - 'interop/local-model-boundary-tasks-2026-10-02/**'
      - '.github/workflows/model-consumer-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3a5efd16d242dc9044fc7492278a524c5c08a0cc
          path: historical-model-reader
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37ec3b29882f7ce82133ee934f7e01889810db06
          path: previous-model-reader
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4080bcc1425457221fa49d43ccac60ecfa485ab7
          path: boundary-baseline-model-reader
          persist-credentials: false
      - name: Install hash-selected build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock
      - name: Build the frozen0.0.1 baseline and install both clean environments
        run: |
          python historical-model-reader/interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/historical-model-reader" "$RUNNER_TEMP/baseline-model-wheels"
          for environment in baseline-consumer previous-consumer; do
            python -m venv "$RUNNER_TEMP/$environment"
            "$RUNNER_TEMP/$environment/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/baseline-model-wheels/"*.whl
          done
      - name: Build the frozen 0.0.2 wheel and install the next upgrade baseline
        run: |
          python previous-model-reader/interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/previous-model-reader" "$RUNNER_TEMP/previous-model-wheels"
          "$RUNNER_TEMP/previous-consumer/bin/python" -m pip install --no-index --no-deps --upgrade "$RUNNER_TEMP/previous-model-wheels/"*.whl
      - name: Build frozen 0.0.3 and retain the next clean upgrade baseline
        run: |
          python boundary-baseline-model-reader/interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE/boundary-baseline-model-reader" "$RUNNER_TEMP/boundary-baseline-wheels"
          for environment in format-consumer consumer; do
            python -m venv "$RUNNER_TEMP/$environment"
            "$RUNNER_TEMP/$environment/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/boundary-baseline-wheels/"*.whl
          done
      - name: Build exact 0.0.4 sources and normally upgrade without frameworks
        run: |
          python interop/model-consumer-2026-10-02/build_reader.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/model-reader-wheels"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-index --no-deps --upgrade "$RUNNER_TEMP/model-reader-wheels/"*.whl
          "$RUNNER_TEMP/consumer/bin/python" -m pip check
          echo "$RUNNER_TEMP/consumer/bin" >> "$GITHUB_PATH"
      - name: Retain installed publication and quality refusal
        run: python interop/model-consumer-2026-10-02/run_host_example.py "$RUNNER_TEMP/model-host-result"
      - name: Retain actual installed profile upgrade and model quality refusal
        run: |
          python interop/model-consumer-2026-10-02/run_upgrade_example.py "$RUNNER_TEMP/model-upgrade-result" --baseline-python "$RUNNER_TEMP/baseline-consumer/bin/python" --candidate-python "$RUNNER_TEMP/previous-consumer/bin/python"
      - name: Retain actual decoder upgrade and semantic refusal despite valid schemas
        run: |
          python interop/model-consumer-2026-10-02/run_format_upgrade_example.py "$RUNNER_TEMP/model-format-upgrade-result" --baseline-python "$RUNNER_TEMP/previous-consumer/bin/python" --candidate-python "$RUNNER_TEMP/format-consumer/bin/python"
      - name: Retain immutable 384-call upgrade, prior report bytes and paired quality holds
        run: |
          python interop/model-consumer-2026-10-02/run_boundary_upgrade_example.py "$RUNNER_TEMP/model-boundary-upgrade-result" --baseline-python "$RUNNER_TEMP/format-consumer/bin/python" --candidate-python "$RUNNER_TEMP/consumer/bin/python"
      - name: Execute installation, policy, runtime and native refusal controls
        run: |
          python -m pip install pytest==8.4.2 hypothesis==6.147.0 ruff==0.15.6
          python -m ruff check interop/model-consumer-2026-10-02/
          python -m ruff format --check interop/model-consumer-2026-10-02/
          python -m pytest -q interop/model-consumer-2026-10-02/tests --junitxml=model-consumer-tests.xml
      - name: Retain exact wheel, policies and command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-consumer-publication
          path: |
            ${{ runner.temp }}/model-reader-wheels/
            ${{ runner.temp }}/baseline-model-wheels/
            ${{ runner.temp }}/previous-model-wheels/
            ${{ runner.temp }}/boundary-baseline-wheels/
            ${{ runner.temp }}/model-boundary-upgrade-result/
            ${{ runner.temp }}/model-format-upgrade-result/
            ${{ runner.temp }}/model-upgrade-result/
            ${{ runner.temp }}/model-host-result/
            model-consumer-tests.xml
          if-no-files-found: error
          retention-days: 90
