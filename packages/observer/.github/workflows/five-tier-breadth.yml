name: Finite five-tier integration breadth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/five-tier-v0-2026-10-02/**'
      - 'interop/a2a-native-2026-10-02/**'
      - 'interop/evaluation-contract-2026-10-01/**'
      - '.github/workflows/five-tier-breadth.yml'
  pull_request:
    paths:
      - 'interop/five-tier-v0-2026-10-02/**'
      - 'interop/a2a-native-2026-10-02/**'
      - 'interop/evaluation-contract-2026-10-01/**'
      - '.github/workflows/five-tier-breadth.yml'
permissions:
  contents: read
jobs:
  execute-and-reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install selected native frameworks and regression dependencies
        run: python -m pip install -e '.[inspect]' -e 'interop/a2a-native-2026-10-02[test]' pytest==9.1.1 hypothesis==6.168.3 ruff==0.16.10
      - name: Refuse changed native joins, transactions and rehashed wrappers
        run: python -m pytest -q interop/five-tier-v0-2026-10-02/tests --junitxml=five-tier-v0-tests.xml
      - name: Check focused lint and bounded production complexity
        run: |
          ruff check interop/five-tier-v0-2026-10-02
          ruff check --select C901 --config 'lint.mccabe.max-complexity=5' interop/five-tier-v0-2026-10-02/*.py
      - name: Execute frozen finite populations and fresh SDK HTTP interactions
        run: timeout --signal=TERM --kill-after=5s 185s python interop/five-tier-v0-2026-10-02/run.py five-tier-v0-run > five-tier-v0-run.stdout.json
      - name: Independently invoke the offline reader with retained selected inputs
        run: |
          test -s five-tier-v0-run/report.json
          cp five-tier-v0-run/consumer-pins.json "$RUNNER_TEMP/five-tier-v0-selected-pins.json"
          python interop/five-tier-v0-2026-10-02/run.py five-tier-v0-run --verify --pins-file "$RUNNER_TEMP/five-tier-v0-selected-pins.json" > five-tier-v0-offline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: finite-five-tier-native-integration
          path: |
            five-tier-v0-run/
            five-tier-v0-run.stdout.json
            five-tier-v0-offline.json
            five-tier-v0-tests.xml
          if-no-files-found: error
          retention-days: 90
