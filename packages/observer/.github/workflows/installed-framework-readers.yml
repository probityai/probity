name: Installed framework readers
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/framework-consumer-2026-10-02/**'
      - '.github/workflows/installed-framework-readers.yml'
  push:
    branches: [main]
    paths:
      - 'interop/framework-consumer-2026-10-02/**'
      - '.github/workflows/installed-framework-readers.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install hash-selected reader and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock
      - name: Build and normally install the selected wheels
        run: |
          bash interop/framework-consumer-2026-10-02/FRAMEWORK-CONSUMER-BUILD-2026-10-02.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/framework-wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP/framework-wheels/"*.whl
          python -m pip check
      - name: Exercise installed commands and semantic refusals
        run: |
          python -m pip install pytest==8.4.2 ruff==0.15.6
          python -m ruff check interop/framework-consumer-2026-10-02/*.py
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' interop/framework-consumer-2026-10-02/*.py
          python -m pytest -q interop/framework-consumer-2026-10-02/test_installed_readers.py --junitxml=installed-reader-tests.xml
      - name: Retain installation and control results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-framework-readers
          path: |
            ${{ runner.temp }}/framework-wheels/build-record.json
            installed-reader-tests.xml
          if-no-files-found: error
          retention-days: 90
