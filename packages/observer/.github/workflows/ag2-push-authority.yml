name: AG2 push URL authority and observed effects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['interop/ag2-push-authority-2026-10-04/**', '.github/workflows/ag2-push-authority.yml']
  pull_request:
    branches: [main]
    paths: ['interop/ag2-push-authority-2026-10-04/**', '.github/workflows/ag2-push-authority.yml']

permissions:
  contents: read

jobs:
  installed-three-transport-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '946684800'
      PYTHONDONTWRITEBYTECODE: '1'
      UV_DYNAMIC_VERSIONING_BYPASS: '1.1.4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ag2ai/ag2
          ref: fd789e3ca8a77d14c8e3e89923665fe62c00cb9a
          path: selected-ag2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: a2aproject/a2a-python
          ref: e649325e041e44c0b0fe57e3eef0699cad164a1e
          path: selected-a2a
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/agent-evidence-observer
          ref: 8c074d7b8f380dd01fd55277b68a37ad8217c8cb
          path: selected-observer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Normally install the selected native sources and SDK-free reader
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/ag2-push-authority-2026-10-04"
          mkdir -p "$profile/install-attempt"
          cp "$profile/native-source-selection.json" "$profile/install-attempt/native-source-selection.json"
          exec > >(tee "$profile/install-attempt/install.log") 2>&1
          python -m venv "$RUNNER_TEMP/ag2-push-producer"
          export PATH="$RUNNER_TEMP/ag2-push-producer/bin:$PATH"
          "$RUNNER_TEMP/ag2-push-producer/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements.lock"
          "$RUNNER_TEMP/ag2-push-producer/bin/python" -m pip wheel --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-observer" "$profile" --wheel-dir "$RUNNER_TEMP/ag2-push-wheels"
          "$RUNNER_TEMP/ag2-push-producer/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/ag2-push-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/ag2-push-wheels/probity_ag2_push_authority-0.0.1-py3-none-any.whl"
          "$RUNNER_TEMP/ag2-push-producer/bin/python" -m pip install --no-compile --no-deps --no-build-isolation "$GITHUB_WORKSPACE/selected-ag2"
          "$RUNNER_TEMP/ag2-push-producer/bin/python" -m pip install --no-compile --no-deps --no-build-isolation --force-reinstall "$GITHUB_WORKSPACE/selected-a2a"
          python -m venv "$RUNNER_TEMP/ag2-push-reader"
          "$RUNNER_TEMP/ag2-push-reader/bin/python" -m pip install --no-compile --require-hashes -r "$profile/requirements-reader.lock"
          "$RUNNER_TEMP/ag2-push-reader/bin/python" -m pip install --no-compile --no-deps "$RUNNER_TEMP/ag2-push-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/ag2-push-wheels/probity_ag2_push_authority-0.0.1-py3-none-any.whl"
      - name: Run eighteen native tasks and separate registration, dispatch and target decisions
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/ag2-push-authority-2026-10-04"
          python -I -B "$profile/bootstrap.py" --producer "$RUNNER_TEMP/ag2-push-producer/bin/python" --reader "$RUNNER_TEMP/ag2-push-reader/bin/python" --wheels "$RUNNER_TEMP/ag2-push-wheels" --ag2 "$GITHUB_WORKSPACE/selected-ag2" --a2a "$GITHUB_WORKSPACE/selected-a2a" --output "$profile/actual-run"
      - name: Refuse changed semantics after their hashes are reselected
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/interop/ag2-push-authority-2026-10-04"
          AG2_PUSH_PACKET="$profile/actual-run/packet" "$RUNNER_TEMP/ag2-push-reader/bin/python" -I -B "$profile/test_controls.py" -v 2>&1 | tee "$profile/actual-run/reader-controls.log"
      - name: Retain source, failed child receipts, native callbacks and signed effects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag2-push-authority-native-evidence
          path: |
            interop/ag2-push-authority-2026-10-04/actual-run/
            interop/ag2-push-authority-2026-10-04/install-attempt/
          if-no-files-found: error
          retention-days: 90
