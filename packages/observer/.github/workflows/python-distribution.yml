name: Python distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned release tools
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Bind a release tag to the declared package version and main
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_EVENT"] == "release":
              if os.environ["RELEASE_TAG"] != "v" + version:
                  raise SystemExit("release tag does not match the package version")
              subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"], check=True)
          PYCODE
      - name: Build and check the exact wheel and source distribution
        env:
          PYTHONHASHSEED: '0'
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation
          python -m twine check --strict dist/*
          python scripts/check-distribution.py dist/*.whl dist/*.tar.gz
          sha256sum dist/* > SHA256SUMS
          git rev-parse HEAD > SOURCE-COMMIT
      - name: Check distribution refusal controls
        run: |
          python scripts/check-distribution-controls.py dist/*.whl
          python scripts/check-artifacts-controls.py dist/*.whl dist/*.tar.gz
      - name: Install outside the checkout and rebuild the source distribution
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/package-consumer"
          "$RUNNER_TEMP/package-consumer/bin/python" -m pip install dist/*.whl --report wheel-install.json
          "$RUNNER_TEMP/package-consumer/bin/python" -m pip check
          mkdir "$RUNNER_TEMP/package-consumer-cwd" "$RUNNER_TEMP/package-source"
          cd "$RUNNER_TEMP/package-consumer-cwd"
          "$RUNNER_TEMP/package-consumer/bin/python" "$GITHUB_WORKSPACE/scripts/check-installed.py" > "$GITHUB_WORKSPACE/wheel-consumer.json"
          cd "$GITHUB_WORKSPACE"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/package-source"
          python -m build --no-isolation --wheel --outdir rebuilt "$RUNNER_TEMP/package-source/"*
          "$RUNNER_TEMP/package-consumer/bin/python" -m pip install --no-deps --force-reinstall rebuilt/*.whl --report sdist-install.json
          cd "$RUNNER_TEMP/package-consumer-cwd"
          "$RUNNER_TEMP/package-consumer/bin/python" "$GITHUB_WORKSPACE/scripts/check-installed.py" > "$GITHUB_WORKSPACE/sdist-consumer.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/
            SHA256SUMS
            SOURCE-COMMIT
            wheel-install.json
            sdist-install.json
            wheel-consumer.json
            sdist-consumer.json
          if-no-files-found: error
          retention-days: 30

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'probityai/agent-evidence-observer'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: qualified-artifacts
      - name: Check the qualified artifact hashes and source after transfer
        run: |
          cd qualified-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: Attest the checked wheel and source distribution
        id: build-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: qualified-artifacts/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-build-provenance
          path: ${{ steps.build-provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'probityai/agent-evidence-observer'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/agent-evidence-observer/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: release-artifacts
      - name: Check the qualified artifact hashes after transfer
        run: cd release-artifacts && sha256sum --check SHA256SUMS
      - name: Publish the checked distributions with provenance
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist/
          attestations: true
