name: Eight component installed host chain
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'interop/eight-component-host-2026-10-02/**'
      - '.github/workflows/eight-component-host.yml'
  push:
    branches: [main]
    paths:
      - 'interop/eight-component-host-2026-10-02/**'
      - '.github/workflows/eight-component-host.yml'
permissions:
  contents: read
jobs:
  installed-native-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: interop/eight-component-host-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Select original eight source snapshots and retain every Git stream
        run: |
          mkdir -p "$RUNNER_TEMP/kit-raw"
          python materialize_sources.py --output "$RUNNER_TEMP/kit-sources" --logs "$RUNNER_TEMP/kit-raw/source-installation"
      - name: Build and normally install three exact-source wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock --report "$RUNNER_TEMP/kit-raw/dependency-install.json"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/kit-wheels" "$RUNNER_TEMP/kit-sources/agent-evidence-observer" "$RUNNER_TEMP/kit-sources/agent-evidence-vectors" "$RUNNER_TEMP/kit-sources/probity-verify" > "$RUNNER_TEMP/kit-raw/wheel-build.log" 2>&1
          python -m pip install --no-deps "$RUNNER_TEMP/kit-wheels/"*.whl --report "$RUNNER_TEMP/kit-raw/wheel-install.json"
          python -m pip check
      - name: Normally install locked native Rust crates and pinned official OPA
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          cargo +1.89.0 install --locked --path rust --root "$RUNNER_TEMP/kit-tools" > "$RUNNER_TEMP/kit-raw/cargo-install.log" 2>&1
          cargo +1.89.0 fmt --manifest-path rust/Cargo.toml --check
          cargo +1.89.0 clippy --locked --manifest-path rust/Cargo.toml -- -D warnings
          curl --fail --location --max-time 90 https://github.com/open-policy-agent/opa/releases/download/v1.18.0/opa_linux_amd64_static --output "$RUNNER_TEMP/kit-tools/opa"
          chmod +x "$RUNNER_TEMP/kit-tools/opa"
          printf '65d700b14b99b354982b61031b40bdc8e316ea93dadd61818f066d1d9a69dcce  %s\n' "$RUNNER_TEMP/kit-tools/opa" | sha256sum --check
          "$RUNNER_TEMP/kit-tools/opa" version > "$RUNNER_TEMP/kit-raw/opa-version.txt"
      - name: Prepare external host selection before any candidate child
        run: |
          python -B prepare_host.py --sources "$RUNNER_TEMP/kit-sources" --byte-gate "$RUNNER_TEMP/kit-tools/bin/probity-host-byte-gate" --opa "$RUNNER_TEMP/kit-tools/opa" --wheels "$RUNNER_TEMP/kit-wheels" --output "$RUNNER_TEMP/kit-trusted" > "$RUNNER_TEMP/kit-host-selection.sha256"
          python -S -B prepare_candidate.py --sources "$RUNNER_TEMP/kit-sources" --output "$RUNNER_TEMP/kit-candidate"
          echo "PROBITY_KIT_INSTALLATION=$RUNNER_TEMP/kit-trusted/installation.json" >> "$GITHUB_ENV"
          echo "PROBITY_KIT_INSTALLATION_SHA256=$(cat "$RUNNER_TEMP/kit-host-selection.sha256")" >> "$GITHUB_ENV"
      - name: Verify native boundaries and retained hard-exit recovery mutants
        run: |
          python -B -m ruff check trust.py prepare_host.py prepare_candidate.py materialize_sources.py native_gate.py target_worker.py run_host.py tests
          python -B -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' trust.py prepare_host.py prepare_candidate.py materialize_sources.py native_gate.py target_worker.py run_host.py tests
          python -B -m pytest -q tests --basetemp "$RUNNER_TEMP/kit-raw/test-cases" --junitxml="$RUNNER_TEMP/kit-raw/test-results.xml"
      - name: Retain a fresh complete selected all-eight-component measurement
        run: |
          timeout --signal=TERM --kill-after=5s 90s python -S -B run_host.py --installation "$PROBITY_KIT_INSTALLATION" --installation-sha256 "$PROBITY_KIT_INSTALLATION_SHA256" --candidate "$RUNNER_TEMP/kit-candidate" --output "$RUNNER_TEMP/kit-raw/fresh-completed" > "$RUNNER_TEMP/kit-raw/fresh-completed.json"
          cp "$RUNNER_TEMP/kit-host-selection.sha256" "$RUNNER_TEMP/kit-raw/host-selection-sha256.txt"
      - name: Retain whole raw streams, refusal controls, original reference and wheels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eight-component-host-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kit-raw/
            ${{ runner.temp }}/kit-wheels/
          if-no-files-found: error
          retention-days: 90
