name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: README shape
        run: python -B scripts/readme-lint.py README.md
      - name: Every version a page names equals its manifest
        run: |
          python -B scripts/version-pins.py check
          python -B scripts/version-pins-test.py
      - name: README example runs as written
        run: |
          evaluator-replay verify tests/fixtures/accept-3
          if evaluator-replay verify tests/fixtures/gap-2 --pin tests/fixtures/accept-3/pin.json; then
            echo "the gap fixture replayed intact"; exit 1
          fi
