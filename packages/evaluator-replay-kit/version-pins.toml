# Where each version this package's pages name is decided; the .github repository's version-pins script
# holds every page to it. Paths are relative to the repository root: the package workflows run
# `python3 -B scripts/version-pins.py check --root . --config packages/evaluator-replay-kit/version-pins.toml`
# from a checkout of probityai/.github. A release bumps pyproject.toml and runs the script's `write` mode
# the same way in the same pull request, before the tag.
repository = "probityai/probity"

# Released as a GitHub release of tag evaluator-replay-kit-v<version>; nothing goes to a registry.
[[own]]
key = "github:evaluator-replay-kit"
manifest = "packages/evaluator-replay-kit/pyproject.toml"
pages = ["packages/evaluator-replay-kit/README.md"]
tag = "evaluator-replay-kit-v{version}"

[scan]
include = ["packages/evaluator-replay-kit/**/*.md"]
skip = ["packages/evaluator-replay-kit/tests/fixtures/**"]
