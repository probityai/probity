# Where each version this repository's pages name is decided; the .github repository's version-pins script
# holds every page to it. A release bumps pyproject.toml and runs
# `gh api repos/probityai/.github/contents/scripts/version-pins.py -H 'Accept: application/vnd.github.raw' | python3 - write` in the same pull request, before the tag.
repository = "probityai/evaluator-replay-kit"

# Released as a GitHub release of tag v<version>; nothing goes to a registry.
[[own]]
key = "github:evaluator-replay-kit"
manifest = "pyproject.toml"
pages = ["README.md"]

[scan]
skip = ["tests/fixtures/**"]
