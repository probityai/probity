[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-a2a"
version = "0.2.0"
description = "Verify A2A agent card signatures over the bytes the server sent, with the a2a-jcs-v01 vectors, a 43-card corpus and a 42-URL webhook SSRF corpus"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["rfc8785>=0.1.4,<1", "joserfc>=1.7.6,<2"]
keywords = ["a2a", "agent-card", "jcs", "rfc8785", "jws", "ssrf", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/probityai/probity/tree/main/packages/agent-evidence-a2a"
Issues = "https://github.com/probityai/probity/issues"

[project.optional-dependencies]
# a2a-sdk brings the protobuf descriptors the schema-table test compares the shipped table with.
test = ["pytest>=9.2.0,<10", "cryptography>=46,<51", "a2a-sdk>=1.1.5,<2"]

[project.scripts]
agent-evidence-a2a = "agent_evidence_a2a.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["agent_evidence_a2a"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"agent_evidence_a2a" = ["py.typed", "data/*.json", "data/*.jsonl", "data/*.tsv", "data/cards/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
