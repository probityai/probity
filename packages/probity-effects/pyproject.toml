[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-effects"
version = "0.1.0"
description = "Keep one effect per agent tool call when its reply is lost: reconcile before resend, record the trail, test it in CI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Sankalp Gilda"}]
dependencies = ["jcs-admit~=0.1.1"]
keywords = ["ai-agents", "langgraph", "tool-calls", "idempotency", "retries", "exactly-once"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Documentation = "https://github.com/probityai/probity/blob/main/packages/probity-effects/docs/DESIGN.md"
Source = "https://github.com/probityai/probity/tree/main/packages/probity-effects"
Issues = "https://github.com/probityai/probity/issues"

[project.optional-dependencies]
# What a user installs to run the lost-reply scenarios against their own tools.
testing = ["pytest>=8,<10", "agent-evidence-vectors~=0.32.1"]

[project.entry-points.pytest11]
probity_effects = "probity_effects.pytest_plugin"

# This member keeps its own uv.lock and stays outside the root workspace (ruling of the workspace owner, 2 Nov 2026):
# it targets Python 3.11+ and its only runtime dependency is jcs-admit, so one root lock would only narrow it.
[dependency-groups]
# This member's own tests: the frameworks the adapters drive, pinned to the versions measured.
dev = [
    "pytest>=9.2.0,<10",
    "agent-evidence-vectors~=0.32.1",
    "langgraph==1.2.19",
    "openai-agents==0.24.0",
    "ag2==1.2.2",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
