# Where each version this package's pages name is decided; the .github repository's version-pins script
# holds every page to it. Paths are relative to the repository root: the package workflows run
# `python3 -B scripts/version-pins.py check --root . --config packages/agent-evidence-mcp/version-pins.toml`
# from a checkout of probityai/.github. A release bumps pyproject.toml and runs the script's `write` mode
# the same way in the same pull request, before the tag, so the PyPI page built from the tagged commit
# names the version it publishes.
repository = "probityai/probity"

# PyPI renders README.md, so it may carry no relative link.
registry_pages = { "packages/agent-evidence-mcp/README.md" = "pypi:agent-evidence-mcp" }

[[own]]
key = "pypi:agent-evidence-mcp"
manifest = "packages/agent-evidence-mcp/pyproject.toml"
pages = ["packages/agent-evidence-mcp/README.md"]
tag = "agent-evidence-mcp-v{version}"
publisher = "probityai/probity"

# Packages other repositories release that a page here names.
[family]
"pypi:agent-evidence-verify" = "0.3.0"
"pypi:agent-evidence-vectors" = "0.32.1"
"pypi:agent-evidence-vocabulary" = "0.8.0"
"pypi:agent-evidence-admission" = "0.2.0"
"pypi:jcs-admit" = "0.1.1"
"action:agent-evidence-vectors" = "0.32.1"

[scan]
include = ["packages/agent-evidence-mcp/**/*.md", "packages/agent-evidence-mcp/llms*.txt"]
