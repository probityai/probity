# Where each version this repository's pages name is decided; scripts/version-pins.py
# holds every page to it. A release bumps pyproject.toml and runs
# `python3 scripts/version-pins.py write` in the same pull request, before the tag,
# so the PyPI page built from the tagged commit names the version it publishes.
repository = "probityai/agent-evidence-mcp"

# PyPI renders README.md, so it may carry no relative link.
registry_pages = { "README.md" = "pypi:agent-evidence-mcp" }

[[own]]
key = "pypi:agent-evidence-mcp"
manifest = "pyproject.toml"
pages = ["README.md"]
publisher = "probityai/agent-evidence-mcp"

# Packages other repositories release that a page here names.
[family]
"pypi:probity-verify" = "0.3.0"
"pypi:agent-evidence-vectors" = "0.31.0"
"pypi:agent-evidence-vocabulary" = "0.8.0"
"pypi:agent-evidence-admission" = "0.2.0"
"pypi:jcs-admit" = "0.1.0"
"action:agent-evidence-vectors" = "0.31.0"
