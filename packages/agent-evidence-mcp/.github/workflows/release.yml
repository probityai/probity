name: release

# Publishes the checked wheel and source distribution to PyPI through a trusted publisher
# (OIDC, no token). Only a non-prerelease GitHub release can reach the publish step, and its tag
# must be v<version> for the version in pyproject.toml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v7
      - name: the tag names the packaged version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: the tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: tests
        run: |
          uv venv --python 3.12
          uv pip install -e ".[test]"
          .venv/bin/python -m pytest -q
      - name: build
        run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
