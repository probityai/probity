[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-records"
version = "0.2.0"
description = "Signed, offline-verifiable records of agent tool calls: single-use permits, approval binding and lost-reply outcomes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Sankalp Gilda"}]
dependencies = [
    "cryptography>=44,<51",
    "jcs-admit~=0.1.1",
    "agent-evidence-verify>=0.5.1,<0.7",
    "agent-evidence-vectors>=0.39.0,<0.40",
]
keywords = ["ai-agents", "dsse", "in-toto", "approvals", "tool-calls", "audit"]

[project.urls]
Source = "https://github.com/probityai/probity/tree/main/packages/probity-records"
Issues = "https://github.com/probityai/probity/issues"

# Kept outside the root workspace lock, like probity-effects: the framework integrations that
# depend on it bring their own dependency trees.
[dependency-groups]
dev = ["pytest>=9.2.0,<10"]
