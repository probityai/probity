[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-protected-operator-reference"
version = "0.0.1"
description = "Offline reader of retained protected-action authorization journals"
readme = "PROFILE.md"
requires-python = ">=3.12"
dependencies = ["agent-evidence-observer==0.2.0", "probity-witness-operator-reference==0.0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["probity_protected_operator*"]
