[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-verify"
version = "0.1.0"
description = "Relying-party adjudication of claims against pinned evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests", "vectors-source-coverage/tests", "vectors-operand-lineage/tests"]

[project.scripts]
agent-evidence-verify = "agent_evidence_verify.cli:main"
probity-bundle = "agent_evidence_verify.bundle:main"
probity-index = "agent_evidence_verify.index:main"

[tool.setuptools.packages.find]
where = ["src"]
