[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-joint-recovery-reader"
version = "0.0.2"
requires-python = ">=3.12"
dependencies = ["agent-evidence-observer==0.1.2"]
description = "Selected offline reader for native joint worker, target and current-authority recovery"

[project.scripts]
probity-read-joint-recovery = "joint_reader:main"
probity-gate-joint-recovery = "joint_host_gate:main"

[tool.setuptools]
py-modules = ["joint_common", "joint_reader", "joint_host_gate"]
