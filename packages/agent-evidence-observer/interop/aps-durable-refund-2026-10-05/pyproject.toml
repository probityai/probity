[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-aps-refund-controls"
version = "0.0.1"
description = "Native APS approval binding and durable local refund-record controls"
requires-python = ">=3.12"
dependencies = ["agent-evidence-observer==0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["probity_aps_refund*"]
