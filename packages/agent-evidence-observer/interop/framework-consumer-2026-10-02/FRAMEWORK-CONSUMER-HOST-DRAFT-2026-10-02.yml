name: Selected framework record gate
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'evidence/langgraph/**'
      - 'evidence/pydantic/**'
      - 'policy/framework/**'
      - '.ci/framework-consumer/**'
      - '.github/workflows/framework-record-gate.yml'
permissions:
  contents: read
jobs:
  read-selected-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/agent-evidence-observer
          ref: 34550d7d20c8149ae88d7ba3fcc5e51e1e70e1eb
          path: selected-observer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install selected reader and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .ci/framework-consumer/FRAMEWORK-CONSUMER-REQUIREMENTS-2026-10-02.lock --report "$RUNNER_TEMP/framework-install.json"
      - name: Build and normally install dedicated readers
        shell: bash
        run: |
          set -euo pipefail
          bash .ci/framework-consumer/FRAMEWORK-CONSUMER-BUILD-2026-10-02.sh selected-observer "$RUNNER_TEMP/framework-wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP/framework-wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/framework-wheels/probity_langgraph_ticket_reader-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/framework-wheels/probity_pydantic_ticket_reader-0.0.1-py3-none-any.whl"
          python -m pip check
          python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('langgraph', 'pydantic_ai', 'inspect_ai'))"
      - name: Read host-selected historical records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/framework-reports"
          python - <<'PY'
          from pathlib import Path
          for profile in ('langgraph', 'pydantic'):
              packet = Path('evidence') / profile / 'packet'
              pins = Path('policy/framework') / (profile + '-pins.json')
              assert packet.is_dir() and pins.is_file() and not pins.is_symlink()
              assert not pins.resolve().is_relative_to(packet.resolve())
          PY
          probity-langgraph-read evidence/langgraph/packet --pins-file policy/framework/langgraph-pins.json > "$RUNNER_TEMP/framework-reports/langgraph.json"
          probity-pydantic-read evidence/pydantic/packet --pins-file policy/framework/pydantic-pins.json > "$RUNNER_TEMP/framework-reports/pydantic.json"
      - name: Require complete bounded reports before publication
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/framework-reports" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name, profile, count in (('langgraph', 'probity-langgraph-aae-ticket-v0', 6), ('pydantic', 'probity-pydantic-ai-ticket-v0', 5)):
              report = json.loads((root / (name + '.json')).read_bytes())
              assert report['profile'] == profile and report['status'] == 'verified'
              assert type(report['plannedAttempts']) is int and report['plannedAttempts'] == count
              assert len(report['records']) == count
          PY
      - name: Retain read and installation receipts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-framework-record-gate
          path: |
            ${{ runner.temp }}/framework-reports/
            ${{ runner.temp }}/framework-wheels/build-record.json
            ${{ runner.temp }}/framework-install.json
          if-no-files-found: error
          retention-days: 90
