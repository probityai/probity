[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-observer"
version = "0.2.0"
description = "Check retained agent-evidence packets, histories and native reports offline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Sankalp Gilda"}]
keywords = ["ai-agents", "observability", "audit-logs", "provenance", "attestation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
]
requires-python = ">=3.12"
dependencies = ["cryptography>=46,<51", "rfc8785==0.1.4"]

[project.urls]
Documentation = "https://github.com/probityai/probity/blob/main/packages/agent-evidence-observer/docs/INSTALLATION.md"
Source = "https://github.com/probityai/probity/tree/main/packages/agent-evidence-observer"
Issues = "https://github.com/probityai/probity/issues"
"Agent guide" = "https://github.com/probityai/probity/blob/main/packages/agent-evidence-observer/llms.txt"

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "jsonschema>=4,<5"]
inspect = ["inspect-ai==0.3.287"]
inspect-historical = ["inspect-ai==0.3.281"]
witness = ["jcs-admit~=0.1.0"]
cover = ["coverage>=7.10,<8"]

[project.scripts]
agent-evidence-observer = "probity_observer.cli:main"
agent-evidence-read-native = "probity_observer.native_reader:main"
agent-evidence-read-atomic = "probity_observer.atomic_reader:main"
agent-evidence-read-refund-handoff = "probity_observer.refund_handoff:main"
agent-evidence-witness = "probity_observer.witness.cli:main"

[project.entry-points.inspect_ai]
agent_evidence_observer = "probity_observer.inspect_hook"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
