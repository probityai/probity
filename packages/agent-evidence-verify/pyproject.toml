[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-verify"
version = "0.5.0"
description = "Check claims against pinned evidence offline, with replayable decisions"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["cryptography>=50.0.2,<51", "agent-evidence-vocabulary>=0.8.0,<0.10", "pyyaml>=6.0.2,<7"]
keywords = ["ai-agents", "evidence-verification", "provenance", "offline", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Documentation = "https://github.com/probityai/probity/blob/main/packages/agent-evidence-verify/docs/install.md"
Source = "https://github.com/probityai/probity/tree/main/packages/agent-evidence-verify"
Issues = "https://github.com/probityai/probity/issues"
"Agent guide" = "https://github.com/probityai/probity/blob/main/packages/agent-evidence-verify/llms.txt"

[project.optional-dependencies]
test = ["pytest>=9.2.0,<10", "hypothesis>=6.170.14,<7"]
a2a = ["a2a-sdk[http-server]==1.3.0", "uvicorn==0.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "vectors-source-coverage/tests", "vectors-operand-lineage/tests",
             "vectors-done-checks/tests"]

[project.scripts]
agent-evidence-verify = "agent_evidence_verify.cli:main"
probity-bundle = "agent_evidence_verify.bundle:main"
probity-index = "agent_evidence_verify.index:main"
probity-a2a = "agent_evidence_verify.a2a_server:main"
probity-a2a-client = "agent_evidence_verify.a2a_client:main"

[project.entry-points."probityai.cli_subcommands"]
verify = "agent_evidence_verify.cli:register"

[tool.setuptools]
include-package-data = false
packages = ["agent_evidence_verify", "agent_evidence_verify.adapters", "agent_evidence_verify.samples"]
package-dir = {"" = "src", "agent_evidence_verify.samples" = "examples/source-coverage"}

[tool.setuptools.package-data]
"agent_evidence_verify" = ["receipt-verdict-codes.json"]
"agent_evidence_verify.samples" = ["*.json", "*.html", "*.txt"]
