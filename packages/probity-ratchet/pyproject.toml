[project]
name = "probity-ratchet"
version = "0.4.0"
description = "An agent harness that turns each failure into a proven guard or procedure, with every version and proof kept in MongoDB Atlas."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Sankalp Gilda"}]
keywords = ["ai-agents", "regression-testing", "evaluation", "attestation", "guards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "cryptography>=44",
    "jcs-admit~=0.1.0",
    "rich>=15.0.0",
    "agent-evidence-verify>=0.5.0,<0.7",
    "agent-evidence-vectors>=0.31.0,<1.0",
    "probity-ratchet-cases~=0.2.0",
]

[project.scripts]
ratchet = "ratchet.cli:main"

# The loop's seams (ratchet.improve.proposer) are filled by installed plug-ins through the
# ratchet.proposers and ratchet.parent_choosers entry-point groups; this package registers none.

[project.urls]
Source = "https://github.com/probityai/probity/tree/main/packages/probity-ratchet"
Issues = "https://github.com/probityai/probity/issues"

[project.optional-dependencies]
# The hosted store (MongoDB Atlas: vector search over failure memory, change streams, activation
# transactions). Without it the signed file store (RATCHET_STORE_DIR) serves every command.
atlas = [
    "pymongo>=4.10",
]
# Raindrop telemetry (`ratchet evolve --raindrop`).
telemetry = [
    "raindrop-ai==0.0.75",
]
gepa = [
    "gepa==0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "securesystemslib[crypto]>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.hatch.build.targets.sdist]
# Ship what the repository tracks; never local demo output or tool state.
exclude = ["docs/demo/ids.env", "docs/demo/out", ".humanizer", "private", "captures", "research", "dist"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# langsmith (pulled in by some installs through langchain-core) registers a pytest plugin whose import calls
# asyncio.iscoroutinefunction, deprecated on Python 3.14, so -W error fails collection before any test runs.
# The suite uses nothing from that plugin.
addopts = "-W error -p no:langsmith_plugin"
