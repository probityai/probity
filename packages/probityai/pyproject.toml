[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "probityai"
version = "0.1.0"
description = "The probity command: one entry point for the evidence tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["probity-verify>=0.2.0"]
keywords = ["ai-agents", "evidence-verification", "provenance", "cli"]

[project.urls]
Source = "https://github.com/probityai/probity/tree/main/packages/probityai"
Issues = "https://github.com/probityai/probity/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
probity = "probityai.cli:main"

[tool.uv.sources]
probity-verify = { workspace = true }

[tool.setuptools]
include-package-data = false
packages = ["probityai"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
