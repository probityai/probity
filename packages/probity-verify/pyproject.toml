[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-verify"
version = "0.2.1"
description = "Check claims against pinned evidence offline, with replayable decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=50.0.2,<51", "agent-evidence-vocabulary~=0.7.0", "pyyaml>=6.0.2,<7"]
keywords = ["ai-agents", "evidence-verification", "provenance", "offline", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Documentation = "https://github.com/probityai/probity/blob/main/packages/probity-verify/docs/install.md"
Source = "https://github.com/probityai/probity/tree/main/packages/probity-verify"
Issues = "https://github.com/probityai/probity/issues"
"Agent guide" = "https://github.com/probityai/probity/blob/main/packages/probity-verify/llms.txt"

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6.170.8,<7"]
a2a = ["a2a-sdk[http-server]==1.2.2", "uvicorn==0.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "vectors-source-coverage/tests", "vectors-operand-lineage/tests",
             "vectors-done-checks/tests"]

[project.scripts]
probity-verify = "probity_verify.cli:main"
probity-bundle = "probity_verify.bundle:main"
probity-index = "probity_verify.index:main"
probity-a2a = "probity_verify.a2a_server:main"
probity-a2a-client = "probity_verify.a2a_client:main"

[project.entry-points."probityai.cli_subcommands"]
verify = "probity_verify.cli:register"

[tool.setuptools]
include-package-data = false
packages = ["probity_verify", "probity_verify.adapters", "probity_verify.samples"]
package-dir = {"" = "src", "probity_verify.samples" = "examples/source-coverage"}

[tool.setuptools.package-data]
"probity_verify.samples" = ["*.json", "*.html", "*.txt"]
