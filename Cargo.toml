# Cargo workspace for the Rust crates. Each crate keeps its own crates.io name,
# version and licence. Every directory under crates/ is a member.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
repository = "https://github.com/probityai/probity"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
