# Where each version this package's pages name is decided; the .github repository's version-pins script
# holds every page to it. Paths are relative to the repository root: the package workflows run
# `python3 -B scripts/version-pins.py check --root . --config harnesses/agent-evidence-plugins/version-pins.toml`
# from a checkout of probityai/.github. A release bumps pyproject.toml and runs the script's `write` mode
# the same way in the same pull request, before the tag.
repository = "probityai/probity"

# Released as a GitHub release of tag agent-evidence-plugins-v<version>; nothing goes to a registry.
[[own]]
key = "github:agent-evidence-plugins"
manifest = "harnesses/agent-evidence-plugins/pyproject.toml"
pages = ["harnesses/agent-evidence-plugins/README.md"]
tag = "agent-evidence-plugins-v{version}"

# Packages other repositories release that this package pins.
[family]
"pypi:probity-verify" = "0.4.1"

[scan]
include = ["harnesses/agent-evidence-plugins/**/*.md", "harnesses/agent-evidence-plugins/**/llms.txt", "harnesses/agent-evidence-plugins/pyproject.toml", "harnesses/agent-evidence-plugins/plugins/**/*.py"]
skip = ["harnesses/agent-evidence-plugins/tests/fixtures/*.zip"]
