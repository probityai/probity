# The benchmark harness for probity-ratchet: the environment `ratchet.bench` runs and is type-checked in.
# It is not a distribution and not a member of the root workspace. Its benchmarks are not on PyPI under
# their own names (PyPI `tau2` is an unrelated package), so it needs git sources, overrides and dependency
# metadata; they live here, with their own uv.lock, so no uv call under the repository root inherits them.
[project]
name = "ratchet-bench"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "probity-ratchet[atlas,telemetry,gepa]",
    "probity-ratchet-cases",
    "probity-verify",
    # the transfer driver persists its runs in Atlas
    "pymongo>=4.10",
    "agentdojo==0.1.35",
    "litellm==1.106.6",
    "terminal-bench==0.2.18",
    "tau-bench",
    "tool-sandbox",
    "tau2",
    "audioop-lts==0.2.2 ; python_full_version >= '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "securesystemslib[crypto]>=1.0",
]

[tool.uv]
package = false
# tau2-bench caps litellm below 1.82.7 only to keep out the two compromised PyPI releases (1.82.7, 1.82.8;
# tau2-bench commit e40aba6). The harness pins litellm 1.106.6, a later clean release.
# litellm (every release through 1.106.6) declares filelock<4.0, which keeps filelock on 3.x and three open
# advisories. litellm calls only FileLock(path, timeout=, mode=) in its proxy CLI, an interface filelock 4.x
# keeps, and filelock 4.0 changed only SoftReadWriteLock, which litellm does not use. The override lifts the
# cap; drop it once litellm lifts the cap upstream (BerriAI/litellm#48394, still open).
override-dependencies = ["litellm==1.106.6", "filelock>=4.2.1"]

[tool.uv.sources]
# The ratchet and its case suite from this tree, editable, so the harness tests the code beside it.
probity-ratchet = { path = "../../packages/probity-ratchet", editable = true }
probity-ratchet-cases = { path = "../../packages/probity-ratchet-cases", editable = true }
# probity-verify comes from this tree too: probity-ratchet is a root workspace member, so uv applies the
# root's `probity-verify = { workspace = true }` source to it, and a second, different source here would conflict.
probity-verify = { path = "../../packages/probity-verify", editable = true }
tau-bench = { git = "https://github.com/sierra-research/tau-bench", rev = "59a200c6d575d595120f1cb70fea53cef0632f6b" }
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699" }
tool-sandbox = { git = "https://github.com/apple/ToolSandbox", rev = "c8571d7854316d2e1c5f288e59fe1e34e53f6dd1" }

[[tool.uv.dependency-metadata]]
# The tool-sandbox package pins every dependency exactly (pydantic 2.7.4 conflicts with raindrop-ai, which needs
# pydantic>=2.9; numpy 1.26.4 and openai 1.17.0 conflict with the versions already locked) and declares
# clients for model providers the adapter never imports. This is the metadata for the modules that
# `ratchet.bench.toolsandbox` loads: the conflicting pins are relaxed, and polars stays at 0.20.31 because
# tool-sandbox imports `polars.type_aliases`, which later polars releases removed. pint is unpinned because
# 0.23 calls `numpy.cumproduct`, which numpy 2 removed.
# geopy is raised from 2.4.1 to 2.5.0, the first release that fixes the ReDoS in geopy.Point.
name = "tool-sandbox"
version = "0.0.1"
requires-dist = [
    "attrs",
    "ccy==1.3.1",
    "decorator==5.1.1",
    "dill==0.3.8",
    "geopy>=2.5.0",
    "holidays==0.51",
    "jsonschema",
    "langchain-core",
    "networkx==3.2.1",
    "numpy",
    "openai",
    "phonenumbers==8.13.39",
    "pint",
    "polars==0.20.31",
    "pydantic",
    "pyyaml",
    "rapidfuzz",
    "requests",
    "rouge-score==0.1.2",
    "scipy",
    "strenum==0.4.15",
    "tenacity",
    "tqdm",
    "typing-extensions",
]
