# Which job runs for which changed paths. scripts/ci_select.py reads this file and
# .github/workflows/ci.yml reads the answer; tests/test_ci_select.py keeps the two in step.
#
# paths: GitHub path-filter globs (* does not cross a slash, ** does). A job runs when a
#        changed path matches one of them, and on every event that selects everything.
# tier:  "fast" jobs run on a pull request and again on the merge queue batch; "full"
#        jobs run only on the merge queue batch, a push to main and a manual run.
# schedule: true runs the job on the weekly schedule, with every other job skipped.
#
# A change to ci.yml, scripts/ci_select.py or this file selects every job.

[jobs.family-resolves]
paths = ["packages/**/pyproject.toml", "scripts/family_resolves.py", "tests/test_family_resolves.py"]
tier = "fast"

[jobs.observer-a2a-history-boundary]
paths = ["packages/agent-evidence-observer/interop/a2a-history-boundary-2026-10-02/**"]
tier = "fast"

